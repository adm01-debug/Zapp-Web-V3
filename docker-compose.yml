services:
  zapp-web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?required}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?required}
        VITE_EXTERNAL_SUPABASE_URL: ${VITE_EXTERNAL_SUPABASE_URL:-${VITE_SUPABASE_URL}}
        VITE_EXTERNAL_SUPABASE_ANON_KEY: ${VITE_EXTERNAL_SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY}}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    image: ${ZAPP_WEB_IMAGE:-zapp-web:local}
    container_name: zapp-web
    restart: unless-stopped
    networks:
      - atomicabr
    labels:
      - traefik.enable=true
      - traefik.http.routers.zapp-web.rule=Host(`${ZAPP_WEB_HOST:-zapp.atomicabr.com.br}`)
      - traefik.http.routers.zapp-web.entrypoints=websecure
      - traefik.http.routers.zapp-web.tls=true
      - traefik.http.routers.zapp-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.zapp-web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  atomicabr:
    external: true
