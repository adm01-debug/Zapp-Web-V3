# ANTES do login (sem JWT). A funcao verifica auth internamente para 'clear'
# via authClient.auth.getUser() + comparacao de email. Rate-limiting por IP
# (60 req/60s) protege contra abuso sem necessitar de JWT.
[functions.login-attempts]
verify_jwt = false

