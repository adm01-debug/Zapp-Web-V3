# BANCO CANONICO: supabase.atomicabr.com.br (self-hosted VPS)
# Projeto cloud de origem (descontinuado em 2026-08-01); refs em docs/cutover/.
# Referência apenas — o runtime é o self-hosted abaixo.
# Refs: docs/cutover/2026-06-30_RUNBOOK.md
# ATENÇÃO: o runtime self-hosted NÃO lê verify_jwt deste arquivo.
# A fonte de verdade é a allowlist em supabase/functions/main/index.ts.
# Este bloco só tem efeito em deploys para Supabase Cloud.
