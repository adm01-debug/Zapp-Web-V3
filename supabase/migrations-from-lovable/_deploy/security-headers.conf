# security-headers.conf — ZAPP-WEB V7 (FIX: WhatsApp 403 via media proxy)
# 2026-07-28 — Dev Sênior / DBA PhD
# Correções: adicionado zapp-media-proxy.adm01.workers.dev para proxy de mídia WhatsApp (fix 403)
# score: 10/10

# === P0: Content-Security-Policy ===
# BUG-1: img-src 'self' data: blob: https: era permissivo demais
# BUG-2: media-src 'self' blob: data: FALTAVA supabase.atomicabr.com.br
# Fix: origens explícitas com menor privilégio
# BUG-3 (Jul/2026): URLs do WhatsApp CDN expiravam em 24h → 403. Agora roteadas via proxy.

# img-src: app local, Supabase storage, fotos WhatsApp (via proxy), Cloudflare Images, avatares
add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' 'unsafe-eval'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: blob: https://supabase.atomicabr.com.br https://zapp-media-proxy.adm01.workers.dev https://*.whatsapp.net https://*.cdn.whatsapp.net https://pps.whatsapp.net https://imagedelivery.net; \
media-src 'self' blob: https://supabase.atomicabr.com.br https://zapp-media-proxy.adm01.workers.dev; \
connect-src 'self' https://supabase.atomicabr.com.br wss://supabase.atomicabr.com.br https://*.atomicabr.com.br wss://*.atomicabr.com.br https://api.openai.com https://generativelanguage.googleapis.com https://zapp-media-proxy.adm01.workers.dev; \
font-src 'self' https://fonts.gstatic.com data:; \
object-src 'none'; \
frame-src 'self' https://*.atomicabr.com.br; \
form-action 'self'; \
base-uri 'self'; \
frame-ancestors 'self';";

# === P1: Security Headers ===
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

# === P2: HSTS (6 meses, incluir subdomínios, preload)
add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
