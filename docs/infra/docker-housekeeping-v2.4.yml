version: "3.8"

# =============================================================================
# DOCKER-HOUSEKEEPING v2.4.3 — AtomicaBR — 2026-08-06
# v2.4.3 (GAP-3 fix, 2026-08-06):
#   - ensure_ref_tags: fallback `docker pull TAG` quando digest ausente localmente
#     (GAP-3 da auditoria 50 etapas). Se a imagem foi removida do host (novo nó
#     no swarm, limpeza manual), o pull recupera antes do prune_dangling agir.
#     Contador _PULLED separado para observabilidade. Alert individual por TAG
#     se o pull também falhar (ex: credencial expirada, imagem deletada do GHCR).
# v2.4.2 (auditoria pós-faxina, 2026-08-06):
#   - PRUNE_ZAPP_OLD HORÁRIA: separado para ciclo independente PRUNE_ZAPP_INTERVAL_S
#     (default 3600s). Antes rodava só no ciclo diário (TAGGED_INTERVAL_S=86400),
#     permitindo acúmulo de até +14 tags zapp entre purgas (gap GAP-2 da auditoria).
#     Com múltiplos deploys/dia, o host ficava com muito mais que ZAPP_KEEP_TAGS=6
#     imagens por até 24h. Agora poda a cada hora, limitando o acúmulo.
# v2.4 (validação rodada 2, 5 agentes):
#   - PRUNE_ZAPP_OLD: retenção HOST das imagens zapp (ETAPA 47 implementada) —
#     mantém só as ZAPP_KEEP_TAGS mais recentes (default 6) + Spec/PreviousSpec/
#     latest; poda o resto por TAG. Sem isso, cada deploy adiciona ~116MB imortal
#     ao host (gap MED W5: crescimento ilimitado).
#   - ensure_ref_tags com `timeout 300` (daemon travado não congela o ciclo) +
#     contadores/alert (P1 W1: inspect falho era no-op silencioso).
#   - prune_dangling loga `deleted=` (P2 W1).
# v2.3 (validação pós-faxina, 5 agentes):
#   - ENSURE_REF_TAGS: re-taga Spec+PreviousSpec de TODOS os serviços swarm antes
#     de cada prune — o prune_dangling apagaria a imagem do PreviousSpec untagged
#     em ≤1h, quebrando o rollback automático OFFLINE (gap ALTO W4).
#   - rmi por TAG em imagens multi-tag (rmi por ID falha 'referenced in multiple
#     repositories' → 'retida' para sempre; P2-1).
#   - zero-match da regex = protege TODAS as imagens + alerta (P2-2).
#   - ${PROTECTED_REPOS_REGEX:-} imune a set -u (P2-3).
# v2.2: PRUNE_TAGGED SEGURO — NUNCA mais `docker image prune -af` em tagged.
#   Root cause do bug: v2.1 usava -af --filter until=168h, que apagava imagens
#   TAGGED não-em-uso — incluindo a imagem de ROLLBACK do zapp-web
#   (production-fbd04bec303d), removida do host em 2026-08-04/05.
#   v2.2: loop rmi por imagem, protegendo: (a) imagens em uso por containers,
#   (b) TODAS as imagens do zapp-web (ghcr.io/adm01-debug/zapp-web-v3/zapp-web).
# =============================================================================

services:
  cleanup:
    image: docker:28-cli
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - AtomicaBRNet
    environment:
      TZ: "America/Sao_Paulo"
      DANGLING_INTERVAL_S: "3600"
      DANGLING_AGE: "30m"
      CACHE_INTERVAL_S: "21600"
      CACHE_AGE: "24h"
      TAGGED_INTERVAL_S: "86400"
      TAGGED_AGE: "168h"
      EMERGENCY_DISK_PCT: "80"
      EMERGENCY_DANGLING_AGE: "5m"
      EMERGENCY_CACHE_AGE: "1h"
      # Repos de imagem NUNCA podados pelo prune_tagged (regex ERE do awk).
      # Default: zapp-web (rollback). Regex vazia = protege TODAS (fail-safe).
      PROTECTED_REPOS_REGEX: "ghcr.io/adm01-debug/zapp-web-v3/zapp-web"
      # v2.4: nº de imagens zapp mantidas no HOST (por created, além de
      # Spec/PreviousSpec/latest que são SEMPRE protegidas). Poda as antigas.
      ZAPP_KEEP_TAGS: "6"
      # v2.4.2: intervalo independente para prune_zapp_old (1h). Antes ficava
      # dentro do TAGGED_INTERVAL_S (24h), permitindo acúmulo de tags por um dia.
      PRUNE_ZAPP_INTERVAL_S: "3600"
      ALERT_WEBHOOK_URL: "https://n8n.atomicabr.com.br/webhook/warroom-alert"
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "=== DOCKER-HOUSEKEEPING v2.4.3 boot $$(date -u +%FT%TZ) ==="
        alert() {
          _MSG="$$1"; _TS=$$(date -u +%FT%TZ)
          echo "[ALERT] $$_MSG"
          wget -q --post-data="{\"service\":\"docker-housekeeping\",\"msg\":\"$$_MSG\",\"ts\":\"$$_TS\"}" \
            --header="Content-Type: application/json" \
            "$$ALERT_WEBHOOK_URL" -O /dev/null 2>/dev/null || true
        }
        # v2.3: garante que as imagens referenciadas (Spec + PreviousSpec) de TODOS
        # os serviços swarm estão TAGADAS localmente — assim o prune_dangling não
        # as remove (tagada ≠ dangling) e o rollback automático fica OFFLINE.
        # case *:*@sha256:* exige TAG explícita (ref sem tag não é re-tagada —
        # evitaria docker tag repo:latest sequestrando o latest de terceiros).
        # v2.4: `timeout 300` (daemon travado não congela o ciclo) + contadores
        # e ALERT se o inspect falhar (P1 W1: antes era no-op 100% silencioso).
        ensure_ref_tags() {
          _OUT="$$(timeout 300 sh -c 'docker images --digests --no-trunc --format "{{.ID}} {{.Digest}}"' 2>/dev/null)"
          _MAP="$$_OUT"
          _REFS=0; _TAGGED=0; _NOID=0; _PULLED=0
          for REF in $$(docker service ls -q | xargs -r timeout 300 docker service inspect \
              --format '{{with .Spec.TaskTemplate.ContainerSpec.Image}}{{.}}{{end}} {{with .PreviousSpec.TaskTemplate.ContainerSpec.Image}}{{.}}{{end}}' 2>/dev/null); do
            case "$$REF" in
              *:*@sha256:*)
                _REFS=$$((_REFS+1))
                _DIG="sha256:$${REF##*@sha256:}"
                _TAG="$${REF%%@sha256:*}"
                _ID="$$(printf '%s\n' "$$_MAP" | awk -v d="$$_DIG" '$$2 == d {print $$1; exit}')"
                if [ -n "$$_ID" ]; then
                  docker tag "$$_ID" "$$_TAG" 2>/dev/null && _TAGGED=$$((_TAGGED+1)) || true
                else
                  # v2.4.3 GAP-3: digest ausente localmente — pull de recuperação.
                  # Usa TAG (sem digest) para que o daemon resolva o digest no registry.
                  # timeout 180s: pull lento nao congela o ciclo inteiro.
                  if timeout 180 docker pull "$$_TAG" >/dev/null 2>&1; then
                    _PULLED=$$((_PULLED+1))
                    _NEW_ID="$$(docker images --digests --no-trunc --format '{{.ID}} {{.Digest}}' 2>/dev/null | awk -v d="$$_DIG" '$$2 == d {print $$1; exit}')"
                    if [ -n "$$_NEW_ID" ]; then
                      docker tag "$$_NEW_ID" "$$_TAG" 2>/dev/null && _TAGGED=$$((_TAGGED+1)) || true
                    fi
                  else
                    _NOID=$$((_NOID+1))
                    alert "ensure_ref_tags: pull FALHOU para $$_TAG — imagem pode nao estar protegida do prune"
                  fi
                fi
                ;;
            esac
          done
          if [ "$$_REFS" -gt 0 ] && [ "$$_TAGGED" -eq 0 ]; then
            alert "ensure_ref_tags: NENHUMA ref tagada (sem_id_local=$$_NOID pulled=$$_PULLED) — verificar imagens/digests"
          fi
          echo "[ensure_ref_tags] refs=$$_REFS tagadas=$$_TAGGED pulled=$$_PULLED sem_id_local=$$_NOID"
        }
        # v2.4 (ETAPA 47): retenção HOST das imagens zapp — mantém as
        # ZAPP_KEEP_TAGS mais recentes por created + Spec/PreviousSpec/latest
        # (sempre protegidas); poda o resto por TAG. Limita o crescimento
        # (~116MB/deploy imortal antes desta função).
        prune_zapp_old() {
          _KEEP="$${ZAPP_KEEP_TAGS:-6}"
          _PROTECT=""
          for svc in $$(docker service ls -q); do
            # tr ' ' '\n' ANTES do sed: o --format emite Spec e PreviousSpec na
            # MESMA linha; sed 's/@sha256:.*//' greedy comeria do 1º @ ao fim da
            # linha, deixando o PreviousSpec FORA da proteção (defeito v2.4).
            _PROTECT="$$_PROTECT $$(docker service inspect "$$svc" --format '{{with .Spec.TaskTemplate.ContainerSpec.Image}}{{.}}{{end}} {{with .PreviousSpec.TaskTemplate.ContainerSpec.Image}}{{.}}{{end}}' 2>/dev/null | tr ' ' '\n' | sed 's/@sha256:.*//' | tr '\n' ' ')"
          done
          _PROTECT="$$_PROTECT ghcr.io/adm01-debug/zapp-web-v3/zapp-web:production-latest"
          # v2.4.1: lista materializada ANTES do loop — while-read em pipe roda em
          # subshell (POSIX/BusyBox) e zeraria os contadores. Refs não têm espaço.
          _LIST="$$(docker images --format '{{.Repository}}:{{.Tag}}|{{.CreatedAt}}' \
            | grep 'ghcr.io/adm01-debug/zapp-web-v3/zapp-web:production-' \
            | sort -t'|' -k2 -r \
            | tail -n +$$((_KEEP+1)) \
            | cut -d'|' -f1)"
          _REMOVED=0; _SKIPPED=0; _RETAINED=0
          for _TAG in $$_LIST; do
            case " $$_PROTECT " in *" $$_TAG "*) _SKIPPED=$$((_SKIPPED+1)); continue;; esac
            if docker rmi "$$_TAG" >/dev/null 2>&1; then _REMOVED=$$((_REMOVED+1)); else _RETAINED=$$((_RETAINED+1)); fi
          done
          echo "[zapp] removidas=$$_REMOVED protegidas=$$_SKIPPED retidas(em uso)=$$_RETAINED (keep=$$_KEEP)"
        }
        prune_dangling() { _AGE="$$1"; _LABEL="$$2"; _BEFORE=$$(docker images -f dangling=true -q 2>/dev/null | wc -l); _OUT=$$(docker image prune -f --filter "until=$${_AGE}" 2>&1 | tail -1); _AFTER=$$(docker images -f dangling=true -q 2>/dev/null | wc -l); echo "[$${_LABEL}] dangling>$${_AGE}: $${_OUT} deleted=$$((_BEFORE-_AFTER))"; }
        prune_cache() { _AGE="$$1"; _LABEL="$$2"; _OUT=$$(docker builder prune -af --filter "until=$${_AGE}" 2>&1 | tail -1); echo "[$${_LABEL}] cache>$${_AGE}: $${_OUT}"; }
        # v2.2: NUNCA `docker image prune -af`. Loop rmi por imagem com proteção:
        #   (a) imagens em uso por containers (running/stopped)
        #   (b) imagens de repos protegidos (default: zapp-web — rollback NUNCA é apagado)
        # Normalização: IDs em 64 hex SEM prefixo sha256: (docker inspect {{.Image}} e
        #   images --no-trunc produzem 'sha256:...'; docker images -q produz 12 hex curto).
        #   case de proteção exige lista separada por ESPAÇO (tr '\n' ' ').
        prune_tagged() {
          _AGE="$$1"; _LABEL="$$2"
          PROTECTED=$$(docker ps -aq | xargs -r docker inspect --format '{{.Image}}' 2>/dev/null | sed 's/^sha256://' | sort -u | tr '\n' ' ')
          PROTECTED="$$PROTECTED $$(docker images --no-trunc --format '{{.ID}} {{.Repository}}' | awk -v re="$${PROTECTED_REPOS_REGEX:-}" '$$2 ~ re {print $$1}' | sed 's/^sha256://' | sort -u | tr '\n' ' ')"
          # P2-2: regex configurada mas SEM nenhum match = typo/erro de config
          # → protege TODAS as imagens neste ciclo + alerta (fail-safe ativo).
          _NMATCH=$$(docker images --no-trunc --format '{{.Repository}}' | awk -v re="$${PROTECTED_REPOS_REGEX:-}" 're != "" && $$1 ~ re {n++} END {print n+0}')
          if [ -n "$${PROTECTED_REPOS_REGEX:-}" ] && [ "$$_NMATCH" -eq 0 ]; then
            alert "housekeeping: PROTECTED_REPOS_REGEX nao casou NENHUM repo — protegendo TODAS as imagens neste ciclo"
            PROTECTED="$$(docker images -q --no-trunc | sed 's/^sha256://' | tr '\n' ' ') $$PROTECTED"
          fi
          for IMG in $$(docker images -q --no-trunc --filter "until=$${_AGE}" | sed 's/^sha256://' | sort -u); do
            case " $$PROTECTED " in *" $$IMG "*) echo "[$${_LABEL}] SKIP protegida: $$IMG";; *)
              # P2-1: multi-tag → rmi por TAG (rmi por ID falha 'referenced in multiple repositories')
              _REPO_TAGS=$$(docker inspect --format '{{range .RepoTags}}{{.}} {{end}}' "$$IMG" 2>/dev/null)
              _REPO_TAGS=$${_REPO_TAGS% }
              if [ -z "$$_REPO_TAGS" ]; then
                _OUT=$$(docker rmi "$$IMG" 2>&1) && echo "[$${_LABEL}] removida: $$IMG" || echo "[$${_LABEL}] retida: $$IMG — $${_OUT}"
              else
                _REMOVED=0; _KEPT=0
                for _TAG in $$_REPO_TAGS; do
                  # NOTA (P3-7): este case é GLOB, não regex — com regex contendo
                  # '|' ou '\\.' não casaria; é camada redundante (o filtro externo
                  # por ID já protegeu o repo) — não confiar isoladamente.
                  case "$$_TAG" in *"$${PROTECTED_REPOS_REGEX:-}"*) echo "[$${_LABEL}] SKIP tag protegida: $$_TAG"; _KEPT=1; continue;; esac
                  if _OUT=$$(docker rmi "$$_TAG" 2>&1); then _REMOVED=1; else echo "[$${_LABEL}] retida: $$_TAG — $${_OUT}"; _KEPT=1; fi
                done
                [ "$$_REMOVED" = 1 ] && { [ "$$_KEPT" = 1 ] && echo "[$${_LABEL}] parcial: $$IMG (tags antigas removidas)" || echo "[$${_LABEL}] removida: $$IMG"; }
              fi;; esac
          done
        }
        disk_pct() { df -P / 2>/dev/null | awk 'NR==2 {gsub("%","",$$5); print $$5+0}'; }
        LAST_CACHE=0; LAST_TAGGED=0; LAST_PRUNE_ZAPP=0; CYCLE=0
        while true; do
          CYCLE=$$((CYCLE+1)); NOW=$$(date +%s); TS=$$(date -u +%FT%TZ); DISK=$$(disk_pct)
          echo ""; echo "[$${TS}] === cycle #$${CYCLE} disk=$${DISK}% ==="
          # v2.3: re-tagar refs ANTES de QUALQUER prune (incl. emergência) —
          # o PreviousSpec pode ter mudado desde o ciclo anterior.
          ensure_ref_tags
          if [ "$${DISK:-0}" -ge "$${EMERGENCY_DISK_PCT}" ]; then
            echo "[$${TS}] EMERGENCY: disk $${DISK}% >= $${EMERGENCY_DISK_PCT}%"
            prune_dangling "$${EMERGENCY_DANGLING_AGE}" "emerg"
            prune_cache "$${EMERGENCY_CACHE_AGE}" "emerg"
            DISK_AFTER=$$(disk_pct)
            alert "EMERGENCY prune: disk $${DISK}% -> $${DISK_AFTER}% (cycle #$${CYCLE})"
          fi
          BEFORE=$$(docker images -f dangling=true -q 2>/dev/null | wc -l)
          prune_dangling "$${DANGLING_AGE}" "hourly"
          AFTER=$$(docker images -f dangling=true -q 2>/dev/null | wc -l)
          echo "[$${TS}] dangling: $${BEFORE} -> $${AFTER} (removed $$((BEFORE - AFTER)))"
          if [ $$((NOW - LAST_CACHE)) -ge "$${CACHE_INTERVAL_S}" ]; then
            prune_cache "$${CACHE_AGE}" "6h"; LAST_CACHE=$${NOW}
          fi
          if [ $$((NOW - LAST_TAGGED)) -ge "$${TAGGED_INTERVAL_S}" ]; then
            prune_tagged "$${TAGGED_AGE}" "24h"; LAST_TAGGED=$${NOW}
          fi
          # v2.4.2: prune_zapp_old em ciclo HORÁRIO independente (era diário — GAP-2).
          # Evita acúmulo de >ZAPP_KEEP_TAGS imagens zapp por até 24h em dias de
          # múltiplos deploys. Roda separado do prune_tagged para não bloquear/atrasar.
          if [ $$((NOW - LAST_PRUNE_ZAPP)) -ge "$${PRUNE_ZAPP_INTERVAL_S}" ]; then
            prune_zapp_old; LAST_PRUNE_ZAPP=$${NOW}
          fi
          DISK_END=$$(disk_pct)
          echo "[$${TS}] cycle #$${CYCLE} done. disk_end=$${DISK_END}%"
          if [ "$${CYCLE}" -eq 1 ]; then
            alert "housekeeping v2.4.3 online: cycle #1 disk $${DISK}% -> $${DISK_END}%"
          fi
          sleep "$${DANGLING_INTERVAL_S}"
        done
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 0
        window: 120s
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
        reservations:
          memory: 32M
      labels:
        - traefik.enable=false
        - com.centurylinklabs.watchtower.enable=false
        - com.atomicabr.audit=docker-housekeeping-v2.4.3-2026-08-06-gap3-fallback-pull
        - com.atomicabr.requires-docker-sock=true
        - com.atomicabr.tier=critical

networks:
  AtomicaBRNet:
    external: true
    name: AtomicaBRNet
