# nginx-prod.conf — DEPLOYMENT TARGET: Direct VPS serving
#
# This file is used when serving the built dist/ directly from the VPS
# filesystem (e.g. via a systemd-managed nginx, NOT inside a Docker container).
#
# DOCKER deployments use nginx.conf (copied into the image at build time).
# Do NOT confuse the two:
#   - Docker:  COPY nginx.conf /etc/nginx/conf.d/default.conf
#   - VPS:     nginx -c /etc/nginx/sites-enabled/zapp-web-v3 (points here)
#
# The root path below (/workspace/repos/zapp-web-v3/dist) is intentional —
# it matches the VPS directory where 'bun run build' writes its output.
# Change it only if the VPS working directory changes.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /workspace/repos/zapp-web-v3/dist;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # CSP v10 — CANÔNICA (docs/csp.md) — mesma política do nginx.conf e vercel.json
    add_header Content-Security-Policy "default-src 'self'; manifest-src 'self' data: https://vercel.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://supabase.atomicabr.com.br https://allrjhkpuscmgbsnmjlv.supabase.co https://zapp-media-proxy.adm01.workers.dev https://*.googleusercontent.com https://lh3.googleusercontent.com https://*.whatsapp.net https://*.cdn.whatsapp.net https://pps.whatsapp.net https://imagedelivery.net https://*.fbcdn.net https://*.fbsbx.com https://img.youtube.com https://i.ytimg.com https://www.youtube.com; media-src 'self' data: blob: https://supabase.atomicabr.com.br https://zapp-media-proxy.adm01.workers.dev https://mmg.whatsapp.net https://*.whatsapp.net; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://supabase.atomicabr.com.br wss://supabase.atomicabr.com.br https://evolution.atomicabr.com.br https://n8n.atomicabr.com.br https://*.atomicabr.com.br wss://*.atomicabr.com.br wss: https://api.openai.com https://generativelanguage.googleapis.com https://api.pwnedpasswords.com https://api.mapbox.com https://zapp-media-proxy.adm01.workers.dev https://*.ingest.sentry.io https://*.sentry.io https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src 'self' https://*.atomicabr.com.br; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Static assets: immutable 1-year cache (hashed filenames from Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Health check endpoint — mirrors the Docker HEALTHCHECK target
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Sentry tunnel — espelha nginx.conf (deploy Docker). O SDK Sentry POSTa
    # envelopes same-origin aqui e o nginx repassa ao ingest (elimina CORS /
    # cache opaco de SW como modo de falha da telemetria). Query string
    # (?sentry_key=...&sentry_version=...) e preservada por padrao.
    # location EXATA (=) para nao capturar nenhum path alem de /sentry-tunnel.
    location = /sentry-tunnel {
        proxy_pass https://o4511422295179264.ingest.de.sentry.io/api/4511422298325072/envelope/;
        proxy_set_header Host o4511422295179264.ingest.de.sentry.io;
        proxy_ssl_server_name on;
        proxy_buffering off;
        client_max_body_size 2m;
    }

    # SPA fallback: all other requests serve index.html
    # ATENÇÃO: add_header NÃO herda do nível do server quando o bloco define o
    # seu próprio add_header — repetir os headers de segurança aqui (senão a
    # SPA é servida SEM CSP/XFO/nosniff/referrer/permissions/HSTS).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; manifest-src 'self' data: https://vercel.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://supabase.atomicabr.com.br https://allrjhkpuscmgbsnmjlv.supabase.co https://zapp-media-proxy.adm01.workers.dev https://*.googleusercontent.com https://lh3.googleusercontent.com https://*.whatsapp.net https://*.cdn.whatsapp.net https://pps.whatsapp.net https://imagedelivery.net https://*.fbcdn.net https://*.fbsbx.com https://img.youtube.com https://i.ytimg.com https://www.youtube.com; media-src 'self' data: blob: https://supabase.atomicabr.com.br https://zapp-media-proxy.adm01.workers.dev https://mmg.whatsapp.net https://*.whatsapp.net; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' data: blob: https://supabase.atomicabr.com.br wss://supabase.atomicabr.com.br https://evolution.atomicabr.com.br https://n8n.atomicabr.com.br https://*.atomicabr.com.br wss://*.atomicabr.com.br wss: https://api.openai.com https://generativelanguage.googleapis.com https://api.pwnedpasswords.com https://api.mapbox.com https://zapp-media-proxy.adm01.workers.dev https://*.ingest.sentry.io https://*.sentry.io https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src 'self' https://*.atomicabr.com.br; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    }
}
