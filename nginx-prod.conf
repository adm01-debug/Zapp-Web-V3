# nginx-prod.conf — DEPLOYMENT TARGET: Direct VPS serving
#
# This file is used when serving the built dist/ directly from the VPS
# filesystem (e.g. via a systemd-managed nginx, NOT inside a Docker container).
#
# DOCKER deployments use nginx.conf (copied into the image at build time).
# Do NOT confuse the two:
#   - Docker:  COPY nginx.conf /etc/nginx/conf.d/default.conf
#   - VPS:     nginx -c /etc/nginx/sites-enabled/zapp-web-v3 (points here)
#
# The root path below (/workspace/repos/zapp-web-v3/dist) is intentional —
# it matches the VPS directory where 'bun run build' writes its output.
# Change it only if the VPS working directory changes.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /workspace/repos/zapp-web-v3/dist;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static assets: immutable 1-year cache (hashed filenames from Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Health check endpoint — mirrors the Docker HEALTHCHECK target
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # SPA fallback: all other requests serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
