# MOVIDO do evolution-stack em 2026-08-15 (E29): mede edge functions do ZAPP, pertence a este repo.
version: "3.7"
# =============================================================================
# ATENCAO: Stack 239 (evolution-functions-health) foi DELETADA do Portainer
# em 2026-08-14 (desacoplamento zapp-web-v3). Este arquivo e referencia
# historica. Removido do gitops-stacks STACK_MAP na mesma data.
# Para recriar: importar este YAML no Portainer como nova stack manualmente.
