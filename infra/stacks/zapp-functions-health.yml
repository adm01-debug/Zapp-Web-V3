# evolution-functions-health — Stack 239 (recriado 2026-08-12 / deletado 2026-08-14)
# Usa config externo: check_functions_health
services:
  functions-health:
    image: alpine:3.19
    command: ["/bin/sh", "-c", "sleep 60; while true; do sh /scripts/check-functions-health.sh; sleep 300; done"]
    configs:
      - source: check_functions_health
        target: /scripts/check-functions-health.sh
        mode: 0555
    networks:
      - AtomicaBRNet
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - com.atomicabr.watchdog=functions-health
        - com.atomicabr.watchdog.cycle=5m
        - com.atomicabr.audit=recreated-2026-08-12-gitops-migration
configs:
  check_functions_health:
    external: true
networks:
  AtomicaBRNet:
    external: true
    name: AtomicaBRNet
