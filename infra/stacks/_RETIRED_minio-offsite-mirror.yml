version: "3.8"

services:
  mirror:
    image: minio/mc:latest
    network_mode: "container:<minio-container-id>"
    environment:
      OFFSITE_ENDPOINT: "${OFFSITE_ENDPOINT}"
      OFFSITE_ACCESS_KEY: "${OFFSITE_ACCESS_KEY}"
      OFFSITE_SECRET_KEY: "${OFFSITE_SECRET_KEY}"
      OFFSITE_BUCKET: "${OFFSITE_BUCKET}"
      LOCAL_ACCESS_KEY: "${LOCAL_ACCESS_KEY}"
      LOCAL_SECRET_KEY: "${LOCAL_SECRET_KEY}"
      TZ: "America/Sao_Paulo"
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local  http://localhost:9000 $$LOCAL_ACCESS_KEY $$LOCAL_SECRET_KEY
        mc alias set remote $$OFFSITE_ENDPOINT $$OFFSITE_ACCESS_KEY $$OFFSITE_SECRET_KEY
        mc mb --ignore-existing remote/$$OFFSITE_BUCKET || true
        mc mirror --overwrite --remove local/evolution-backups remote/$$OFFSITE_BUCKET
        exec mc mirror --overwrite --remove --watch local/evolution-backups remote/$$OFFSITE_BUCKET
