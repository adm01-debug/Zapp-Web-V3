version: "3.9"
services:

  # Reconcile mirror health: Evolution PG14 <-> Supabase
  # Thresholds: msg=10%, contact=500% (2026-08-08)
  evo-reconcile:
    image: postgres:14-alpine
    command:
      - /bin/sh
      - -c
      - |
        echo '' | base64 -d | gunzip > /tmp/reconcile-v1.sh
        exec sh /tmp/reconcile-v1.sh
    environment:
      - PGSUPA_DB=postgres
      - PGSUPA_HOST=db
      - PGSUPA_PORT=5432
      - PGSUPA_USER=postgres
      - RECONCILE_INTERVAL=900
      - TZ=America/Sao_Paulo
    hostname: evo-reconcile
    secrets:
      - pg_evolution_url_n8n_app_v1
      - supabase_db_password_v1
    tmpfs:
      - /var/lib/postgresql/data:size=64m
    networks:
      - atomicabr_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 15s
      resources:
        limits:
          memory: 128m
          cpus: '0.2'
      labels:
        - com.atomicabr.purpose=reconcile-ops-evo-v1
        - com.atomicabr.fix=threshold-msg10pct-contact500pct-2026-08-08
        - com.atomicabr.tier=disposable

  guardrail:
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          REPS=$(docker service ls --filter name=reconcile-ops_evo-reconcile --format '{{.Replicas}}' 2>/dev/null || echo '')
          if [ "$$REPS" = '0/1' ] || [ -z "$$REPS" ]; then
            echo "$(date -u) [guardrail] WARN: evo-reconcile nao esta rodando (REPS=$$REPS)"
          fi
          sleep 300
        done
    networks:
      - atomicabr_net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s
      resources:
        limits:
          memory: 32m
          cpus: '0.05'
      labels:
        - com.atomicabr.purpose=reconcile-guardrail
        - com.atomicabr.tier=monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

networks:
  atomicabr_net:
    external: true
    name: atomicabr_net

secrets:
  pg_evolution_url_n8n_app_v1:
    external: true
  supabase_db_password_v1:
    external: true
