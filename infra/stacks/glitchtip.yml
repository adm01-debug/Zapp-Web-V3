version: "3.8"

# 2026-07-04 (sessão 5, fix S4-3): GlitchTip v6 exige Redis/Valkey (cache + fila Celery).
# O stack não tinha nenhum → toda ingestão de eventos retornava HTTP 500 (broker=localhost inexistente).
# Adicionado glitchtip-valkey dedicado (isolado do Redis da Evolution de propósito — blast radius zero
# no caminho do WhatsApp) + REDIS_URL no web e no worker.
#
# 2026-07-11 (sessão 6, GAP-08): POSTGRES_PASSWORD e SECRET_KEY migrados para Docker secrets.
# Antes ficavam em texto puro no stack file do Portainer — agora lidos de /run/secrets/*.
#
# SECRETS NECESSÁRIOS (criar no host antes do deploy):
#   printf 'postgres://glitchtip:SENHA_REAL@glitchtip-db:5432/glitchtip' \
#     | docker secret create glitchtip_database_url_v1 -
#   printf 'SENHA_REAL' | docker secret create glitchtip_db_password_v1 -
#   printf 'CHAVE_SECRETA_LONGA_E_ALEATORIA' | docker secret create glitchtip_secret_key_v1 -
#
# ROTAÇÃO DE SENHA: criar _v2 dos três secrets acima, atualizar referências e fazer
# docker stack deploy. O container antigo segue com _v1 até o rolling update completar.
# Nota: glitchtip_db_password_v1 e glitchtip_database_url_v1 contêm a mesma senha —
# ambos devem ser recriados juntos ao rotacionar.

services:
  glitchtip-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      # POSTGRES_PASSWORD_FILE é uma feature nativa do postgres Docker image:
      # lê a senha de um arquivo em vez de env var em texto puro.
      POSTGRES_PASSWORD_FILE: /run/secrets/glitchtip_db_password_v1
    secrets:
      - glitchtip_db_password_v1
    volumes:
      - glitchtip-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glitchtip-net
      - AtomicaBRNet
    deploy:
      mode: replicated
      replicas: 1
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      placement: { constraints: [node.role == manager] }

  glitchtip-valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - glitchtip-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      resources: { limits: { memory: 256M } }
      placement: { constraints: [node.role == manager] }

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    secrets:
      - glitchtip_database_url_v1
      - glitchtip_secret_key_v1
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        DATABASE_URL="$(cat /run/secrets/glitchtip_database_url_v1)"
        SECRET_KEY="$(cat /run/secrets/glitchtip_secret_key_v1)"
        export DATABASE_URL SECRET_KEY
        exec ./bin/start.sh
    environment:
      REDIS_URL: redis://glitchtip-valkey:6379/0
      PORT: "8000"
      GLITCHTIP_DOMAIN: https://erros.atomicabr.com.br
      DEFAULT_FROM_EMAIL: noreply@atomicabr.com.br
      EMAIL_URL: "consolemail://"
      ENABLE_OPEN_USER_REGISTRATION: "true"
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - glitchtip-uploads:/code/uploads
    networks:
      - glitchtip-net
      - AtomicaBRNet
    deploy:
      mode: replicated
      replicas: 1
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      placement: { constraints: [node.role == manager] }
      labels:
        - traefik.enable=true
        - traefik.http.routers.glitchtip.rule=Host(`erros.atomicabr.com.br`)
        - traefik.http.routers.glitchtip.entrypoints=websecure
        - traefik.http.routers.glitchtip.tls.certresolver=letsencryptresolver
        - traefik.http.routers.glitchtip.service=glitchtip
        - traefik.http.services.glitchtip.loadbalancer.server.port=8000
        - traefik.http.services.glitchtip.loadbalancer.passHostHeader=1

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    secrets:
      - glitchtip_database_url_v1
      - glitchtip_secret_key_v1
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        DATABASE_URL="$(cat /run/secrets/glitchtip_database_url_v1)"
        SECRET_KEY="$(cat /run/secrets/glitchtip_secret_key_v1)"
        export DATABASE_URL SECRET_KEY
        exec ./bin/run-celery-with-beat.sh
    environment:
      REDIS_URL: redis://glitchtip-valkey:6379/0
      PORT: "8000"
      GLITCHTIP_DOMAIN: https://erros.atomicabr.com.br
      DEFAULT_FROM_EMAIL: noreply@atomicabr.com.br
      EMAIL_URL: "consolemail://"
      ENABLE_OPEN_USER_REGISTRATION: "true"
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - glitchtip-uploads:/code/uploads
    networks:
      - glitchtip-net
      - AtomicaBRNet
    deploy:
      mode: replicated
      replicas: 1
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      placement: { constraints: [node.role == manager] }

volumes:
  glitchtip-pg-data:
  glitchtip-uploads:

secrets:
  glitchtip_db_password_v1:
    external: true
  glitchtip_database_url_v1:
    external: true
  glitchtip_secret_key_v1:
    external: true

networks:
  glitchtip-net:
    driver: overlay
  AtomicaBRNet:
    external: true
    name: AtomicaBRNet
