version: "3.8"

# 2026-07-04 (sessão 5): drift corrigido. Antes o stack file apontava para MinIO
# (S3_ENDPOINT=http://minio:9000, bucket evolution-backups) e usava ${...} de env,
# mas o runtime rodava contra Cloudflare R2 via docker service update — um redeploy
# pela UI reverteria os backups para o MinIO. Agora endpoint/bucket/prefix R2 estão
# fixados no arquivo e as credenciais vêm de Docker secrets (rotação = criar _v2 e
# trocar a referência). Wrapper de entrypoint carrega os secrets e faz exec do run.sh
# original (preserva o go-cron da imagem).

services:
  backup-daily:
    image: eeshugerman/postgres-backup-s3:14
    networks: [AtomicaBRNet]
    secrets:
      - r2_backup_access_key_v1
      - r2_backup_secret_key_v1
      - pg14_backup_pg_password_v1
      - backup_passphrase_dw_v1
    entrypoint:
      - /bin/sh
      - -c
      - |
        export S3_ACCESS_KEY_ID=$(cat /run/secrets/r2_backup_access_key_v1)
        export S3_SECRET_ACCESS_KEY=$(cat /run/secrets/r2_backup_secret_key_v1)
        export POSTGRES_PASSWORD=$(cat /run/secrets/pg14_backup_pg_password_v1)
        export PASSPHRASE=$(cat /run/secrets/backup_passphrase_dw_v1)
        exec sh /run.sh
    environment:
      SCHEDULE: "0 2 * * 1-6"
      BACKUP_KEEP_DAYS: "14"
      S3_REGION: "auto"
      S3_BUCKET: "promo-brindes-backups"
      S3_ENDPOINT: "https://<r2-account>.r2.cloudflarestorage.com"
      S3_S3V4: "yes"
      S3_PREFIX: "backups/evolution-db/daily"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: "evolution"
      POSTGRES_USER: "postgres"
      TZ: "America/Sao_Paulo"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy: { condition: on-failure, delay: 30s, max_attempts: 5, window: 300s }
      resources: { limits: { memory: 512M } }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

secrets:
  r2_backup_access_key_v1: { external: true }
  r2_backup_secret_key_v1: { external: true }
  pg14_backup_pg_password_v1: { external: true }
  backup_passphrase_dw_v1: { external: true }

networks:
  AtomicaBRNet: { external: true }
