# =============================================================================
# ZAPP-WEB — Stack de Produção (Docker Swarm)
# Stack ID Portainer: 157 | Endpoint: 1 | Rede: AtomicaBRNet
#
# DEPLOY via CI (deploy-vps.yml): substitui ZAPP_IMAGE pela tag SHA imutável
#   docker stack deploy --compose-file zapp-web-prod.yml zapp-web-prod
#   ou via Portainer API: PUT /api/stacks/157?endpointId=1
#
# ROLLBACK manual:
#   docker service update --image ghcr.io/adm01-debug/zapp-web-v3/zapp-web:production-<sha-anterior> zapp-web-prod_web
#
# Footprint canônico: docs/PORTAINER_ZAPP_FOOTPRINT.md
# =============================================================================
version: "3.8"

services:
  web:
    # IMPORTANTE: usar tag SHA imutável (production-<sha12>), NUNCA production-latest no stack.
    # production-latest é mantida no GHCR como ponteiro externo, mas o serviço Swarm
    # referencia a tag imutável para evitar dangling images a cada deploy.
    image: ${ZAPP_IMAGE:-ghcr.io/adm01-debug/zapp-web-v3/zapp-web:production-latest}
    networks:
      - AtomicaBRNet
      # zapp-net adicionada 2026-08-20 (plano-100 etapa 65): o compose inline do
      # deploy-vps.yml (o que de fato vai para o Portainer) declara AtomicaBRNet
      # E zapp-net — este arquivo versionado divergia e removeria a rede num redeploy.
      - zapp-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # cap_drop: ALL removido 2026-08-20 (plano-100 etapa 65): a imagem nginx roda o
    # master como root e faz bind na porta 80 — sem CAP_NET_BIND_SERVICE o container
    # não sobe. O compose inline de produção nunca teve cap_drop; manter aqui tornava
    # este arquivo inutilizável para um redeploy real.
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - "traefik.http.routers.zapp-prod.rule=Host(`zapp.atomicabr.com.br`)"
        - traefik.http.services.zapp-prod.loadbalancer.server.port=80
        - traefik.http.routers.zapp-prod.service=zapp-prod
        - traefik.http.routers.zapp-prod.entrypoints=websecure
        - traefik.http.routers.zapp-prod.tls.certresolver=letsencryptresolver
        - traefik.http.routers.zapp-prod.tls=true
        - com.centurylinklabs.watchtower.enable=false
        - traefik.http.routers.zapp-prod.middlewares=crowdsec-bouncer@docker
        - traefik.http.routers.zappweb.middlewares=crowdsec-bouncer@docker
        - "traefik.http.routers.zappweb.rule=Host(`zappweb.app.br`)"
        - traefik.http.services.zappweb.loadbalancer.server.port=80
        - traefik.http.routers.zappweb.service=zappweb
        - traefik.http.routers.zappweb.entrypoints=websecure
        - traefik.http.routers.zappweb.tls.certresolver=letsencryptresolver
        - traefik.http.routers.zappweb.tls=true
        # Router www.zappweb.app.br (deploy-fix 2026-08-20) — inline p/ sobreviver a redeploys. DNS www->VPS ja feito.
        - "traefik.http.routers.zappweb-www.rule=Host(`www.zappweb.app.br`)"
        - traefik.http.services.zappweb-www.loadbalancer.server.port=80
        - traefik.http.routers.zappweb-www.service=zappweb-www
        - traefik.http.routers.zappweb-www.entrypoints=websecure
        - traefik.http.routers.zappweb-www.tls.certresolver=letsencryptresolver
        - traefik.http.routers.zappweb-www.tls=true
        - traefik.http.routers.zappweb-www.middlewares=crowdsec-bouncer@docker
        - com.atomicabr.tier=critical
      update_config:
        failure_action: rollback
        monitor: 60s
        order: start-first
      rollback_config:
        order: start-first
        monitor: 60s
        failure_action: continue
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  AtomicaBRNet:
    external: true
    name: AtomicaBRNet
  zapp-net:
    external: true
    name: zapp-net
