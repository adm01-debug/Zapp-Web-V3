version: "3.8"

# GitHub Actions Self-Hosted Runner — vps-zapp (PERSISTENTE)
# v4.7 (2026-08-18, Claude): fix crash-loop runner/runner2
# Root cause: .runner/.credentials eram escritos em /actions-runner/ (ephemeral)
# e nunca persistidos no volume. Cada restart tentava re-registrar com secret
# que nao estava disponivel no ciclo de crash rapido.
# Fix v4.7: restore config do volume antes de exec ./run.sh;
# salva no volume apos registro bem-sucedido. Idempotente.
#
# Deploy (stack 210) -- apenas via Portainer ou portainer_update_stack:
#   1. O secret Docker "gh_runner_pat_v2" deve existir no Swarm.
#   2. A network "AtomicaBRNet2" deve existir.
#   3. NAO use docker compose up (nao e compose standalone).
#
# Servicos:
#   runner, runner2, runner3 --> repo Zapp_Web_V3
#   runner-evo --> repo Evolution_Api_Stack

services:
  runner:
    image: myoung34/github-runner:latest@sha256:5be309f7a869f13834b10aecff03e3d73730f7de3efd4456c456c63600902043
    command:
      - /bin/bash
      - -c
      - |
        set -e
        RUNNER_DIR="/actions-runner"
        VOL="/tmp/runner"
        if [ -f "$$VOL/.runner" ] && [ -f "$$VOL/.credentials" ]; then
          echo "[runner] Restaurando config do volume..."
          cp "$$VOL/.runner" "$$RUNNER_DIR/.runner"
          cp "$$VOL/.credentials" "$$RUNNER_DIR/.credentials"
          test -f "$$VOL/.credentials_rsaparams" && cp "$$VOL/.credentials_rsaparams" "$$RUNNER_DIR/.credentials_rsaparams" || true
          echo "[runner] Config restaurada."
        else
          echo "[runner] Volume sem config -- registrando..."
          ACCESS_TOKEN="$$(cat /run/secrets/gh_runner_pat_v2 2>/dev/null || echo '')"
          if [ -z "$$ACCESS_TOKEN" ]; then echo "[runner] ERRO: secret indisponivel" && exit 1; fi
          for attempt in 1 2 3; do
            REG_TOKEN=$$(curl -sfL -X POST -H "Authorization: token $$ACCESS_TOKEN" "https://api.github.com/repos/adm01-debug/Zapp_Web_V3/actions/runners/registration-token" | jq -r .token)
            [ -n "$$REG_TOKEN" ] && [ "$$REG_TOKEN" != "null" ] && break
            sleep 3
          done
          echo "reg-token-len: $${#REG_TOKEN}"
          cd "$$RUNNER_DIR"
          ./config.sh --url "$$REPO_URL" --token "$$REG_TOKEN" --unattended --replace --name "vps-zapp-$$(hostname -s)" --labels "$$LABELS" --work "$$RUNNER_WORKDIR" --no-default-labels
          cp .runner "$$VOL/.runner" && cp .credentials "$$VOL/.credentials"
          test -f .credentials_rsaparams && cp .credentials_rsaparams "$$VOL/.credentials_rsaparams" || true
          echo "[runner] Registrado e salvo no volume."
        fi
        exec ./run.sh
    environment:
      RUNNER_SCOPE: "repo"
      REPO_URL: "https://github.com/adm01-debug/Zapp_Web_V3"
      LABELS: "vps-zapp,playwright,linux,x64"
      RUNNER_NAME_PREFIX: "vps-zapp"
      RUNNER_WORKDIR: "/tmp/runner/work"
      RUNNER_ALLOW_RUNASROOT: "1"
      DISABLE_AUTO_UPDATE: "true"
    secrets:
      - gh_runner_pat_v2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/tmp/runner
    security_opt:
      - no-new-privileges:true
    networks:
      - AtomicaBRNet2
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        failure_action: continue
        monitor: 20s
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.25"

