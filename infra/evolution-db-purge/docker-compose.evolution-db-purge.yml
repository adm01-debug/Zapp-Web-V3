      DLQ_RETENTION_DAYS: "30"
      WARROOM_RETENTION_DAYS: "30"
      BATCH_SIZE: "50000"
    entrypoint:
      - /bin/sh
      - -c
      - |
        exec sh /tmp/purge-v9.sh
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 5
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
      labels:
