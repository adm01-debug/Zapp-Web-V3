version: "3.8"

services:
  purge:
    image: postgres:14-alpine@sha256:bc06a4b2c6e50e3a9b7638fe7d3064d4497c89b3ce5e45a0bbc1124af6958adf
    networks:
      - AtomicaBRNet
    secrets:
      - pg_evolution_url_n8n_app_v1
    configs:
      - source: purge_v9_20260808
        target: /tmp/purge-v9.sh
        mode: 0444
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 67108864
    environment:
      PURGE_INTERVAL_HOURS: "24"
      MSG_RETENTION_DAYS: "90"
      MSGUPDATE_RETENTION_DAYS: "30"
      WEBHOOK_RETENTION_DAYS: "14"
      BAILEYS_RETENTION_DAYS: "30"
      ISONWA_RETENTION_DAYS: "7"
