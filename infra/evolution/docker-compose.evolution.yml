version: "3.7"
services:

  evolution:
    image: evoapicloud/evolution-api@sha256:6b195676b09abbbd8ac9372cd961674dea2587f23dc9bc1d1e6a595372556fb1
    init: true

    secrets:
      - evolution_db_uri_v1
      - evolution_db_uri_evolution_app_v1
      - evolution_api_key_v4_20260704
      - r2_s3_access_key_v2
      - r2_s3_secret_key_v2
      - rabbitmq_url_evolution_v1
      - metrics_password_v2
      - wa_business_verify_token_v1

    configs:
      - source: evolution_main_v2_js
        target: /evolution/dist/main.js
        mode: 0444
      - source: evolution_main_v2_mjs
        target: /evolution/dist/main.mjs
        mode: 0444
      - source: evolution_logpatch_t4_cjs
        target: /evolution/t4_prologue.cjs
        mode: 0444

    volumes:
      - evolution_instances:/evolution/instances

    networks:
      - AtomicaBRNet

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    entrypoint:
      - /bin/bash
      - -c
      - |
        # === SECRETS LOADING ===
        # tr -d remove trailing newline do arquivo de secret
        # (sem o tr, wc -c retorna 33 em vez de 32 - causa 401 por chave com \n)
        [ -f /run/secrets/evolution_db_uri_v1 ] && export DATABASE_CONNECTION_URI=$$(cat /run/secrets/evolution_db_uri_v1 | tr -d '\n\r')
        RUNTIME_URI=""
        [ -f /run/secrets/evolution_db_uri_evolution_app_v1 ] && RUNTIME_URI=$$(cat /run/secrets/evolution_db_uri_evolution_app_v1 | tr -d '\n\r')
        [ -f /run/secrets/evolution_api_key_v4_20260704 ] && export AUTHENTICATION_API_KEY=$$(cat /run/secrets/evolution_api_key_v4_20260704 | tr -d '\n\r')
        [ -f /run/secrets/r2_s3_access_key_v2 ] && export S3_ACCESS_KEY=$$(cat /run/secrets/r2_s3_access_key_v2 | tr -d '\n\r')
        [ -f /run/secrets/r2_s3_secret_key_v2 ] && export S3_SECRET_KEY=$$(cat /run/secrets/r2_s3_secret_key_v2 | tr -d '\n\r')
        [ -f /run/secrets/rabbitmq_url_evolution_v1 ] && export RABBITMQ_URI=$$(cat /run/secrets/rabbitmq_url_evolution_v1 | tr -d '\n\r')
        [ -f /run/secrets/metrics_password_v2 ] && export METRICS_PASSWORD=$$(cat /run/secrets/metrics_password_v2 | tr -d '\n\r')
        [ -f /run/secrets/wa_business_verify_token_v1 ] && export WA_BUSINESS_TOKEN_WEBHOOK=$$(cat /run/secrets/wa_business_verify_token_v1 | tr -d '\n\r')
        echo "[entrypoint] secrets loaded: db(superuser)=$${DATABASE_CONNECTION_URI:+yes} db(runtime)=$${RUNTIME_URI:+yes} api=$${AUTHENTICATION_API_KEY:+yes} s3=$${S3_ACCESS_KEY:+yes} rmq=$${RABBITMQ_URI:+yes} wa_vtok=$${WA_BUSINESS_TOKEN_WEBHOOK:+yes}"
        cd /evolution
        cat > /tmp/logpatch.cjs << 'LP_EOF'
        const fs=require('fs');
        const src=fs.readFileSync('/evolution/dist/main.js','utf8');
        const t1='console.log(c),this.sendDataWebhook("messages.upsert",c)';
        const r1='this.sendDataWebhook("messages.upsert",c)';
        const t2='console.log("stanza",JSON.stringify(e)),';
        const c1=src.split(t1).length-1;
        const c2=src.split(t2).length-1;
        if(c1!==1||c2!==1){console.error('[logpatch] T1('+c1+')/T2('+c2+') nao encontrado - abortando');process.exit(1);}
        let out=src.replace(t1,r1).replace(t2,'');
        console.log('[logpatch] T1+T2 OK: '+src.length+'->'+out.length+' bytes');
        const t3o='Lr.DSN&&Br.init({dsn:Lr.DSN,environment:process.env.NODE_ENV||"development",tracesSampleRate:1,profilesSampleRate:1})';
        const t3n='Lr.DSN&&Br.init({dsn:Lr.DSN,environment:"production",tracesSampleRate:0.05,profilesSampleRate:0,beforeSend:(event,hint)=>{try{const e=hint&&hint.originalException;if(e){if(e.response&&[401,403].includes(e.response.status))return null;if(e.message&&(e.message.includes("DEVICE_REMOVED")||e.message.includes("Request failed with status code 401")||e.message.includes("status code 403")||e.message.includes("makeBucket")))return null;}}catch(_){}return event;}})';
        const c3=out.split(t3o).length-1;
        if(c3===1){out=out.replace(t3o,t3n);console.log('[logpatch] T3 OK: Sentry+makeBucket+traces5%');} else {console.warn('[logpatch] T3 SKIP: count='+c3);}
        var T4='';
        try{T4=fs.readFileSync('/evolution/t4_prologue.cjs','utf8');if(T4.length>50 && T4.indexOf('MASKED')>-1){out=T4+'\n'+out;console.log('[logpatch] T4 OK');} else {console.warn('[logpatch] T4 SKIP');}}
        catch(e){console.warn('[logpatch] T4 SKIP: '+e.message);}
        const t5_src='console.log("CACHE:",{cached:a,updateKey:r,messageTimestamp:n.messageTimestamp,secondsSinceEpoch:c}),';
        const t5_cond=t5_src+'n.messageTimestamp&&';
        const t5c=out.split(t5_cond).length-1;
        if(t5c===1){out=out.replace(t5_cond,'n.messageTimestamp&&');console.log('[logpatch] T5a CACHE OK removed='+t5_src.length);}
        else{console.warn('[logpatch] T5a SKIP count='+t5c);}
        fs.writeFileSync('/evolution/dist/main.patched.js',out);
        console.log('[logpatch] patched: '+out.length+' bytes');
        try{const f='/evolution/node_modules/libsignal/src/session_record.js';let s=fs.readFileSync(f,'utf8');const subs=[['console.warn("Session already closed", session);','console.warn("Session already closed");'],['console.info("Closing session:", session);','console.info("Closing session");'],['console.info("Opening session:", session);','console.info("Opening session");'],['console.info("Removing old closed session:", oldestSession);','console.info("Removing old closed session");']];let n=0;for(const p of subs){if(s.includes(p[0])){s=s.split(p[0]).join(p[1]);n++;}}fs.writeFileSync(f,s);console.log('[logpatch] libsignal: '+n+'/4');}catch(e){console.error('[logpatch] libsignal SKIP: '+e.message);}
        LP_EOF
        if node /tmp/logpatch.cjs; then
          START="dist/main.patched.js"
        else
          echo "[entrypoint] logpatch FAIL: rodando SEM patch - risco LGPD."
          node -e "const {Client}=require('pg');const uri=process.env.DATABASE_CONNECTION_URI;if(!uri){process.exit(0);}const c=new Client({connectionString:uri});c.connect().then(()=>c.query(\"INSERT INTO public.warroom_alerts(alert_type,title,message,source,entity) VALUES ('critical','Evolution logpatch FAILED','Boot sem patch - risco LGPD.','evolution-entrypoint','evolution')\").catch(()=>{})).finally(()=>c.end()).catch(()=>{});" 2>/dev/null || true
          START="dist/main"
        fi
        echo "[entrypoint] running Prisma migrations (superuser DSN)..."
        . ./Docker/scripts/deploy_database.sh
        MIGRATION_EXIT=$$?
        if [ -n "$$RUNTIME_URI" ] && [ "$$MIGRATION_EXIT" = "0" ]; then
          export DATABASE_CONNECTION_URI="$$RUNTIME_URI"
          echo "[entrypoint] switched to runtime URI (evolution_app role - least-privilege)"
        else
          echo "[entrypoint] WARN: runtime URI ausente ou migrations falharam (exit=$$MIGRATION_EXIT)"
        fi
        # FIX v2: usar sed em vez de grep -oP (BusyBox nao tem Perl regex)
        DB_USER=$$(echo $$DATABASE_CONNECTION_URI | sed 's|.*://\([^:]*\).*|\1|')
        echo "[entrypoint] start: $$START db_user=$$DB_USER"
        exec node $$START

    environment:
      - SERVER_URL=https://evolution.atomicabr.com.br
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - LANGUAGE=pt-BR
      - CONFIG_SESSION_PHONE_CLIENT=Promo Brindes
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - EVENT_EMITTER_MAX_LISTENERS=50
      - LOG_LEVEL=ERROR,WARN
      - LOG_COLOR=false
      - LOG_BAILEYS=warn
      - PROMETHEUS_METRICS=true
      - METRICS_AUTH_REQUIRED=true
      - METRICS_USER=prometheus
      - METRICS_ALLOWED_IPS=127.0.0.1,::1,10.0.0.0/8
      - SENTRY_DSN=https://9c9c4f6b162143938bf5c5b20cf47837@erros.atomicabr.com.br/1
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_IS_ON_WHATSAPP=true
      - DATABASE_SAVE_IS_ON_WHATSAPP_DAYS=7
      - OPENAI_ENABLED=false
      - DIFY_ENABLED=false
      - TYPEBOT_ENABLED=false
      - TYPEBOT_API_VERSION=latest
      - CHATWOOT_ENABLED=false
      - CHATWOOT_MESSAGE_READ=true
      - CHATWOOT_MESSAGE_DELETE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/8
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=true
      - CACHE_REDIS_TTL=604800
      - S3_ENABLED=true
      - S3_BUCKET=zapp-whatsapp-media
      - S3_PORT=443
      - S3_ENDPOINT=cd0f4eee542191c4957567814e1f8ca1.r2.cloudflarestorage.com
      - S3_USE_SSL=true
      - S3_REGION=auto
      - S3_SAVE_VIDEO=true
      - S3_SKIP_POLICY=true
      - WA_BUSINESS_URL=https://graph.facebook.com
      - WA_BUSINESS_VERSION=v24.0
      - WA_BUSINESS_LANGUAGE=pt_BR
      - TELEMETRY_ENABLED=false
      - TELEMETRY_URL=
      - WEBSOCKET_ENABLED=false
      - WEBSOCKET_GLOBAL_EVENTS=false
      - SQS_ENABLED=false
      - WEBHOOK_REQUEST_TIMEOUT_MS=60000
      - WEBHOOK_RETRY_MAX_ATTEMPTS=10
      - WEBHOOK_RETRY_INITIAL_DELAY_SECONDS=5
      - WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF=true
      - WEBHOOK_RETRY_MAX_DELAY_SECONDS=300
      - WEBHOOK_RETRY_JITTER_FACTOR=0.2
      - WEBHOOK_RETRY_NON_RETRYABLE_STATUS_CODES=400,401,403,404,422
      - WEBHOOK_EVENTS_ERRORS=true
      - WEBHOOK_EVENTS_ERRORS_WEBHOOK=https://evolution-webhook-proxy.adm01.workers.dev
      - RABBITMQ_ENABLED=true
      - RABBITMQ_EXCHANGE_NAME=evolution
      - RABBITMQ_GLOBAL_ENABLED=false
      - RABBITMQ_EVENTS_MESSAGES_UPSERT=true
      - RABBITMQ_EVENTS_MESSAGES_EDITED=true
      - RABBITMQ_EVENTS_MESSAGES_UPDATE=true
      - RABBITMQ_EVENTS_MESSAGES_DELETE=true
      - RABBITMQ_EVENTS_CONTACTS_UPSERT=true
      - RABBITMQ_EVENTS_CONTACTS_UPDATE=true
      - RABBITMQ_EVENTS_CHATS_UPSERT=true
      - RABBITMQ_EVENTS_CHATS_UPDATE=true
      - RABBITMQ_EVENTS_GROUPS_UPSERT=true
      - RABBITMQ_EVENTS_GROUP_UPDATE=true
      - RABBITMQ_EVENTS_GROUP_PARTICIPANTS_UPDATE=true
      - RABBITMQ_EVENTS_CONNECTION_UPDATE=true
      - RABBITMQ_EVENTS_CALL=true
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 30s
        monitor: 180s
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
      - traefik.enable=1
      - traefik.http.routers.evolution.rule=Host(`evolution.atomicabr.com.br`)
      - traefik.http.routers.evolution.entrypoints=websecure
      - traefik.http.routers.evolution.priority=1
      - traefik.http.routers.evolution.tls.certresolver=letsencryptresolver
      - traefik.http.routers.evolution.service=evolution
      - traefik.http.services.evolution.loadbalancer.server.port=8080
      - traefik.http.services.evolution.loadbalancer.passHostHeader=true
      - traefik.http.routers.evolution.middlewares=evo-sec@docker,evo-rl@docker
      - traefik.http.middlewares.evo-rl.ratelimit.average=1000
      - traefik.http.middlewares.evo-rl.ratelimit.burst=500
      - traefik.http.middlewares.evo-rl.ratelimit.period=1m
      - traefik.http.middlewares.evo-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.evo-sec.headers.browserXssFilter=true
      - traefik.http.middlewares.evo-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.evo-sec.headers.forceSTSHeader=true
      - traefik.http.middlewares.evo-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.evo-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.evo-sec.headers.stsPreload=true
      - traefik.http.middlewares.evo-sec.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()
      - traefik.http.middlewares.evo-sec.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.evo-sec.headers.customResponseHeaders.X-Powered-By=
      - com.atomicabr.audit=canonical-v3-20260711-grep-to-sed-fix
      - com.centurylinklabs.watchtower.enable=false

volumes:
  evolution_instances:
    external: true
    name: evolution_instances

secrets:
  evolution_db_uri_v1:
    external: true
  evolution_db_uri_evolution_app_v1:
    external: true
  evolution_api_key_v4_20260704:
    external: true
  r2_s3_access_key_v2:
    external: true
  r2_s3_secret_key_v2:
    external: true
  rabbitmq_url_evolution_v1:
    external: true
  metrics_password_v2:
    external: true
  wa_business_verify_token_v1:
    external: true

configs:
  evolution_main_v2_js:
    external: true
  evolution_main_v2_mjs:
    external: true
  evolution_logpatch_t4_cjs:
    external: true

networks:
  AtomicaBRNet:
    external: true
    name: AtomicaBRNet
