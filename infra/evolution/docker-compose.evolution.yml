# =====================================================================================
# Evolution API — docker-compose SINCRONIZADO COM STACK 25 EM 2026-08-08
# fonte única: Portainer stackId 25 — NÃO editar manualmente
# Imagem: sha256:678f84d85f2b (commit e1a210286b42, etapa-27, evolution_app least-privilege)
# Mudanças vs 20260806:
#   - Remove evolution_db_uri_v1 (superuser removido do runtime)
#   - Adiciona 12 RABBITMQ_EVENTS (A2/A8): dual delivery eliminada
#   - IMAGE_DIGEST/OCI_DIGEST atualizados
#   - DATABASE_SAVE_DATA_HISTORIC=false, DATABASE_SAVE_MESSAGE_UPDATE=false
#   - stop_grace_period=30s adicionado
# =====================================================================================
version: "3.7"
services:

  evolution:
    image: ghcr.io/adm01-debug/zapp-web-v3/evolution-api-custom@sha256:678f84d85f2b5736252f05715ff83ea8e9f05b9c66669e8a6276e8a6c8a44661
    init: true
    read_only: true
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    secrets:
      - evolution_db_uri_evolution_app_v1
      - source: evolution_api_key_v5_20260805
        target: evolution_api_key_v4_20260704
      - r2_s3_access_key_v2
      - r2_s3_secret_key_v2
      - rabbitmq_url_evolution_v1
      - metrics_password_v2
      - wa_business_verify_token_v1
      - source: supabase_service_key_v3
        target: supabase_service_key_v1

    volumes:
      - evolution_instances:/evolution/instances
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1073741824

    networks:
      - AtomicaBRNet

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header='Origin: https://evolution.atomicabr.com.br' http://127.0.0.1:8080/manager/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    entrypoint:
      - /evolution/docker-entrypoint.sh
    command:
      - node
      - dist/main.js

    environment:
      - SERVER_URL=https://evolution.atomicabr.com.br
      - IMAGE_DIGEST=sha256:678f84d85f2b5736252f05715ff83ea8e9f05b9c66669e8a6276e8a6c8a44661
      - OCI_DIGEST=sha256:678f84d85f2b5736252f05715ff83ea8e9f05b9c66669e8a6276e8a6c8a44661
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=false
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - LANGUAGE=pt-BR
      - CONFIG_SESSION_PHONE_CLIENT=Promo Brindes
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - EVENT_EMITTER_MAX_LISTENERS=50
      - LOG_LEVEL=ERROR,WARN
      - LOG_COLOR=false
      - LOG_BAILEYS=warn
      - PROMETHEUS_METRICS=true
      - METRICS_AUTH_REQUIRED=true
      - METRICS_USER=prometheus
      - METRICS_ALLOWED_IPS=127.0.0.1,::1,10.0.0.0/8
      - SENTRY_DSN=https://4aac50926105fab9dea5a352266ff88b@o4511422295179264.ingest.de.sentry.io/4511422298325072
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_IS_ON_WHATSAPP=true
      - DATABASE_SAVE_IS_ON_WHATSAPP_DAYS=7
      - OPENAI_ENABLED=false
      - DIFY_ENABLED=false
      - TYPEBOT_ENABLED=false
      - TYPEBOT_API_VERSION=latest
      - N8N_ENABLED=false
      - CHATWOOT_ENABLED=false
      - CHATWOOT_MESSAGE_READ=true
      - CHATWOOT_MESSAGE_DELETE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/8
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=true
      - CACHE_REDIS_TTL=604800
      - S3_ENABLED=true
      - S3_BUCKET=zapp-whatsapp-media
      - S3_PORT=443
      - S3_ENDPOINT=cd0f4eee542191c4957567814e1f8ca1.r2.cloudflarestorage.com
      - S3_USE_SSL=true
      - S3_REGION=auto
      - S3_SAVE_VIDEO=true
      - S3_SKIP_POLICY=true
      - WA_BUSINESS_URL=https://graph.facebook.com
      - WA_BUSINESS_VERSION=v24.0
      - WA_BUSINESS_LANGUAGE=pt_BR
      - TELEMETRY_ENABLED=false
      - TELEMETRY_URL=
      - WEBSOCKET_ENABLED=false
      - WEBSOCKET_GLOBAL_EVENTS=false
      - SQS_ENABLED=false
      - WEBHOOK_REQUEST_TIMEOUT_MS=60000
      - WEBHOOK_RETRY_MAX_ATTEMPTS=4
      - WEBHOOK_RETRY_INITIAL_DELAY_SECONDS=5
      - WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF=true
      - WEBHOOK_RETRY_MAX_DELAY_SECONDS=60
      - WEBHOOK_RETRY_JITTER_FACTOR=0.2
      - WEBHOOK_RETRY_NON_RETRYABLE_STATUS_CODES=400,401,403,404,422
      - WEBHOOK_EVENTS_ERRORS=true
      - WEBHOOK_EVENTS_ERRORS_WEBHOOK=https://evolution-webhook-proxy.adm01.workers.dev
      - RABBITMQ_ENABLED=true
      - RABBITMQ_EXCHANGE_NAME=evolution
      - RABBITMQ_GLOBAL_ENABLED=false
      # Eventos já existentes
      - RABBITMQ_EVENTS_MESSAGES_UPSERT=true
      - RABBITMQ_EVENTS_MESSAGES_UPDATE=true
      - RABBITMQ_EVENTS_CONNECTION_UPDATE=true
      # Novos eventos — A2/A8 — 2026-08-08 auditoria onda-4
      # Consumer v7 e edge function (evolution-webhook) tratam todos os 17 tipos (validado)
      # Webhook wpp2 reduzido para SEND_MESSAGE only — zero dual delivery
      - RABBITMQ_EVENTS_MESSAGES_EDITED=true
      - RABBITMQ_EVENTS_MESSAGES_DELETE=true
      - RABBITMQ_EVENTS_CONTACTS_UPSERT=true
      - RABBITMQ_EVENTS_CONTACTS_UPDATE=true
      - RABBITMQ_EVENTS_CHATS_UPSERT=true
      - RABBITMQ_EVENTS_CHATS_UPDATE=true
      - RABBITMQ_EVENTS_GROUPS_UPSERT=true
      - RABBITMQ_EVENTS_GROUP_PARTICIPANTS_UPDATE=true
      - RABBITMQ_EVENTS_LABELS_EDIT=true
      - RABBITMQ_EVENTS_LABELS_ASSOCIATION=true
      - RABBITMQ_EVENTS_CALL=true
      - RABBITMQ_EVENTS_LOGOUT_INSTANCE=true
      # QRCODE mantido falso (consumo interno, não precisa do Rabbit)
      - RABBITMQ_EVENTS_QRCODE_UPDATED=false

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 30s
        monitor: 180s
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
      - traefik.enable=1
      - traefik.http.routers.evolution.rule=Host(`evolution.atomicabr.com.br`)
      - traefik.http.routers.evolution.entrypoints=websecure
      - traefik.http.routers.evolution.priority=1
      - traefik.http.routers.evolution.tls.certresolver=letsencryptresolver
      - traefik.http.routers.evolution.service=evolution
      - traefik.http.services.evolution.loadbalancer.server.port=8080
      - traefik.http.services.evolution.loadbalancer.passHostHeader=true
      - traefik.http.routers.evolution.middlewares=evo-sec@docker,evo-rl@docker
      - traefik.http.middlewares.evo-rl.ratelimit.average=200
      - traefik.http.middlewares.evo-rl.ratelimit.burst=100
      - traefik.http.middlewares.evo-rl.ratelimit.period=1m
      - traefik.http.routers.evolution-manager.rule=Host(`evolution.atomicabr.com.br`) && PathPrefix(`/manager`)
      - traefik.http.routers.evolution-manager.entrypoints=websecure
      - traefik.http.routers.evolution-manager.priority=10
      - traefik.http.routers.evolution-manager.tls.certresolver=letsencryptresolver
      - traefik.http.routers.evolution-manager.service=evolution
      - traefik.http.middlewares.evo-mgr.ipwhitelist.sourcerange=127.0.0.1/32,10.0.0.0/8,186.207.138.55/32
      - traefik.http.routers.evolution-manager.middlewares=evo-mgr@docker
      - traefik.http.middlewares.evo-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.evo-sec.headers.browserXssFilter=true
      - traefik.http.middlewares.evo-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.evo-sec.headers.forceSTSHeader=true
      - traefik.http.middlewares.evo-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.evo-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.evo-sec.headers.stsPreload=true
      - traefik.http.middlewares.evo-sec.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()
      - traefik.http.middlewares.evo-sec.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.evo-sec.headers.customResponseHeaders.X-Powered-By=
      - com.atomicabr.audit=20260808-A2A8-rabbitmq-full-events-13-novos-consumer-17-handlers-validados
      - com.atomicabr.tier=critical
      - com.centurylinklabs.watchtower.enable=false

volumes:
  evolution_instances:
    external: true
    name: evolution_instances

secrets:
  evolution_db_uri_evolution_app_v1:
    external: true
  evolution_api_key_v5_20260805:
    external: true
  r2_s3_access_key_v2:
    external: true
  r2_s3_secret_key_v2:
    external: true
  rabbitmq_url_evolution_v1:
    external: true
  metrics_password_v2:
    external: true
  wa_business_verify_token_v1:
    external: true
  supabase_service_key_v1:
    external: true
  supabase_service_key_v3:
    external: true

networks:
  AtomicaBRNet:
    external: true
    name: AtomicaBRNet
