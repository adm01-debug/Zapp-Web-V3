# =============================================================================
# docker-compose.evolution.canonical.yml — STACK 25 (evolution) — COMPOSE CANÔNICO
# =============================================================================
# Data de canonicidade : 2026-08-08
# Estado de referência  : stack 25 REAL em produção (VPS AtomicaBR) — key v6,
#                         WEBHOOK_EVENTS_ERRORS=false (fix etapa 2), errors=false
# IMAGE_DIGEST (OCI)    :
#   ghcr.io/adm01-debug/zapp-web-v3/evolution-api-custom@sha256:1e12bec1eeeb4af933b6c4bb696941ea46c4d383340e562e08f2a4c4aa9ee40e
# Base de construção    : estado real (08/08/2026) + estrutura de
#                         auditorias/pastas-trabalho/evolution_stack25_align/docker-compose.new.yml
#                         (9d110bc7 — DESATUALIZADO, apenas referência estrutural)
#
# Garantias do canônico:
#   ✅ evolution_api_key_v6_20260808 -> target evolution_api_key_v4_20260704 (rotação v5→v6, etapa 5)
#   ✅ WEBHOOK_EVENTS_ERRORS=false (fix etapa 2 — Sentry cobre erros)
#   ✅ SEM WEBHOOK_EVENTS_ERRORS_WEBHOOK (webhook de erro removido; proxy descarta POSTs sem assinatura)
#   ⏳ CORS_ORIGIN=* — MANTER (fix outage F2-07b); restrição a lista de origens
#      é a ETAPA 81 (D — Evolução), PENDENTE. Não alterar até execução da etapa 81.
#   ✅ init:true, read_only:true, cap_drop ALL, no-new-privileges (hardening B3)
#   ✅ healthcheck curl /manager/health (interval 10s)
#   ✅ deploy: node.role==manager, memory 2G, failure_action rollback, order stop-first
#   ✅ traefik: router evolution + evolution-manager (ipwhitelist) + evo-rl 200/min burst 100
#
# ⚠️  ARTEfATO PREPARADO PARA APLICAÇÃO PELO MAESTRO — NÃO APLICAR DIRETAMENTE EM PRODUÇÃO.
# =============================================================================
version: "3.7"
services:

  evolution:
    image: ghcr.io/adm01-debug/zapp-web-v3/evolution-api-custom@sha256:1e12bec1eeeb4af933b6c4bb696941ea46c4d383340e562e08f2a4c4aa9ee40e
    init: true
    read_only: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    secrets:
      - source: evolution_api_key_v6_20260808
        target: evolution_api_key_v4_20260704
      - evolution_db_uri_evolution_app_v1
      - metrics_password_v2
      - r2_s3_access_key_v2
      - r2_s3_secret_key_v2
      - rabbitmq_url_evolution_v1
      - sentry_dsn_v2
      - supabase_service_key_v3
      - wa_business_verify_token_v1

    volumes:
      - evolution_instances:/evolution/instances
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1073741824

    networks:
      - AtomicaBRNet

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/manager/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 90s

    entrypoint:
      - /evolution/docker-entrypoint.sh
    command:
      - node
      - dist/main.js

    environment:
      # --- Autenticação (key global via arquivo — secret v6, target v4) ---
      - AUTHENTICATION_API_KEY_FILE=/run/secrets/evolution_api_key_v4_20260704
      - AUTHENTICATION_EXCLUDE_INSTANCES=manager
      # --- Cache ---
      - CACHE_REDIS_SAVE_INSTANCES=true
      - CACHE_LOCAL_ENABLED=true
      # --- Banco (save-flags reduzidos — item 67 / AG-EX-23) ---
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      # --- CORS: MANTER * até etapa 81 (fix outage F2-07b; callers sem Origin quebram) ---
      - CORS_ORIGIN=*
      # --- RabbitMQ (URI via arquivo) ---
      - RABBITMQ_ENABLED=true
      - RABBITMQ_URI_FILE=/run/secrets/rabbitmq_url_evolution_v1
      - RABBITMQ_EXCHANGE=evolution
      - RABBITMQ_EVENTS_QUEUE=evolution_events
      - RABBITMQ_EVENTS_EXCHANGE=evolution
      - RABBITMQ_EVENTS_ROUTING_KEY=events.*
      # --- Webhooks (errors OFF — etapa 2; sem WEBHOOK_EVENTS_ERRORS_WEBHOOK) ---
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_EVENTS_ERRORS=false
      # --- Sentry (DSN via arquivo) ---
      - SENTRY_DSN_FILE=/run/secrets/sentry_dsn_v2
      - SENTRY_ENVIRONMENT=production
      # --- Timezone ---
      - TZ=America/Sao_Paulo

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
        - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 30s
        monitor: 180s
      rollback_config:
        parallelism: 1
        order: stop-first
      labels:
      - traefik.enable=1
      - traefik.http.routers.evolution.rule=Host(`evolution.atomicabr.com.br`)
      - traefik.http.routers.evolution.entrypoints=websecure
      - traefik.http.routers.evolution.priority=1
      - traefik.http.routers.evolution.tls.certresolver=letsencryptresolver
      - traefik.http.routers.evolution.service=evolution
      - traefik.http.services.evolution.loadbalancer.server.port=8080
      - traefik.http.services.evolution.loadbalancer.passHostHeader=true
      - traefik.http.routers.evolution.middlewares=evo-sec@docker,evo-rl@docker
      - traefik.http.middlewares.evo-rl.ratelimit.average=200
      - traefik.http.middlewares.evo-rl.ratelimit.burst=100
      - traefik.http.middlewares.evo-rl.ratelimit.period=1m
      - traefik.http.routers.evolution-manager.rule=Host(`evolution.atomicabr.com.br`) && PathPrefix(`/manager`)
      - traefik.http.routers.evolution-manager.entrypoints=websecure
      - traefik.http.routers.evolution-manager.priority=10
      - traefik.http.routers.evolution-manager.tls.certresolver=letsencryptresolver
      - traefik.http.routers.evolution-manager.service=evolution
      - traefik.http.middlewares.evo-mgr.ipwhitelist.sourcerange=127.0.0.1/32,10.0.0.0/8,186.207.138.55/32
      - traefik.http.routers.evolution-manager.middlewares=evo-mgr@docker
      - traefik.http.middlewares.evo-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.evo-sec.headers.browserXssFilter=true
      - traefik.http.middlewares.evo-sec.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.evo-sec.headers.forceSTSHeader=true
      - traefik.http.middlewares.evo-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.evo-sec.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.evo-sec.headers.stsPreload=true
      - traefik.http.middlewares.evo-sec.headers.permissionsPolicy=camera=(), microphone=(), geolocation=(), payment=()
      - traefik.http.middlewares.evo-sec.headers.customResponseHeaders.Server=
      - traefik.http.middlewares.evo-sec.headers.customResponseHeaders.X-Powered-By=
      - com.atomicabr.audit=canonical-20260711-T3-makeBucket-T5a-tr-d-no-plaintext-apikey|20260724-chats-historic-ai-n8n-enabled-rmq21|20260802-sentry-cloud-migration-v2|20260805-buildtime-image-B1-hardening-B3|20260805-B3-readonly-tmpfs-nnp-health|20260805-F2-09-secret-v5-F2-14-F2-21-image|20260806-F2-07-cors-origin-fixed|20260806-F2-07b-cors-origin-restore-wildcard-outage-fix|20260808-key-v6|20260808-etapa2-webhook-errors-off|20260808-canonical-v1
      - com.atomicabr.tier=critical
      - com.centurylinklabs.watchtower.enable=false

volumes:
  evolution_instances:
    external: true
    name: evolution_instances

secrets:
  evolution_api_key_v6_20260808:
    external: true
  evolution_db_uri_evolution_app_v1:
    external: true
  metrics_password_v2:
    external: true
  r2_s3_access_key_v2:
    external: true
  r2_s3_secret_key_v2:
    external: true
  rabbitmq_url_evolution_v1:
    external: true
  sentry_dsn_v2:
    external: true
  supabase_service_key_v3:
    external: true
  wa_business_verify_token_v1:
    external: true

networks:
  AtomicaBRNet:
    external: true
    name: AtomicaBRNet
