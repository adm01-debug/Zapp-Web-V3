name: E2E Nightly Full (VPS)

# E02/F10-02 — os 4 workflows `e2e-*-vps.yml` selecionam specs por listas
# `SPECS="..."` hardcoded; um spec novo em `e2e/` nunca e coletado.
# Este job roda a suite INTEIRA de `playwright.e2e.config.ts` sem filtro,
# garantindo que nenhum spec de `e2e/` fique orfao de execucao.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL alvo da VPS'
        required: false
        default: 'https://zapp.atomicabr.com.br'
      runner:
        description: 'Runner alvo'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spec-coverage:
    name: Cobertura de specs — nenhum spec orfao
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verificar que todo spec de e2e/ e executado por algum workflow
        run: node scripts/check-e2e-spec-coverage.mjs

  e2e-full:
    name: Playwright — suite completa de e2e/ contra VPS
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.event.inputs.runner == 'ubuntu-latest' && 'ubuntu-latest' || fromJSON('["Linux","X64","vps-zapp","playwright"]') }}
    timeout-minutes: 120
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://zapp.atomicabr.com.br' }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (>=20 p/ husky/ESM no runner self-hosted — E2E-04)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Instalar dependencias
        # E2E-04-FIX (2026-08-07): --ignore-scripts pula TODOS os lifecycle scripts
        # incluindo `prepare` que chama husky v9 (ESM-only). HUSKY=0 sozinho nao
        # basta: bun roda `prepare` antes de honrar HUSKY=0 no Node v10 do runner
        # self-hosted (Ubuntu 20.04, myoung34/github-runner). Playwright e instalado
        # explicitamente no proximo step.
        run: bun install --ignore-scripts

      - name: Instalar Chromium do Playwright
        run: bunx playwright install --with-deps chromium

      - name: Validar credenciais
        run: |
          if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::error::E2E_USER_EMAIL / E2E_USER_PASSWORD nao configurados nos secrets."
            exit 1
          fi
          echo "Alvo: $E2E_BASE_URL"

      - name: Rodar suite completa (sem filtro de specs)
        id: run_full
        continue-on-error: true
        run: |
          set -o pipefail
          bun run test:e2e:full --reporter=list,html,json 2>&1 | tee playwright-full.log

      - name: Falhar job se a suite falhou (E2E-07, 2026-08-06)
        if: steps.run_full.outcome == 'failure'
        run: |
          echo "::error::E2E Nightly Full FALHOU — veja o resumo e o artefato playwright-report-full"
          exit 1

      - name: Resumo
        if: always()
        run: |
          {
            echo "# E2E Nightly Full — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- Alvo: \`$E2E_BASE_URL\`"
            echo "- Resultado: \`${{ steps.run_full.outcome }}\`"
            echo ""
            echo '```'
            tail -n 150 playwright-full.log 2>/dev/null || echo "(sem log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload do relatorio
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-full
          path: playwright-report-e2e/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload de test-results (traces/screenshots/videos)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-full
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
