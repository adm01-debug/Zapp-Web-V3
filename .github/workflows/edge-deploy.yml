name: edge-deploy

# Pipeline de deploy de Edge Functions (causa-raiz do P0 — REC-ART-04/05):
# reconcilia supabase/functions/ (repo) com o volume /home/deno/functions do
# container supabase_functions na VPS, usando o runner self-hosted (que tem
# /var/run/docker.sock montado — ver infra/runner/).
#
# Dispara em push na main que toque supabase/functions/** e em dispatch
# manual (útil para reconciliar drift acumulado sem novo commit).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy edge functions (--apply --restart)
    # Runner self-hosted da VPS (labels: self-hosted, linux, x64, vps-zapp;
    # a variante docker do runner também carrega a label 'docker').
    runs-on: [Linux, X64, vps-zapp]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Deploy edge functions (apply + hash validation)
        # --apply: copia MISSING/STALE do repo para o volume, valida hash pós-escrita.
        # --restart: docker service update --force supabase_functions após o deploy
        # para garantir que o edge-runtime carregue o código novo em memória
        # (sem restart o módulo cacheado em memória pode divergir do volume).
        run: |
          set -euo pipefail
          bash infra/edge-deploy/deploy-edge.sh --apply --restart 2>&1 | tee edge-deploy-report.txt

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edge-deploy-report
          path: edge-deploy-report.txt
          if-no-files-found: error
          retention-days: 14
