name: 🦕 Deno Contract Tests — Edge Functions

on:
  push:
    paths:
      - 'supabase/functions/**'
      - 'deno.json'
      - '.github/workflows/deno-contract-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'deno.json'
  # Varredura diária: main pode ficar vermelho sem PR tocando functions
  # (auditoria A6 2026-08-06 — ex.: onda de remoção #922 deixou testes
  # órfãos lendo index.ts deletados e ninguém viu até o próximo push).
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deno-contract-tests:
    name: Contract Tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Lint no-direct-evo-url (report-only)
        run: |
          deno lint -c deno.json --rules-tags= --rules-include=no-direct-evo-url/no-direct-evo-url supabase/functions > /tmp/lint-out.txt || true
          cat /tmp/lint-out.txt
          if grep -q 'no-direct-evo-url' /tmp/lint-out.txt; then
            echo '::warning::no-direct-evo-url: violacoes encontradas (report-only - fase 2 torna blocking)'
          else
            echo 'no-direct-evo-url: 0 violacoes'
          fi
      - name: Run contract tests
        # Loop por arquivo (isolamento de processo): testes que setam env no
        # escopo de módulo (e2e-send.test.ts) e testes com fetch live
        # (evolution-api/index.test.ts, gmail-tests.test.ts) poluem/leakam no
        # modo invocação-única — cada arquivo em processo próprio isola isso.
        # Sem --no-check: type-check faz parte do contrato (TS2339 derruba).
        run: |
          set -euo pipefail
          TEST_FILES=$(find supabase/functions -name '*.test.ts' -type f 2>/dev/null || true)
          if [ -z "$TEST_FILES" ]; then
            echo "::warning::No contract test files found — skipping"
            exit 0
          fi
          COUNT=$(echo "$TEST_FILES" | wc -l)
          echo "Found $COUNT contract test files"
          echo "$TEST_FILES" | while IFS= read -r f; do
            echo "::group::Testing $f"
            deno test --allow-net --allow-env --allow-read "$f" || {
              echo "::error title=Contract test failed::$f"
              exit 1
            }
            echo "::endgroup::"
          done
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
