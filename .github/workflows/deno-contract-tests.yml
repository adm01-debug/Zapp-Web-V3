name: 🦕 Deno Contract Tests — Edge Functions

on:
  push:
    paths:
      - 'supabase/functions/**'
      - 'deno.json'
      - '.github/workflows/deno-contract-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'deno.json'
  # Varredura diária: main pode ficar vermelho sem PR tocando functions
  # (auditoria A6 2026-08-06 — ex.: onda de remoção #922 deixou testes
  # órfãos lendo index.ts deletados e ninguém viu até o próximo push).
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deno-contract-tests:
    name: Contract Tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Run contract tests
        # Invocação ÚNICA: o Deno descobre todos os *.test.ts de
        # supabase/functions, type-checka o grafo 1x (não 70x como o loop
        # por-arquivo) e reporta TODAS as falhas no mesmo run.
        # Sem --no-check: type-check faz parte do contrato (TS2339 derruba).
        run: |
          set -euo pipefail
          deno test --allow-net --allow-env --allow-read supabase/functions/
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
