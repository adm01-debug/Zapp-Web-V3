name: 🦕 Deno Contract Tests — Edge Functions

on:
  push:
    paths:
      - 'supabase/functions/**'
      - 'deno.json'
      - '.github/workflows/deno-contract-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'deno.json'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deno-contract-tests:
    name: Contract Tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Run contract tests
        run: |
          deno test --allow-net --allow-env --allow-read \
            supabase/functions/**/*.test.ts 2>/dev/null || \
          echo 'No contract tests found — skipping'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
