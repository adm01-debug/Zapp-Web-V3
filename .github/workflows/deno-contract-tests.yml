name: 🦕 Deno Contract Tests — Edge Functions

on:
  push:
    paths:
      - 'supabase/functions/**'
      - 'deno.json'
      - '.github/workflows/deno-contract-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'deno.json'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deno-contract-tests:
    name: Contract Tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v6
        with:
          path: ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Run contract tests
        run: |
          set -euo pipefail
          TEST_FILES=$(find supabase/functions -name '*.test.ts' -type f 2>/dev/null || true)
          if [ -z "$TEST_FILES" ]; then
            echo "::warning::No contract test files found — skipping"
            exit 0
          fi
          COUNT=$(echo "$TEST_FILES" | wc -l)
          echo "Found $COUNT contract test files"
          FAILED=0
          echo "$TEST_FILES" | while IFS= read -r f; do
            echo "::group::Testing $f"
            deno test --allow-net --allow-env --allow-read "$f" || {
              echo "::error title=Contract test failed::$f"
              exit 1
            }
            echo "::endgroup::"
          done
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
