name: E46 — Regression Test Gate

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression-test-gate:
    name: Regression Test Requirement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect PR metadata
        id: pr_meta
        env:
          # PR title via env — nunca interpolar github.event.pull_request.title
          # direto em script (script injection — actionlint AL-01, 2026-08-06)
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # PR title
          echo "pr_title=$PR_TITLE" >> "$GITHUB_OUTPUT"

          # Changed files in this PR
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          DELIM=$(openssl rand -hex 16)
          echo "changed_files<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

          # Commit messages in this PR (one per line)
          COMMITS=$(git log --format="%s" "origin/${{ github.base_ref }}"..HEAD)
          echo "commit_messages<<${DELIM}" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: "E46 — Enforce regression test for fix: PRs"
        # Blocking (fix RGT-02 2026-08-06): o continue-on-error anulava o exit 1
        # do script — o gate existia mas nunca falhava o job.
        env:
          PR_TITLE: ${{ steps.pr_meta.outputs.pr_title }}
          CHANGED_FILES: ${{ steps.pr_meta.outputs.changed_files }}
          COMMIT_MESSAGES: ${{ steps.pr_meta.outputs.commit_messages }}
          ADVISORY: "false"
        run: node scripts/check-fix-regression-test.mjs
