name: Typecheck Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (app)
        id: ts-check
        # Advisory only — the Blocking ratchet is in quality-gate.yml and ci.yml
        # This gate reports issues but does not fail the build.
        # Structural stubs for zapp/evo produce ~66 advisory warnings until
        # full per-table types are regenerated via MCP or gen-types-zapp.
        continue-on-error: true
        run: |
          bunx tsc --noEmit -p tsconfig.app.json 2>&1 | tee /tmp/tsc-output.txt
          ERRORS=$(grep -c "error TS" /tmp/tsc-output.txt || echo 0)
          echo "tsc-errors=$ERRORS" >> $GITHUB_OUTPUT
          if [ "$ERRORS" -gt 0 ]; then
            echo "::warning::$ERRORS TypeScript errors found (advisory — blocking ratchet runs elsewhere)"
          else
            echo "::notice::TypeScript compilation clean — 0 errors"
          fi

      - name: Typecheck (node)
        run: bunx tsc --noEmit -p tsconfig.node.json

      - name: @ts-nocheck guard
        run: node scripts/check-ts-nocheck.mjs

      - name: Build (smoke test)
        run: bun run build
