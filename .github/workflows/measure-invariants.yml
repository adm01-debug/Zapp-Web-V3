# =============================================================================
# measure-invariants.yml — E20 + E23 do PLANO_INDEPENDENCIA_100_ETAPAS_20260815
# =============================================================================
# Mede o score dos 9 invariantes de desacoplamento ZAPP×Evolution a cada PR
# usando a RÉGUA ÚNICA: scripts/decouple/boundary-audit.mjs em modo ONLINE
# (RPC ops.fn_boundary_audit() contra o banco real, via PostgREST).
#
# MODO ADVISORY: nunca bloqueia PR (continue-on-error: true).
#
# Sem os secrets SUPABASE_URL + SUPABASE_SERVICE_KEY NÃO há medição — o comment
# diz isso explicitamente. Baseline offline não é evidência (cenário C9 do
# plano); este workflow nunca publica score derivado de replay.
# =============================================================================

name: 'Desacoplamento — Score de Invariantes'

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  measure-invariants:
    name: 'Medir Score de Desacoplamento (I1-I9)'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Setup Node.js 20'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 'Medir 9 invariantes (boundary-audit ONLINE — banco real)'
        id: audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "AUDIT_STATUS=NO_SECRETS" >> "$GITHUB_ENV"
            echo "::warning::Secrets SUPABASE_URL/SUPABASE_SERVICE_KEY ausentes — sem medição não há score (C9)."
            exit 0
          fi
          node scripts/decouple/boundary-audit.mjs --out decouple-score.json 2> audit-stderr.txt
          CODE=$?
          cat audit-stderr.txt >&2 || true
          if [ -f decouple-score.json ] && [ "$CODE" -le 1 ]; then
            echo "AUDIT_STATUS=MEASURED" >> "$GITHUB_ENV"
          else
            echo "AUDIT_STATUS=ERROR" >> "$GITHUB_ENV"
            head -c 400 audit-stderr.txt > audit-error.txt || true
          fi
          exit 0

      - name: 'Publicar artifact decouple-score.json'
        if: env.AUDIT_STATUS == 'MEASURED'
        uses: actions/upload-artifact@v7
        with:
          name: decouple-score
          path: decouple-score.json
          retention-days: 30
          if-no-files-found: warn

      - name: 'Postar score como PR comment'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- decouple-score-comment -->';
            const status = process.env.AUDIT_STATUS || 'ERROR';
            let body;

            if (status === 'NO_SECRETS') {
              body = [
                '### Score de Desacoplamento ZAPP×Evolution',
                '',
                '⚠️ **Medição indisponível** — secrets `SUPABASE_URL` / `SUPABASE_SERVICE_KEY` não configurados no repositório.',
                '',
                'Sem medição contra o banco real não há score. Replay de baseline commitado **não é evidência** (cenário C9 do plano).',
                'Último score real commitado: `docs/decouple/BOUNDARY_SCORE_T3.json`.',
              ].join('\n');
            } else if (status === 'ERROR') {
              let err = '';
              try { err = fs.readFileSync('audit-error.txt', 'utf8'); } catch {}
              body = [
                '### Score de Desacoplamento ZAPP×Evolution',
                '',
                '🚨 **Falha na medição online** (boundary-audit não retornou relatório).',
                '',
                '```',
                (err || 'sem stderr capturado').trim(),
                '```',
              ].join('\n');
            } else {
              const r = JSON.parse(fs.readFileSync('decouple-score.json', 'utf8'));
              const s = r.summary;
              const rows = r.invariants.map(function (i) {
                const icon = i.score === 1 ? '✅ PASS' : '🔴 FAIL';
                return '| ' + i.invariant + ' | ' + i.name + ' | ' + icon + ' | ' + (i.detail || 'n/a') + ' |';
              }).join('\n');
              const notaEmoji = ({ A: '🏆', B: '🥈', C: '🥉', D: '📉', F: '🚨' })[s.grade] || '❓';
              body = [
                '### Score de Desacoplamento ZAPP×Evolution',
                '',
                '| # | Invariante | Status | Detalhe |',
                '|---|-----------|--------|---------|',
                rows,
                '',
                '**Score: ' + s.passed + '/' + s.total + ' (' + s.percentage + '%) — Nota ' + notaEmoji + ' ' + s.grade + '**',
                '',
                '> 📊 Medição ONLINE contra o banco real via ops.fn_boundary_audit() — advisory, não bloqueia PR',
                '> ⏰ Medido em: ' + (r.meta.measured_at_db || r.meta.generated_at),
                '> 🔗 Artifact decouple-score.json disponível nos Actions deste commit',
              ].join('\n');
            }

            const fullBody = MARKER + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: fullBody,
              });
            }
