name: 📸 Schema Snapshot

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  schema-snapshot:
    name: Snapshot DB Schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dump schema snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const snap = execSync(`pg_dump --schema-only --no-owner --no-privileges \
              "${process.env.SUPABASE_DB_URL}" 2>/dev/null || echo 'Schema dump failed'`).toString();
            fs.writeFileSync('reports/schema-snapshot.sql', snap);
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Commit snapshot
        run: |
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --global user.name 'github-actions[bot]'
          git add reports/schema-snapshot.sql
          git diff --staged --quiet || git commit -m 'chore(schema): snapshot semanal' && git push
