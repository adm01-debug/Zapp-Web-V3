name: 📸 Schema Snapshot

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema-snapshot:
    name: Snapshot DB Schema
    # Runner self-hosted (VPS): o banco self-hosted so e alcancavel pela rede interna.
    runs-on: [self-hosted, vps-zapp, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dump schema snapshot (pg_dump 15 via container supabase_db)
        run: |
          set -uo pipefail
          # O runner e Ubuntu focal (sem pg_dump 15) e o PGDG removeu o focal (EOL);
          # alem disso o banco so aceita conexao interna. Solucao robusta: usar o
          # pg_dump 15 do PROPRIO container supabase_db (mesma versao do servidor),
          # via docker socket, conectando em 127.0.0.1 com POSTGRES_PASSWORD interno.
          # Nome do container e resolvido dinamicamente (sufixo Swarm muda). Fix 2026-08-07.
          DBC=$(docker ps --filter "name=supabase_db" --format "{{.Names}}" | head -1)
          if [ -z "$DBC" ]; then
            echo "::error::Container supabase_db nao encontrado no node"
            exit 1
          fi
          echo "Usando container do banco: $DBC"
          mkdir -p reports
          docker exec "$DBC" sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump --schema-only --no-owner --no-privileges -h 127.0.0.1 -U postgres postgres' > reports/schema-snapshot.sql 2>/tmp/pgdump.err
          RC=$?
          if [ "$RC" -ne 0 ] || [ ! -s reports/schema-snapshot.sql ]; then
            echo "::error::pg_dump falhou (rc=$RC):"
            head -12 /tmp/pgdump.err
            exit 1
          fi
          echo "Snapshot gravado: $(wc -c < reports/schema-snapshot.sql) bytes"

      - name: Publicar snapshot em branch dedicado
        run: |
          set -e
          [ -f reports/schema-snapshot.sql ] || { echo "Sem arquivo — nada a publicar."; exit 0; }
          git add reports/schema-snapshot.sql
          if git diff --staged --quiet; then
            echo "Sem mudancas no schema desde o ultimo snapshot — nada a publicar."
            exit 0
          fi
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git commit -m "chore(schema): snapshot semanal $(date -u +%Y-%m-%d)"
          # push direto na main e bloqueado pela branch protection (PRs obrigatorios);
          # publica em branch dedicado nao protegido, sobrescrevendo (latest-wins).
          git push origin "HEAD:refs/heads/automation/schema-snapshots" --force
          echo "Snapshot publicado em automation/schema-snapshots"
