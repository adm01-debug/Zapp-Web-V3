name: 📸 Schema Snapshot

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema-snapshot:
    name: Snapshot DB Schema
    # Runner self-hosted (VPS): o banco self-hosted so e alcancavel pela rede interna
    # (portas 5432/6543 fechadas externamente). Runner do GitHub nao conecta. Fix 2026-08-07.
    runs-on: [self-hosted, vps-zapp, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Garantir pg_dump 15 (PGDG)
        run: |
          set -e
          if pg_dump --version 2>/dev/null | grep -qE ' 1[5-9]'; then
            echo "pg_dump compativel ja instalado: $(pg_dump --version)"
            exit 0
          fi
          echo "Instalando postgresql-client-15 via PGDG..."
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates gnupg lsb-release
          install -d /usr/share/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list
          apt-get update -qq
          apt-get install -y -qq postgresql-client-15
          echo "Instalado: $(pg_dump --version)"

      - name: Dump schema snapshot
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::SUPABASE_DB_URL nao configurado — snapshot pulado"
            exit 0
          fi
          mkdir -p reports
          if pg_dump --schema-only --no-owner --no-privileges "$SUPABASE_DB_URL" > reports/schema-snapshot.sql 2>/tmp/pgdump.err; then
            echo "Snapshot gravado: $(wc -c < reports/schema-snapshot.sql) bytes"
          else
            echo "::error::pg_dump falhou:"
            head -8 /tmp/pgdump.err
            exit 1
          fi

      - name: Publicar snapshot em branch dedicado
        run: |
          set -e
          [ -f reports/schema-snapshot.sql ] || { echo "Sem arquivo — nada a publicar (dump pulado)."; exit 0; }
          git add reports/schema-snapshot.sql
          if git diff --staged --quiet; then
            echo "Sem mudancas no schema desde o ultimo snapshot — nada a publicar."
            exit 0
          fi
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git commit -m "chore(schema): snapshot semanal $(date -u +%Y-%m-%d)"
          # push direto na main e bloqueado pela branch protection (PRs obrigatorios);
          # publica em branch dedicado nao protegido, sobrescrevendo (latest-wins).
          git push origin "HEAD:refs/heads/automation/schema-snapshots" --force
          echo "Snapshot publicado em automation/schema-snapshots"
