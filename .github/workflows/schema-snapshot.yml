name: 📸 Schema Snapshot

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema-snapshot:
    name: Snapshot DB Schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Dump schema snapshot
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            if (!process.env.SUPABASE_DB_URL) {
              console.log('::warning::SUPABASE_DB_URL não configurado — snapshot pulado');
              return;
            }
            try {
              const snap = execSync(`pg_dump --schema-only --no-owner --no-privileges "${process.env.SUPABASE_DB_URL}"`, { stdio: ['ignore', 'pipe', 'pipe'] }).toString();
              fs.mkdirSync('reports', { recursive: true });
              fs.writeFileSync('reports/schema-snapshot.sql', snap);
              console.log(`Snapshot gravado: ${snap.length} bytes`);
            } catch (e) {
              console.log(`::error::pg_dump falhou (${e.status}): ${e.stderr?.toString()?.slice(0, 400)}`);
              process.exit(1);
            }
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Commit snapshot
        run: |
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --global user.name 'github-actions[bot]'
          git add reports/schema-snapshot.sql
          git diff --staged --quiet || git commit -m 'chore(schema): snapshot semanal' && git push
