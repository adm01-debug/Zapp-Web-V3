name: Merge Bot
on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'Space-separated PR numbers to merge'
        required: true
        default: '548 550 551 553 559 562 563 564 565 566 567 568'

permissions:
  pull-requests: write
  contents: write
  administration: write

jobs:
  merge-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Merge PRs with admin bypass
        id: merge_prs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBERS: ${{ github.event.inputs.pr_numbers }}
        run: |
          MERGED_BRANCHES=''
          FAILED=''
          for pr in $PR_NUMBERS; do
            echo "=== Merging PR #${pr} ==="
            BRANCH=$(gh pr view "${pr}" --repo "$GITHUB_REPOSITORY" --json headRefName \
              -q .headRefName 2>/dev/null || true)
            if gh pr merge "${pr}" --repo "$GITHUB_REPOSITORY" --squash --admin 2>&1; then
              echo "PR #${pr} merged successfully (branch: ${BRANCH})"
              [ -n "$BRANCH" ] && MERGED_BRANCHES="${MERGED_BRANCHES} ${BRANCH}"
            else
              echo "FAILED to merge PR #${pr}"
              FAILED="${FAILED} ${pr}"
            fi
          done
          echo "merged_branches=${MERGED_BRANCHES}" >> "$GITHUB_OUTPUT"
          if [ -n "$FAILED" ]; then
            echo "Failed PRs:${FAILED}"
            exit 1
          fi

      - name: Delete merged branches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_BRANCHES: ${{ steps.merge_prs.outputs.merged_branches }}
        run: |
          if [ -z "$MERGED_BRANCHES" ]; then
            echo "No branches to delete."
            exit 0
          fi
          for branch in $MERGED_BRANCHES; do
            echo "Deleting branch: ${branch}"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/heads/${branch}" \
              && echo "Deleted: ${branch}" \
              || echo "Could not delete ${branch} (may already be deleted)"
          done
          echo "Branch cleanup complete."
