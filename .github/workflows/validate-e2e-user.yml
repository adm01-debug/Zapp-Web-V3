name: Validate E2E user (REST)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: { required: true }
      E2E_USER_EMAIL:            { required: true }

jobs:
  validate:
    name: Validar permissões CRM do E2E_USER_EMAIL
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 10
    steps:
      # E2E-05 (2026-08-07): porta 22 da VPS fechada p/ internet — SSH morto.
      # Validação via zapp.rpc_e2e_validate_user() (SECURITY DEFINER) + REST
      # com service_role — sem SSH, sem psql remoto, sem runner.
      - name: Validar usuário E2E via RPC
        env:
          # URL pública estável (mesmo padrão do edge-auth-smoke); evita secret extra no contrato
          SUPABASE_URL: https://supabase.atomicabr.com.br
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "$SERVICE_ROLE_KEY" ] || [ -z "$E2E_USER_EMAIL" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY / E2E_USER_EMAIL não configurados nos secrets."
            exit 1
          fi
          HTTP=$(curl -s -o /tmp/validate.json -w "%{http_code}" --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/rpc_e2e_validate_user" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"p_email\":\"$E2E_USER_EMAIL\"}" || true)
          echo "HTTP: $HTTP"
          cat /tmp/validate.json
          if [ "$HTTP" != "200" ]; then
            echo "::error::E2E_VALIDATION_FAIL — RPC retornou HTTP $HTTP ($(cat /tmp/validate.json))"
            exit 1
          fi
          VALID=$(jq -r '.valid // false' /tmp/validate.json 2>/dev/null || echo false)
          if [ "$VALID" != "true" ]; then
            echo "::error::E2E_VALIDATION_FAIL — $(cat /tmp/validate.json)"
            echo "::error::Rode o workflow seed-e2e-user antes (usuário E2E inválido no banco)."
            exit 1
          fi
          echo "✅ E2E_USER_EMAIL válido (existente, confirmado, não-banido, profile ativo, role CRM)"
