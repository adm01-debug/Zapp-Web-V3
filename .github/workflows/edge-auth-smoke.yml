name: Edge Auth Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      supabase_url:
        description: Base URL
        required: false
        default: https://supabase.atomicabr.com.br
        type: string
  schedule:
    - cron: '0 6 * * *'

jobs:
  smoke:
    name: edge-auth-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: PR mode - verificacao estatica
        if: github.event_name == 'pull_request'
        run: |
          echo "PR mode: static check only"
          [ -d "supabase/functions" ] && echo "OK: functions dir found" || exit 1
          echo "edge-auth-smoke: static check OK"
      - name: Production smoke test
        if: github.event_name != 'pull_request'
        run: |
          BASE_URL="${SUPABASE_URL:-https://supabase.atomicabr.com.br}"
          for fn in health-check status; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/functions/v1/$fn" || true)
            echo "$fn: http=$code"
          done
          echo "Smoke test concluido"
        env:
          SUPABASE_URL: ${{ inputs.supabase_url || secrets.SUPABASE_URL || 'https://supabase.atomicabr.com.br' }}
