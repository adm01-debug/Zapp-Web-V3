name: AI Agent PR Policy

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-ai-authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for AI-generated commits in PR
        run: |
          AI_AUTHORS=(
            "claude" "copilot" "lovable" "github-actions" "dependabot"
            "noreply@anthropic.com" "noreply@github.com"
          )

          # Get commits unique to this PR (not on base branch)
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          echo "Checking commits in PR: $BASE..$HEAD"
          COMMITS=$(git log --no-merges --format='%an <%ae>' "$BASE..$HEAD" 2>/dev/null || true)

          if [ -z "$COMMITS" ]; then
            echo "No commits to check."
            exit 0
          fi

          BLOCKED=false
          for author in "${AI_AUTHORS[@]}"; do
            if echo "$COMMITS" | grep -qi "$author"; then
              echo "::error::Blocked AI-authored commit detected: '$author'"
              BLOCKED=true
            fi
          done

          if [ "$BLOCKED" = true ]; then
            echo ""
            echo "AI agents must use pull requests — direct commits are not allowed."
            echo "Committers found:"
            echo "$COMMITS"
            exit 1
          fi

          echo "✅ No AI-authored commits detected."
