# ============================================================
# BUNDLE SECRET GUARD -- impede service_role no bundle publico
# ------------------------------------------------------------
# Por que existe (incidente 2026-08-20):
#   O bundle JS do www.zappweb.app.br (servido pela Vercel) embutia
#   uma service_role JWT -- a env VITE_SUPABASE_PUBLISHABLE_KEY estava
#   com a chave errada no build. service_role no frontend = bypass
#   total de RLS se a chave estiver viva. O codigo (client.ts) ja era
#   defensivo; a falha foi de CONFIGURACAO de env, que teste de codigo
#   nao pega.
#
# O que faz:
#   Pos-deploy, baixa o index.html de cada host publico, descobre os
#   assets JS (/assets/*.js), baixa cada um e procura JWTs. Para cada
#   JWT, DECODIFICA o payload e FALHA se role for service_role/service.
#   anon e esperada e passa.
#
# Fail-closed: se nao conseguir baixar o bundle, falha (nao passa cego).
# Gatilho: pos-deploy (workflow_run) + diario (catch de drift) + manual.
# ============================================================
name: Bundle Secret Guard

on:
  workflow_run:
    workflows: ["Build & Deploy — ZAPP web v3"]
    types: [completed]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  guard:
    name: Bundle sem service_role
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - name: "Varrer bundles publicos por service_role"
        run: |
          set -u
          HOSTS="https://www.zappweb.app.br https://zappweb.app.br https://zapp.atomicabr.com.br"
          FAIL=0
          for H in $HOSTS; do
            echo "=== $H ==="
            HTML=$(curl -s --max-time 20 "$H/" || true)
            if [ -z "$HTML" ]; then
              echo "::error::FETCH_FAIL -- nao baixou $H (fail-closed)"
              FAIL=1; continue
            fi
            ASSETS=$(echo "$HTML" | grep -oE '/assets/[A-Za-z0-9_.-]+\.js' | sort -u)
            if [ -z "$ASSETS" ]; then
              echo "::warning::sem assets JS no index de $H"
            fi
            for A in $ASSETS; do
              JS=$(curl -s --max-time 20 "$H$A" || true)
              [ -z "$JS" ] && continue
              HITS=$(echo "$JS" | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | sort -u | while read J; do
                PAYLOAD=$(echo "$J" | cut -d. -f2)
                ROLE=$(node -e "try{const p=Buffer.from(process.argv[1].replace(/-/g,'+').replace(/_/g,'/'),'base64').toString();const o=JSON.parse(p);if(o&&o.role)process.stdout.write(String(o.role))}catch(e){}" "$PAYLOAD" 2>/dev/null || true)
                if [ "$ROLE" = "service_role" ] || [ "$ROLE" = "service" ]; then echo "$A"; fi
              done)
              if [ -n "$HITS" ]; then
                echo "::error::SERVICE_ROLE_IN_BUNDLE -- $H$A embute JWT com role=service_role"
                FAIL=1
              else
                echo "OK $A"
              fi
            done
          done
          if [ "$FAIL" != "0" ]; then
            echo ""
            echo "GUARD FALHOU -- um bundle publico embute service_role ou nao pode ser verificado."
            echo "Corrija VITE_SUPABASE_ANON_KEY / VITE_SUPABASE_PUBLISHABLE_KEY e redeploye."
            exit 1
          fi
          echo "Todos os bundles publicos limpos (sem service_role)."
