name: Cleanup E2E data (VPS)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_DB_URL: { required: true }
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    # E2E-05-FIX-v2 (2026-08-07): runner self-hosted (vps-zapp) e nao ubuntu-latest.
    # Porta 5432 esta FECHADA externamente — apenas o runner VPS alcanca o DB interno
    # em 10.0.1.243. O psql e instalado no step abaixo se ausente.
    runs-on: [self-hosted, vps-zapp, linux, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar psql se ausente
        # O runner self-hosted (myoung34/github-runner Ubuntu 20.04) nao tem psql
        # pre-instalado — apt-get disponivel (runner tem privilegios de root).
        run: which psql 2>/dev/null || apt-get install -y --no-install-recommends postgresql-client

      - name: Rodar cleanup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/cleanup-e2e-data.sh
