name: Cleanup E2E data (VPS)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_DB_URL: { required: true }
  schedule:
    - cron: '0 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar psql
        # E2E-05-FIX (2026-08-07): o script so precisa de psql + SUPABASE_DB_URL.
        # SSH nunca funcionou externamente (porta 22 fechada na VPS AtomicaBR).
        run: sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Rodar cleanup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/cleanup-e2e-data.sh
