name: Cleanup E2E data (VPS)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      VPS_SSH_HOST:    { required: true }
      VPS_SSH_USER:    { required: true }
      VPS_SSH_KEY:     { required: true }
      SUPABASE_DB_URL: { required: true }
  schedule:
    # Diariamente às 04:00 BRT (07:00 UTC) — GC defensivo se algum
    # afterAll do Playwright falhar.
    - cron: '0 7 * * *'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Enviar script
        run: |
          scp -i ~/.ssh/id_ed25519 scripts/cleanup-e2e-data.sh \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/tmp/"

      - name: Rodar cleanup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "chmod +x /tmp/cleanup-e2e-data.sh && \
             SUPABASE_DB_URL='$SUPABASE_DB_URL' /tmp/cleanup-e2e-data.sh"
