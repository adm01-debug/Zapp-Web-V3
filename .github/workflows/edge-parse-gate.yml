name: edge-parse-gate
# Bloqueia merge (PR) e revalida no push (main) ANTES do deploy copiar codigo
# que nao parseia. Cobre o grafo _shared transitivo via deno check.
#
# [FIX 2026-08-18 v2] Root cause dos runs vermelhos: a imagem supabase/edge-runtime
# NAO carrega o CLI 'deno' (so o binario do runtime em Go) — portanto
# 'deno bundle --check' e 'deno check' dentro do container falhavam com
# "deno: not found" antes de qualquer verificacao real.
# Fix: usa denoland/setup-deno (mesmo padrao do edge-deploy.yml e deno-contract-tests)
# com deno check no main/index.ts (cobre o closure do boot inteiro, incluindo _shared).
on:
  pull_request:
    branches: [main]
    paths: ['supabase/functions/**']
  push:
    branches: [main]
    paths: ['supabase/functions/**']

permissions:
  contents: read

concurrency:
  group: edge-parse-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  edge-parse-gate:
    name: Parse gate (deno check v2.x — closure do boot)
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # deno check resolve transitivamente todos os imports de _shared
      # incluidos por main/index.ts — mesmo escopo do incidente 17/08.
      - name: deno check do main/index.ts (cobre _shared transitivo)
        run: |
          set -euo pipefail
          cd supabase/functions
          deno check main/index.ts

      # Cobertura dos _shared nao importados pelo main
      # (mesmas exclusoes do deploy-edge.sh P-13).
      - name: deno check dos _shared (cobertura complementar)
        run: |
          set -euo pipefail
          cd supabase/functions
          FILES=$(find _shared -type f -name '*.ts' \
            ! -path '*/__tests__/*' \
            ! -path '*/__fixtures__/*' \
            ! -name '*.test.ts' \
            ! -name '*.spec.ts')
          if [ -z "$FILES" ]; then
            echo "Nenhum arquivo _shared encontrado — skip."
            exit 0
          fi
          echo "$FILES" | xargs deno check
