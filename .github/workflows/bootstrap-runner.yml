name: 🤖 Bootstrap Self-Hosted Runner

on:
  workflow_dispatch:

# GITHUB_TOKEN com actions:write consegue gerar registration tokens para runners do repo
permissions:
  actions: write
  contents: read

jobs:
  register-runner:
    name: Gerar token e registrar runner na VPS
    runs-on: ubuntu-latest

    steps:
      - name: Gerar Runner Registration Token (via GITHUB_TOKEN nativo)
        id: regtoken
        run: |
          echo "=== Gerando registration token ==="
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token")

          echo "Raw response: $RESPONSE"
          TOKEN=$(echo "$RESPONSE" | jq -r '.token // empty')
          EXPIRES=$(echo "$RESPONSE" | jq -r '.expires_at // empty')

          if [ -z "$TOKEN" ]; then
            echo "::error::Falha ao gerar token. Resp: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "runner_token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "✅ Token OK. Expira: $EXPIRES"

      - name: Configurar SSH e instalar runner na VPS
        env:
          RUNNER_TOKEN: ${{ steps.regtoken.outputs.runner_token }}
          VPS_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          echo "=== Atualizando Docker secret + subindo runner na VPS ==="
          ssh -i ~/.ssh/id_ci \
            -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" bash -s << SSHEOF
            set -euo pipefail

            echo "--- Removendo secret antigo ---"
            docker secret rm gh_runner_pat_v1 2>/dev/null || true
            sleep 2

            echo "--- Criando secret com registration token ---"
            printf '%s' "$RUNNER_TOKEN" | docker secret create gh_runner_pat_v1 -
            echo "Secret criado."

            echo "--- Atualizando stack para RUNNER_TOKEN mode ---"
            docker service update \
              --env-add "RUNNER_TOKEN_FILE=/run/secrets/gh_runner_pat_v1" \
              --env-rm "GITHUB_ACCESS_TOKEN" \
              --replicas 1 \
              github-actions-runner_runner 2>&1 || true

            echo "--- Aguardando init do runner (30s) ---"
            sleep 30

            echo "--- Status atual ---"
            docker service ps github-actions-runner_runner \
              --format "Task: {{.Name}} | State: {{.CurrentState}} | Error: {{.Error}}" 2>/dev/null | head -5
            docker service logs github-actions-runner_runner --tail 20 2>&1 || true
SSHEOF

      - name: Verificar runner registrado
        run: |
          echo "Aguardando 20s adicionais..."
          sleep 20

          RUNNERS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners")

          echo "Todos os runners:"
          echo "$RUNNERS" | jq '[.runners[] | {name, status, busy, labels: [.labels[].name]}]' 2>/dev/null || echo "$RUNNERS"

          VPS_COUNT=$(echo "$RUNNERS" | jq '[.runners[] | select(.labels[]?.name == "vps-zapp")] | length' 2>/dev/null || echo 0)

          if [ "$VPS_COUNT" -gt 0 ]; then
            echo "✅ Runner vps-zapp REGISTRADO com sucesso!"
          else
            echo "::warning::Runner vps-zapp ainda não visível via API (pode demorar 1-2min)"
          fi
