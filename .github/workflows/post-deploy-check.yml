# ============================================================
# 🩺 POST-DEPLOY HEALTH CHECK (Etapa 25)
# ------------------------------------------------------------
# Objetivo: após CADA deploy do frontend zappweb (workflow
# "🚀 Build & Deploy — ZAPP web v3" = deploy-vps.yml, que sobe a
# imagem zapp-web via Portainer/Traefik), validar que a stack de
# produção ficou de pé:
#
#   1) TTM (Time To Main) do site https://www.zappweb.app.br/:
#      curl -w time_total deve ser < 3.0s (falha se > 3.0s ou se a
#      conexão falhou/timeout — HTTP 000).
#   2) Supabase self-hosted — PostgREST em
#      https://supabase.atomicabr.com.br/rest/v1/ deve responder.
#      SEM apikey o PostgREST devolve 401 — isso é NORMAL e conta
#      como "servidor vivo" (aceitamos 4xx). Falha APENAS em
#      5xx / timeout / 000.
#   3) Edge Function get-media-base64 deve responder:
#      POST sem body devolve 4xx (400/401) — aceitável = função
#      viva (aceitamos 4xx). Falha APENAS em 5xx (500/503/...) /
#      timeout / 000.
#
# Implementação 100% bash + curl + bc (sem ações externas).
# ⚠️ bc NÃO vem pré-instalado nas imagens ubuntu do GitHub Actions
# (verificado no readme oficial do actions/runner-images) — por isso
# o primeiro step o instala via apt-get (ainda é shell puro, sem
# actions do marketplace) e falha FECHADO (fail-closed) se não
# conseguir, para nunca passar silenciosamente com TTM alto.
# Gatilho: workflow_run no deploy-vps.yml com types: [completed]
# (aceita nome do arquivo OU nome do workflow; usamos o nome do
# arquivo por ser imune a mudanças cosméticas no `name:`).
# Dispara tanto em sucesso quanto em falha do deploy, para sempre
# sabermos se o site continua no ar.
# ============================================================
name: 🩺 Post-Deploy Health Check

on:
  workflow_run:
    workflows: ["🚀 Build & Deploy — ZAPP web v3"]
    types: [completed]

permissions:
  contents: read

jobs:
  health-check:
    name: Health check pós-deploy
    runs-on: [Linux, X64, vps-zapp]
    # Job sem timeout pode ficar preso 6h (default) — 30min cobre qualquer
    # execução real (curls) e evita run órfão consumindo runner.
    timeout-minutes: 30
    steps:
      - name: "🔧 Preparação — garante bc no runner (fail-closed)"
        run: |
          if ! command -v bc >/dev/null 2>&1; then
            echo "bc ausente no runner — instalando via apt-get (shell puro, sem actions externas)..."
            sudo apt-get update -qq && sudo apt-get install -y -qq bc
          fi
          command -v bc >/dev/null 2>&1 || { echo "::error::BC_UNAVAILABLE — não foi possível obter bc; abortando (fail-closed)"; exit 1; }
          bc --version | head -1

      - name: "ℹ️ Contexto do deploy"
        run: |
          echo "Workflow de deploy: ${{ github.event.workflow_run.name }}"
          echo "Conclusão do deploy: ${{ github.event.workflow_run.conclusion }}"
          echo "SHA: ${{ github.event.workflow_run.head_sha }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Run: ${{ github.event.workflow_run.html_url }}"

      - name: "1/3 — TTM www.zappweb.app.br (< 3.0s)"
        run: |
          RESP=$(curl -s -o /dev/null -w '%{http_code} %{time_total}' --max-time 15 https://www.zappweb.app.br/ || true)
          CODE=$(echo "$RESP" | awk '{print $1}')
          TTM=$(echo "$RESP" | awk '{print $2}')
          CODE=${CODE:-000}
          TTM=${TTM:-0}
          echo "www.zappweb.app.br → HTTP ${CODE} em ${TTM}s"
          if [ "$CODE" = "000" ]; then
            echo "::error::SITE_DEAD — conexão falhou/timeout (HTTP 000)"
            exit 1
          fi
          if [ "$(echo "$TTM > 3.0" | bc -l)" = "1" ]; then
            echo "::error::TTM_TOO_SLOW — ${TTM}s > 3.0s (limite)"
            exit 1
          fi
          echo "✅ Site OK — TTM ${TTM}s (< 3.0s)"

      - name: "2/3 — Supabase PostgREST vivo (4xx ok; 5xx/timeout = falha)"
        if: always()
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://supabase.atomicabr.com.br/rest/v1/ || true)
          CODE=${CODE:-000}
          echo "supabase.atomicabr.com.br/rest/v1/ → HTTP ${CODE}"
          if [ "$CODE" = "000" ]; then
            echo "::error::SUPABASE_DEAD — timeout/conexão (HTTP 000)"
            exit 1
          fi
          case "$CODE" in
            5*) echo "::error::SUPABASE_DEAD — HTTP ${CODE} (5xx = servidor fora)"; exit 1 ;;
          esac
          echo "✅ PostgREST vivo — HTTP ${CODE} (401/4xx sem apikey é esperado)"

      - name: "3/3 — Edge Function get-media-base64 viva (4xx ok; 5xx/timeout = falha)"
        if: always()
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST https://supabase.atomicabr.com.br/functions/v1/evolution-api/get-media-base64 || true)
          CODE=${CODE:-000}
          echo "evolution-api/get-media-base64 (POST sem body) → HTTP ${CODE}"
          if [ "$CODE" = "000" ]; then
            echo "::error::EDGE_FUNCTION_DEAD — timeout/conexão (HTTP 000)"
            exit 1
          fi
          case "$CODE" in
            5*) echo "::error::EDGE_FUNCTION_DEAD — HTTP ${CODE} (5xx = função fora)"; exit 1 ;;
          esac
          echo "✅ Edge Function viva — HTTP ${CODE} (4xx sem body é esperado)"
