name: Cleanup .dist-backups tracking

# One-shot workflow: remove os 5521 arquivos .dist-backups/ do git tracking.
# Executar MANUALMENTE via Actions → "Run workflow".
# Após a execução, este arquivo pode ser deletado.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "CONFIRMAR" para executar'
        required: true
        default: ''

jobs:
  cleanup:
    if: github.event.inputs.confirm == 'CONFIRMAR'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove .dist-backups from tracking
        run: |
          if git ls-files --error-unmatch .dist-backups/LATEST 2>/dev/null; then
            echo ".dist-backups/ tracked — removing from git index..."
            git rm -r --cached .dist-backups/
            echo ".dist-backups/" >> .gitignore
            git add .gitignore
            git commit -m "chore(repo): remove .dist-backups/ do tracking [skip ci]

          113 MB / 5521 arquivos gerados automaticamente pelo Vercel.
          Adicionado ao .gitignore para não ser re-trackado.
          Cleanup executado via GitHub Actions (GITHUB_TOKEN)."
            git push origin main
            echo "✅ .dist-backups/ removido com sucesso"
          else
            echo ".dist-backups/ já não está trackado — nada a fazer."
          fi

      - name: Verify cleanup
        run: |
          echo "Files remaining in .dist-backups/ tracking:"
          git ls-files .dist-backups/ | wc -l
