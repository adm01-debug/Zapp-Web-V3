name: Cleanup .dist-backups tracking

# One-shot: remove 5521 arquivos .dist-backups/ do git tracking (113 MB).
# Trigger manual via Actions UI.

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Remove .dist-backups from tracking
        run: |
          COUNT=$(git ls-files .dist-backups/ | wc -l)
          echo "Arquivos .dist-backups/ no tracking: $COUNT"
          if [ "$COUNT" -gt "0" ]; then
            git rm -r --cached .dist-backups/
            grep -qxF '.dist-backups/' .gitignore || echo '.dist-backups/' >> .gitignore
            git add .gitignore
            git commit -m "chore(repo): remove .dist-backups/ do tracking [skip ci]

          $COUNT arquivos removidos (113 MB). Gerado automaticamente pelo Vercel.
          Adicionado ao .gitignore. Cleanup via GitHub Actions."
            git push origin main
            echo "SUCCESS: $COUNT arquivos removidos"
          else
            echo "SKIP: .dist-backups/ ja nao esta no tracking"
          fi

      - name: Result
        run: |
          echo "Tracking pos-cleanup: $(git ls-files .dist-backups/ | wc -l) arquivos"
