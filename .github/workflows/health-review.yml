name: Health Review Quinzenal

on:
  pull_request:
    branches: [main, master]
  schedule:
    # Todo dia 1 e 15 do mês, às 9 h (UTC)
    - cron: '0 9 1,15 * *'
  workflow_dispatch: {}  # Permite execução manual

jobs:
  pr-check:
    name: Health Review — skipped on PR (runs on schedule)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Health Review skipped on PRs — runs automatically on the 1st and 15th of each month."

  health-review:
    name: Project Health Review
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Health Checks
        id: health
        run: |
          #! /bin/bash
          RESULT=""

          # 1. @ts-nocheck count
          TS_COUNT=$(grep -r '@ts-nocheck' src/ --include='*.ts' --include='*.tsx' -l 2>/dev/null | wc -l | tr -d ' ')
          RESULT="$RESULT\n- @ts-nocheck: $TS_COUNT files (baseline: 9)"

          # 2. Total workflows
          WF_COUNT=$(ls .github/workflows/*.yml 2>/dev/null | wc -l | tr -d ' ')
          RESULT="$RESULT\n- Workflows: $WF_COUNT yml files"

          # 3. Migration count
          MIG_COUNT=$(find supabase/migrations -name '*.sql' -type f 2>/dev/null | wc -l | tr -d ' ')
          RESULT="$RESULT\n- Migrations: $MIG_COUNT files"

          # 4. Root files poluição
          ROOT_MD_COUNT=$(find . -maxdepth 1 -name '*.md' -type f 2>/dev/null | wc -l | tr -d ' ')
          RESULT="$RESULT\n- Markdown no root: $ROOT_MD_COUNT files (meta: <10)"

          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "ts_count=$TS_COUNT" >> "$GITHUB_OUTPUT"
          echo "wf_count=$WF_COUNT" >> "$GITHUB_OUTPUT"
          echo "mig_count=$MIG_COUNT" >> "$GITHUB_OUTPUT"
          echo "root_md_count=$ROOT_MD_COUNT"

      - name: Create Health Review Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const title = `[Health Review] Quinzenal - ${now.toISOString().split('T')[0]}`;
            const tsCount = '${{ steps.health.outputs.ts_count }}' || '?';
            const wfCount = '${{ steps.health.outputs.wf_count }}' || '?';
            const migCount = '${{ steps.health.outputs.mig_count }}' || '?';
            const rootMdCount = '${{ steps.health.outputs.root_md_count }}' || '?';

            const body = [
              '# Review Quinzenal de Saúde do Projeto',
              '```',
              `@ts-nocheck: ${tsCount} files (baseline: 9)`,
              `Workflows CI: ${wfCount} arquivos`,
              `Migrations: ${migCount} arquivos`,
              `Markdown no root: ${rootMdCount} files (meta: <10)`,
              '```',
              '## Checklist do Time',
              '- [ ] Revisar aberturas de segurança (Dependabot, CodeQL)',
              '- [ ] Verificar se bucket whatsapp-media continua privado',
              '- [ ] Revisar PRs abertos (meta: zero PRs abertos por mais de 7 dias)',
              '- [ ] Atualizar baselines se @ts-nocheck diminuiu',
              '- [ ] Revisar fix/feat ratio (meta: >= 2:1)',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['maintenance', 'health-review']
            });
