name: schema-drift-guard

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  static-drift:
    name: schema-drift-guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect DDL outside supabase/migrations/
        run: |
          set -euo pipefail
          base_ref="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" 2>/dev/null || true
          if git rev-parse "$base_ref" >/dev/null 2>&1; then
            changed_sql=$(git diff --diff-filter=AM --name-only "$base_ref"...HEAD -- '*.sql' | grep -v '^supabase/migrations/' | grep -v '^infra/migrations/' | grep -v '^scripts/' | grep -v '^supabase/functions/' | grep -v '^supabase/ci/' || true)
          else
            changed_sql=""
          fi
          if [ -z "$changed_sql" ]; then echo "Sem .sql fora de migrations. OK."; exit 0; fi
          ddl_found=0
          for f in $changed_sql; do
            if grep -qiE '^\s*(CREATE|ALTER|DROP)\s+(TABLE|VIEW|FUNCTION|INDEX|SCHEMA|TYPE|SEQUENCE|TRIGGER|POLICY)' "$f" 2>/dev/null; then
              echo "::error file=$f::DDL fora de supabase/migrations/"; ddl_found=1
            fi
          done
          if [ "$ddl_found" -eq 1 ]; then exit 1; fi
          echo "Nenhum DDL fora dos diretorios rastreados. OK."
  live-drift:
    name: Live schema drift (requer DATABASE_URL)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL nao definido"; exit 0; fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT ops.check_schema_drift(true);"
