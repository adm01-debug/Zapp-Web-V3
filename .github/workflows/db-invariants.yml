# ==========================================================================
# DB INVARIANTS — E20
# Validates that critical database contracts are not violated by any PR.
# ==========================================================================
# Invariants checked:
#   INV-1: All app Realtime subscriptions use the correct physical schema
#   INV-2: No Supabase subscription targets a leaf partition
#   INV-3: No hardcoded DEFAULT_WHATSAPP_INSTANCE in subscription filters
#   INV-4: Every useEffect that calls supabase.channel() must call unsubscribe()
#   INV-5: No bare .from('evolution_messages') without schema qualification
# ==========================================================================

name: DB Invariants

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "supabase/**"
  pull_request:
    branches: [main, develop]

concurrency:
  group: db-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: DB Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "INV-1: No schema:'public' in Realtime subscriptions"
        run: |
          echo "Checking for schema:'public' in .channel().on() calls..."
          # Whitelist exceptions — files where schema:'public' is intentional because
          # the physical table lives in public and is added to supabase_realtime:
          #   useAudioMessagePlayer.ts — public.audio-messages bucket (physical)
          #   useRetryMetrics.ts       — public.evolution_retry_metrics (physical table,
          #                              added by migration 20260802000003; zapp.evolution_retry_metrics
          #                              is a VIEW that never emits CDC events)
          FOUND=$(grep -rn "schema: ['\"']public['\"']" src/ \
            --include="*.ts" --include="*.tsx" \
            -l 2>/dev/null | \
            grep -v "src/features/inbox/components/useAudioMessagePlayer\.ts" | \
            grep -v "src/features/admin/hooks/monitoring/useRetryMetrics\.ts" \
            || true)

          if [ -n "$FOUND" ]; then
            echo "::error::INV-1 VIOLATION — schema:'public' detected in subscription(s)."
            grep -rn "schema: ['\"']public['\"']" src/ \
              --include="*.ts" --include="*.tsx" \
              --exclude="useAudioMessagePlayer.ts" \
              --exclude="useRetryMetrics.ts" 2>/dev/null || true
            exit 1
          fi
          echo "INV-1 passed."

      - name: "INV-2: No partition-leaf table names in Realtime subscriptions"
        run: |
          LEAF_PATTERN="(evolution_messages|evolution_conversations|evolution_webhook_events_v2)_(wpp2|artes|comercial_[0-9]+|compras|default|financeiro|gravacao|logistica|marketing|archive|wpp2_archive)"
          echo "Checking for partition leaf table subscriptions..."
          FOUND=$(grep -rEn "table: ['\"']${LEAF_PATTERN}['\"']" src/ \
            --include="*.ts" --include="*.tsx" 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::INV-2 VIOLATION — Realtime subscription on partition leaf detected."
            echo "$FOUND"
            exit 1
          fi
          echo "INV-2 passed."

      - name: "INV-3: No hardcoded 'wpp2' in Realtime subscription filters"
        run: |
          echo "Checking for hardcoded 'wpp2' in filter strings..."
          FOUND=$(grep -rn "=eq\.wpp2\b" src/ \
            --include="*.ts" --include="*.tsx" 2>/dev/null | \
            grep -v "DEFAULT_WHATSAPP_INSTANCE\|// \|^[[:space:]]*//" || true)

          if [ -n "$FOUND" ]; then
            echo "::error::INV-3 VIOLATION — hardcoded 'wpp2' instance filter in Realtime subscription."
            echo "$FOUND"
            echo ""
            echo "Fix: Use a variable for the instance name:"
            echo '     filter: `instance_name=eq.${instanceName}`'
            echo "     where instanceName comes from props, params, or DEFAULT_WHATSAPP_INSTANCE."
            exit 1
          fi
          echo "INV-3 passed."

      - name: "INV-4: channel() calls must have matching unsubscribe() cleanup"
        run: |
          echo "Checking for .channel() without .unsubscribe() / removeChannel()..."
          VIOLATIONS=""

          CHANNEL_FILES=$(
            {
              grep -rl "supabase\.channel(" src/ \
                --include="*.ts" --include="*.tsx" 2>/dev/null || true
              grep -rl "supabase" src/ \
                --include="*.ts" --include="*.tsx" 2>/dev/null | \
                xargs -r grep -l "^[[:space:]]*\.channel(" 2>/dev/null || true
            } | sort -u | xargs -r grep -l "useEffect" 2>/dev/null || true
          )

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            HAS_SUBSCRIBE=$(grep -c "\.subscribe(" "$file" 2>/dev/null || true); HAS_SUBSCRIBE=${HAS_SUBSCRIBE:-0}
            HAS_CLEANUP=$(grep -cE "\.unsubscribe\(\)|removeChannel" "$file" 2>/dev/null || true); HAS_CLEANUP=${HAS_CLEANUP:-0}
            if [ "$HAS_SUBSCRIBE" -gt 0 ] && [ "$HAS_CLEANUP" -eq 0 ]; then
              VIOLATIONS="${VIOLATIONS}\n  $file (subscribe: $HAS_SUBSCRIBE, cleanup: 0)"
            fi
          done <<< "$CHANNEL_FILES"

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::INV-4 VIOLATION — .channel() without .unsubscribe() / removeChannel() cleanup."
            echo -e "Files with missing cleanup:$VIOLATIONS"
            exit 1
          fi
          echo "INV-4 passed."

      - name: "INV-5: evolution_messages/conversations subscriptions must use schema:'evo'"
        run: |
          echo "Checking evolution_* table subscriptions for correct schema..."
          FILES=$(grep -rl "table: ['\"']evolution_\(messages\|conversations\)['\"']" src/ \
            --include="*.ts" --include="*.tsx" 2>/dev/null || true)
          VIOLATIONS=""
          for file in $FILES; do
            HAS_EVO_SCHEMA=$(grep -c "schema: ['\"']evo['\"']" "$file" 2>/dev/null || echo "0")
            if [ "$HAS_EVO_SCHEMA" -eq 0 ]; then
              VIOLATIONS="${VIOLATIONS}\n  $file"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::INV-5 VIOLATION — evolution_messages/conversations subscribed without schema:'evo'."
            echo -e "Files with missing schema:$VIOLATIONS"
            exit 1
          fi
          echo "INV-5 passed."

      - name: Summary
        if: success()
        run: |
          echo "======================================"
          echo "ALL 5 DB INVARIANTS PASSED"
          echo "======================================"
          echo "INV-1: No schema:'public' in subscriptions  v"
          echo "INV-2: No partition-leaf table subscriptions v"
          echo "INV-3: No hardcoded 'wpp2' in filters       v"
          echo "INV-4: channel() cleanup present             v"
          echo "INV-5: evolution_* uses schema:'evo'         v"
