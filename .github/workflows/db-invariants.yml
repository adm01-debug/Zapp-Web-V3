name: DB Invariants

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "supabase/**"
  pull_request:
    branches: [main, develop]

concurrency:
  group: db-invariants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: DB Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: INV-1 No schema public in Realtime subscriptions
        run: |
          FOUND=$(grep -rn "schema: ['\"']public['\"']" src/ --include="*.ts" --include="*.tsx" -l 2>/dev/null | grep -v "useAudioMessagePlayer" || true)
          [ -n "$FOUND" ] && echo "::error::INV-1 VIOLATION" && exit 1
          echo "INV-1 passed."
      - name: INV-2 No partition-leaf table in subscriptions
        run: |
          LEAF="(evolution_messages|evolution_conversations)_(wpp2|artes|comercial_[0-9]+|default|archive)"
          FOUND=$(grep -rEn "table: ['\"']${LEAF}['\"']" src/ --include="*.ts" --include="*.tsx" 2>/dev/null || true)
          [ -n "$FOUND" ] && echo "::error::INV-2 VIOLATION" && echo "$FOUND" && exit 1
          echo "INV-2 passed."
      - name: INV-3 No hardcoded wpp2 in filters
        run: |
          FOUND=$(grep -rn "=eq\.wpp2\b" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "DEFAULT_WHATSAPP_INSTANCE" || true)
          [ -n "$FOUND" ] && echo "::error::INV-3 VIOLATION" && echo "$FOUND" && exit 1
          echo "INV-3 passed."
      - name: INV-4 channel calls must have unsubscribe
        run: |
          CHANNEL_FILES=$(grep -rl "supabase.channel(" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | xargs -r grep -l useEffect 2>/dev/null || true)
          VIOLATIONS=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            HAS_SUB=$(grep -c ".subscribe(" "$file" 2>/dev/null || echo 0)
            HAS_CLEAN=$(grep -cE ".unsubscribe\(\)|removeChannel" "$file" 2>/dev/null || echo 0)
            [ "$HAS_SUB" -gt 0 ] && [ "$HAS_CLEAN" -eq 0 ] && VIOLATIONS="${VIOLATIONS}\n  $file"
          done <<< "$CHANNEL_FILES"
          [ -n "$VIOLATIONS" ] && echo "::error::INV-4 VIOLATION" && echo -e "$VIOLATIONS" && exit 1
          echo "INV-4 passed."
      - name: INV-5 evolution subscriptions must use schema evo
        run: |
          FILES=$(grep -rl "table: ['\"']evolution_\(messages\|conversations\)['\"']" src/ --include="*.ts" --include="*.tsx" 2>/dev/null || true)
          VIOLATIONS=""
          for f in $FILES; do
            HAS=$(grep -c "schema: ['\"']evo['\"']" "$f" 2>/dev/null || echo 0)
            [ "$HAS" -eq 0 ] && VIOLATIONS="${VIOLATIONS}\n  $f"
          done
          [ -n "$VIOLATIONS" ] && echo "::error::INV-5 VIOLATION" && echo -e "$VIOLATIONS" && exit 1
          echo "INV-5 passed."
      - name: Summary
        if: success()
        run: echo "ALL 5 DB INVARIANTS PASSED"
