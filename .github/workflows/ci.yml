# =================================================
# ZAPP-WEB CI/CD Pipeline
# =================================================
# Triggered on: push to main, pull requests
# Uses Bun (the project ships a bun.lock, not package-lock.json).
# Existing repo debt is reported as warnings until dedicated cleanup PRs land.
# =================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: test-anon-key
  VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
  VITE_EXTERNAL_SUPABASE_URL: https://example.supabase.co
  VITE_EXTERNAL_SUPABASE_ANON_KEY: test-anon-key

jobs:
  lockfile:
    name: Verify Lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify bun.lock is in sync with package.json
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            BASE="origin/${{ github.base_ref }}"
            LOCK_DIFF=$(git diff "$BASE"...HEAD --name-only -- bun.lock)
            OLD_RAW=$(git show "$BASE:package.json" 2>/dev/null || echo '{}')
            if echo "$OLD_RAW" | jq '.' >/dev/null 2>&1; then
              OLD_PKG="$OLD_RAW"
            else
              OLD_PKG=$(echo "$OLD_RAW" | base64 -d 2>/dev/null || echo '{}')
            fi
            NEW_PKG=$(cat package.json)
          else
            LOCK_DIFF=$(git diff HEAD^ HEAD --name-only -- bun.lock 2>/dev/null || true)
            OLD_RAW=$(git show "HEAD^:package.json" 2>/dev/null || echo '{}')
            if echo "$OLD_RAW" | jq '.' >/dev/null 2>&1; then
              OLD_PKG="$OLD_RAW"
            else
              OLD_PKG=$(echo "$OLD_RAW" | base64 -d 2>/dev/null || echo '{}')
            fi
            NEW_PKG=$(cat package.json)
          fi
          if ! echo "$OLD_PKG" | jq empty 2>/dev/null; then
            echo "::warning::Base package.json could not be parsed as JSON - lockfile diff skipped."
            exit 0
          fi
          OLD_DEPS=$(echo "$OLD_PKG" | jq -Sc '{d: (.dependencies // {}), dd: (.devDependencies // {}), pd: (.peerDependencies // {}), od: (.optionalDependencies // {})}')
          NEW_DEPS=$(echo "$NEW_PKG" | jq -Sc '{d: (.dependencies // {}), dd: (.devDependencies // {}), pd: (.peerDependencies // {}), od: (.optionalDependencies // {})}')
          if [ "$OLD_DEPS" != "$NEW_DEPS" ] && [ -z "$LOCK_DIFF" ]; then
            echo "::error::Dependency fields in package.json changed without updating bun.lock."
            exit 1
          fi
          echo "Lockfile consistency check passed."

  quality:
    name: Quality diagnostics
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: ESLint diagnostics
        run: |
          set +e
          bunx eslint .
          exit 0

      - name: Design-system diagnostics
        run: |
          set +e
          bun run scripts/check-design-system.ts --ci
          exit 0

      - name: Supabase schema coverage gate (zapp + evo)
        id: schema_gate
        continue-on-error: true
        env:
          SCHEMA_REPORT_DIR: reports/schema-status
          META_URL: ${{ secrets.ZAPP_META_URL }}
          META_TOKEN: ${{ secrets.ZAPP_META_TOKEN }}
        run: node scripts/check-types-schemas.mjs

      - name: Auto-repair types (fallback quando o gate falha)
        id: schema_repair
        if: steps.schema_gate.outcome == 'failure' && env.META_URL != '' && env.META_TOKEN != ''
        continue-on-error: true
        env:
          SCHEMA_REPORT_DIR: reports/schema-status
          META_URL: ${{ secrets.ZAPP_META_URL }}
          META_TOKEN: ${{ secrets.ZAPP_META_TOKEN }}
        run: |
          mkdir -p reports/types-repair
          set +e
          node scripts/repair-types-schemas.mjs 2>&1 | tee reports/types-repair/repair.log
          exit 0

      - name: Publish schema status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-status-report
          path: reports/schema-status/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish types:repair log
        if: always() && steps.schema_repair.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: types-repair-log
          path: reports/types-repair/
          if-no-files-found: ignore
          retention-days: 14

      - name: Schema gate final (bloqueante)
        env:
          SCHEMA_REPORT_DIR: reports/schema-status
          META_URL: ${{ secrets.ZAPP_META_URL }}
          META_TOKEN: ${{ secrets.ZAPP_META_TOKEN }}
        run: node scripts/check-types-schemas.mjs

      - name: TypeScript check (ratchet, blocking)
        run: node scripts/check-tsc-ratchet.mjs

      - name: TypeScript check - chat components (blocking, strict)
        run: |
          set +e
          OUT=$(bunx tsgo --noEmit -p tsconfig.app.json 2>&1)
          echo "$OUT" | grep -E "src/(features/inbox/components/chat|lib/react-refs)" | grep -E "error TS" && {
            echo "::error title=Chat components typecheck::TypeScript errors detected in chat components.";
            exit 1;
          }
          exit 0

      - name: ts-nocheck drift gate (blocking)
        run: node scripts/check-ts-nocheck.mjs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lockfile, quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Unit tests (blocking)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run test -- --coverage --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Coverage threshold gate (ratchet)
        if: always()
        run: |
          SUMMARY="coverage/coverage-summary.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "::warning title=Coverage gate::coverage-summary.json not found."
            exit 0
          fi
          node - <<'JSEOF'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')).total;
          const floors = { lines: 25, functions: 18, branches: 15, statements: 24 };
          let fail = false;
          for (const [k, floor] of Object.entries(floors)) {
            const pct = s[k]?.pct ?? 0;
            const status = pct >= floor ? 'OK' : 'FAIL';
            console.log(`${status} ${k}: ${pct.toFixed(1)}% (floor ${floor}%)`);
            if (pct < floor) fail = true;
          }
          if (fail) { process.exit(1); }
          JSEOF

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lockfile, quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build for production
        run: bunx vite build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Report bundle size
        run: |
          echo "Bundle Size Report"
          du -sh dist/
          find dist -name "*.js" -exec du -h {} \;

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  a11y:
    name: Accessibility regression (axe)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run axe regression suite
        run: bun run test:a11y

      - name: Upload a11y Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-a11y
          path: playwright-report-a11y/
          retention-days: 7

  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Dependency audit (blocking on CRITICAL)
        run: |
          set +e
          audit_output=$(bun audit --audit-level=critical 2>&1)
          status=$?
          set -e
          echo "$audit_output"
          if [ "$status" -ne 0 ]; then
            if echo "$audit_output" | grep -q "audit request failed"; then
              echo "::warning title=Dependency audit::npm audit registry unreachable."
            else
              echo "::error title=Dependency audit::CRITICAL severity vulnerabilities found."
              exit "$status"
            fi
          fi

      - name: Check for obvious secrets in code
        run: |
          matches=$(grep -rn "SUPABASE_SERVICE_ROLE_KEY\|sk_live_\|sk_test_" --include="*.ts" --include="*.tsx" src/ || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::warning title=Potential secrets::Review before release."
          fi
