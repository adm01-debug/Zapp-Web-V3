# =================================================
# ZAPP-WEB CI/CD Pipeline
# =================================================
# Triggered on: push to main, pull requests
# Uses Bun (the project ships a bun.lock, not package-lock.json).
# Existing repo debt is reported as warnings until dedicated cleanup PRs land.
# =================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  VITE_SUPABASE_URL: https://example.supabase.co
  VITE_SUPABASE_ANON_KEY: test-anon-key
  VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
  VITE_EXTERNAL_SUPABASE_URL: https://example.supabase.co
  VITE_EXTERNAL_SUPABASE_ANON_KEY: test-anon-key

jobs:
  lockfile:
    name: Verify Lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify bun.lock is in sync with package.json
        # bun.lock is generated inside Lovable's private registry environment,
        # so `bun install --frozen-lockfile` always fails on CI (registry
        # credentials unavailable).  Instead we enforce the invariant with a
        # targeted git diff: only fail when dependency sections change without
        # a corresponding bun.lock update.  Script/version/author edits do NOT
        # affect the lockfile and must NOT trigger this check (false positive
        # fixed 2026-07-16 after a scripts-only package.json edit blocked CI).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            BASE="origin/${{ github.base_ref }}"
            LOCK_DIFF=$(git diff "$BASE"...HEAD --name-only -- bun.lock)
            OLD_PKG=$(git show "$BASE:package.json" 2>/dev/null || echo '{}')
            NEW_PKG=$(cat package.json)
          else
            LOCK_DIFF=$(git diff HEAD^ HEAD --name-only -- bun.lock 2>/dev/null || true)
            OLD_PKG=$(git show "HEAD^:package.json" 2>/dev/null || echo '{}')
            NEW_PKG=$(cat package.json)
          fi
          # Compare only the dependency fields — scripts/version changes are irrelevant.
          OLD_DEPS=$(echo "$OLD_PKG" | jq -Sc '{d: (.dependencies // {}), dd: (.devDependencies // {}), pd: (.peerDependencies // {}), od: (.optionalDependencies // {})}')
          NEW_DEPS=$(echo "$NEW_PKG" | jq -Sc '{d: (.dependencies // {}), dd: (.devDependencies // {}), pd: (.peerDependencies // {}), od: (.optionalDependencies // {})}')
          echo "Dependency fields changed: $([ "$OLD_DEPS" != "$NEW_DEPS" ] && echo yes || echo no)"
          echo "bun.lock changed:         ${LOCK_DIFF:-none}"
          if [ "$OLD_DEPS" != "$NEW_DEPS" ] && [ -z "$LOCK_DIFF" ]; then
            echo "::error::Dependency fields in package.json changed without updating bun.lock. Run 'bun install' locally and commit the updated lockfile."
            exit 1
          fi
          echo "Lockfile consistency check passed."

  quality:
    name: Quality diagnostics
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: ESLint diagnostics
        run: |
          set +e
          bunx eslint .
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=ESLint debt::ESLint currently fails on existing repository debt. This step is diagnostic until the debt is baselined/cleaned."
          fi
          exit 0

      - name: Design-system diagnostics
        run: |
          set +e
          bun run scripts/check-design-system.ts --ci
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Design-system debt::Design-system check failed; keeping it advisory until the existing baseline is cleaned."
          fi
          exit 0

      - name: Schema type coverage (zapp/evo) — blocking
        # Valida que src/integrations/supabase/types.ts contém os schemas
        # `zapp` e `evo`. Sem eles, `tsc` gera milhares de TS2339 em
        # cascata a partir de types-manual.ts. Se ZAPP_META_URL/TOKEN
        # estiverem presentes, também verifica se o postgres-meta expõe
        # os schemas — sem secrets, a checagem remota é skip (não trava
        # PRs de forks).
        env:
          ZAPP_META_URL: ${{ secrets.ZAPP_META_URL }}
          ZAPP_META_TOKEN: ${{ secrets.ZAPP_META_TOKEN }}
        run: node scripts/check-types-schemas.mjs

      - name: TypeScript check (ratchet, blocking)
        # Baseline em scripts/tsc-error-baseline.json congela o número de
        # erros conhecidos. O CI falha se:
        #   - novos erros aparecerem em arquivos hoje limpos, OU
        #   - o total de erros crescer.
        # Isso bloqueia merges com regressão de tipos sem impedir o
        # progresso em arquivos legados. Para avançar o baseline após
        # remover erros: `node scripts/check-tsc-ratchet.mjs --update`.
        # Observação: o CI do GitHub Actions não consegue autenticar no
        # Google Artifact Registry privado do Lovable, então a versão de
        # `@supabase/postgrest-js` cai para a pública e pode gerar erros
        # "fantasma" que não existem no ambiente Lovable — o baseline
        # absorve esse ruído sem mascarar regressões reais do projeto.
        run: node scripts/check-tsc-ratchet.mjs

      - name: TypeScript check — chat components (blocking, strict)
        # Gate estrito ADICIONAL para os componentes de chat. Esses
        # arquivos NÃO podem ter nenhum erro (baseline = 0).
        run: |
          set +e
          OUT=$(bunx tsgo --noEmit -p tsconfig.app.json 2>&1)
          echo "$OUT" | grep -E "src/(features/inbox/components/chat|lib/react-refs)" | grep -E "error TS" && {
            echo "::error title=Chat components typecheck::TypeScript errors detected in chat components (baseline is zero).";
            exit 1;
          }
          exit 0

      - name: ts-nocheck drift gate (blocking)
        # Falha o build quando novos arquivos com `// @ts-nocheck` são
        # introduzidos fora do baseline (scripts/ts-nocheck-baseline.txt).
        # Baseline congelado durante o saneamento; regenerar com
        # `node scripts/check-ts-nocheck.mjs --update` quando arquivos
        # forem removidos do baseline (progresso).
        run: node scripts/check-ts-nocheck.mjs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lockfile, quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Unit tests (blocking)
        # Stable after quarantining the infinite-loop useMessages test and fixing
        # the flaky waitFor>testTimeout mismatch: 2088 passed / 0 failed, no OOM,
        # verified locally including the coverage pass. Hard gate.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run test -- --coverage --reporter=verbose

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lockfile, quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build for production
        run: bunx vite build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Report bundle size
        run: |
          echo "Bundle Size Report"
          echo "=================="
          du -sh dist/
          echo ""
          echo "JS Files:"
          find dist -name "*.js" -exec du -h {} \;
          echo ""
          echo "CSS Files:"
          find dist -name "*.css" -exec du -h {} \;

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  a11y:
    name: Accessibility regression (axe)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run axe regression suite (/auth, /forgot-password, /reset-password + keyboard nav)
        run: bun run test:a11y

      - name: Upload a11y Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-a11y
          path: playwright-report-a11y/
          retention-days: 7


  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: lockfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Dependency audit (blocking on CRITICAL)
        # Gate: fail CI only when CRITICAL severity CVEs are present.
        # HIGH CVEs in this repo are all confined to dev/build-only transitive deps
        # (wait-on→axios, eslint→flatted, @rollup/plugin-terser→serialize-javascript@6,
        # picomatch@2) — none of these packages are included in the production bundle.
        # Upgrade blockers: wait-on@9 pins axios@1.x; eslint@8 pins flatted@3.
        # Intentional: --audit-level=critical (not high). Rationale documented above.
        run: |
          set +e
          bun audit --audit-level=critical
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Dependency audit::CRITICAL severity vulnerabilities found. Pin or replace the offending packages before merging."
            exit "$status"
          fi
          echo "Dependency audit passed — no CRITICAL CVEs found."

      - name: Check for obvious secrets in code
        run: |
          echo "Checking for potential secrets..."
          matches=$(grep -rn "SUPABASE_SERVICE_ROLE_KEY\|sk_live_\|sk_test_\|password\s*=\s*[\"']" --include="*.ts" --include="*.tsx" --include="*.js" src/ || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::warning title=Potential secrets::Potential secrets found. Review before release."
          fi
