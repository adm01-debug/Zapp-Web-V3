name: PR Size Gate

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  pr-size:
    name: PR Size Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size and comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number });
            const additions = pr.additions; const deletions = pr.deletions; const total = additions + deletions;
            const IDEAL = 300; const CEILING = 800;
            let label;
            if (total <= 50) label = 'size/XS';
            else if (total <= IDEAL) label = 'size/S';
            else if (total <= 500) label = 'size/M';
            else if (total <= CEILING) label = 'size/L';
            else label = 'size/XL';
            const sizeLabels = ['size/XS','size/S','size/M','size/L','size/XL'];
            for (const lbl of sizeLabels) {
              try { await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, name: lbl }); } catch {}
            }
            try { await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, labels: [label] }); } catch(e) { console.log('Label error:', e.message); }
            console.log(`PR size: ${total} lines (${label})`);
