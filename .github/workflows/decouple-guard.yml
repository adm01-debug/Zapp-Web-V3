# decouple-guard.yml — bloqueia recriação de infra Evolution no zapp-web-v3
# e verifica regressão no inventory de acoplamento (E22 do Plano 100 Etapas)
# v3 (2026-08-14): gate endurecido (TOTAL > 0 falha) + SQL egress gate via fixture
# commitado (ADR-010, sem secrets no CI) + verb-contract gate (12 verbos do gateway).
name: Decouple Guard

on:
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'infra/**'
      - 'scripts/**'
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
      - 'scripts/**'

jobs:
  infra-regression:
    name: Block infra/evolution recreation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no Evolution infra in zapp-web-v3
        run: |
          # E22: qualquer arquivo em infra/evolution* viola o split do evo-stack
          if ls infra/evolution* 2>/dev/null; then
            echo "::error::Arquivos infra/evolution* encontrados em zapp-web-v3."
            echo "::error::Infraestrutura Evolution deve ficar em adm01-debug/evolution-stack."
            exit 1
          fi
          echo "✅ Sem infra/evolution* em zapp-web-v3"

      - name: Verify no Evolution workflows in zapp-web-v3
        run: |
          # Workflows de build da Evolution API devem estar em evolution-stack
          FOUND=$(ls .github/workflows/publish-evolution*.yml 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Workflows publish-evolution* encontrados em zapp-web-v3: $FOUND"
            echo "::error::Mova para adm01-debug/evolution-stack."
            exit 1
          fi
          echo "✅ Sem workflows Evolution em zapp-web-v3"

  coupling-inventory:
    name: Check coupling inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run coupling inventory
        run: |
          node scripts/decouple/inventory.mjs | tee /tmp/inventory.txt
      - name: Fail if TOTAL > 0
        run: |
          TOTAL=$(grep "^TOTAL:" /tmp/inventory.txt | grep -oE '[0-9]+' | head -1)
          echo "TOTAL de bypasses: $TOTAL"
          if [ -z "$TOTAL" ]; then
            echo "::error::Não foi possível extrair TOTAL da saída do inventory."
            exit 1
          fi
          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::Regressão de acoplamento! TOTAL=$TOTAL > 0 (gate endurecido)."
            echo "::error::Arquivos violadores:"
            grep -vE "^(TOTAL:|Meta:|═|front |backend )" /tmp/inventory.txt
            echo "::error::Rode 'node scripts/decouple/inventory.mjs' localmente para detalhar e corrija."
            exit 1
          fi
          echo "✅ Inventory OK (TOTAL=$TOTAL = 0)"
      - name: SQL egress gate (fixture commitado — ADR-010)
        # Determinístico: valida o snapshot das fns de egresso contra o whitelist
        # {ops.fn_evo_url, ops.fn_evo_key, zapp.fn_check_license_heartbeat, evo.fn_detect_instance_recreate}.
        # Refrescar o snapshot só quando o egresso SQL mudar (ver ADR-010).
        run: node scripts/decouple/sql-gate.mjs scripts/decouple/fixtures/sql_report_snapshot.json
      - name: Verb contract gate (12 verbos do gateway)
        run: node scripts/decouple/verb-contract-gate.mjs
      - name: Diagnostic - grep de padrões de bypass
        if: failure()
        run: |
          echo "::group::Padrões de acoplamento encontrados (diagns�stico)"
          echo "--- invoke('evolution-api', ...) fora do adapter ---"
          grep -rniE "invoke\(\s*['\"]evolution-api['\"]" src/ | grep -vE "whatsappAdapter\.ts|sendFunctionRouter\.ts" || true
          echo "--- EVOLUTION_API_URL lido direto em edge functions ---"
          grep -rniE "Deno\.env\.get\(\s*['\"]EVOLUTION_API_URL['\"]" supabase/functions/ || true
          echo "--- writes diretos em tabelas evolution_* ---"
          grep -rniE "\.from\(\s*['\"]evolution_[^'\"]+['\"]\s*\)" src/ | grep -E "\.(insert|update|delete|upsert)" || true
          echo "--- import dinâmico de supabase/functions em src ---"
          grep -rniE "import\(\s*['\"].*supabase/functions" src/ || true
          echo "::endgroup::"
      - name: Upload inventory report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupling-inventory
          path: /tmp/inventory.txt
          retention-days: 7
