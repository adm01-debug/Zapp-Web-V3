name: Edge Env Completeness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Edge Env Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verifica variaveis de ambiente usadas vs declaradas
        shell: bash
        run: |
          set -euo pipefail

          ENV_REQUIRED="supabase/functions/.env.required"
          if [ ! -f "$ENV_REQUIRED" ]; then
            echo "::error::Arquivo $ENV_REQUIRED nao encontrado — adicionar supabase/functions/.env.required ao repositorio"
            exit 1
          fi

          grep -rhoE "Deno\.env\.get\(['\"][A-Z0-9_]+['\"\]\)" supabase/functions/ \
            | grep -oE '[A-Z0-9_]{3,}' \
            | sort -u > /tmp/used_deno.txt || true

          grep -rhoE "requireEnv\(['\"][A-Z0-9_]+['\"\]\)" supabase/functions/ \
            | grep -oE '[A-Z0-9_]{3,}' \
            | sort -u > /tmp/used_req.txt || true

          cat /tmp/used_deno.txt /tmp/used_req.txt | sort -u > /tmp/used.txt

          grep -vE '^\s*(#|$)' "$ENV_REQUIRED" \
            | sed 's/=.*//' \
            | sort -u > /tmp/declared.txt || true

          echo "Variaveis usadas: $(wc -l < /tmp/used.txt)"
          echo "Variaveis declaradas: $(wc -l < /tmp/declared.txt)"

          MISSING="$(comm -23 /tmp/used.txt /tmp/declared.txt)"
          if [ -n "$MISSING" ]; then
            echo "::error::Variaveis usadas mas NAO declaradas em .env.required:"
            while IFS= read -r var; do
              echo "::error::  - $var"
            done <<< "$MISSING"
            exit 1
          fi

          echo "OK: todas as variaveis usadas estao declaradas em .env.required"
