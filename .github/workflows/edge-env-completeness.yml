name: Edge Env Completeness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Edge Env Completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica variaveis de ambiente usadas vs declaradas
        shell: bash
        run: |
          set -euo pipefail
          ENV_REQUIRED="supabase/functions/.env.required"
          if [ ! -f "$ENV_REQUIRED" ]; then echo "::warning::$ENV_REQUIRED nao encontrado"; exit 0; fi
          grep -rhoE "Deno\.env\.get\(['\"][A-Z0-9_]+['\"\]\)" supabase/functions/ | grep -oE '[A-Z0-9_]{3,}' | sort -u > /tmp/used.txt || true
          grep -vE '^\s*(#|$)' "$ENV_REQUIRED" | sed 's/=.*//' | sort -u > /tmp/declared.txt || true
          MISSING="$(comm -23 /tmp/used.txt /tmp/declared.txt)"
          if [ -n "$MISSING" ]; then
            echo "::error::Variaveis usadas nao declaradas em .env.required:"
            while IFS= read -r var; do echo "::error::  - $var"; done <<< "$MISSING"
            exit 1
          fi
          echo "OK: todas as variaveis declaradas em .env.required"
