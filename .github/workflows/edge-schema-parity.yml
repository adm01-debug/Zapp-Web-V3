name: Edge Schema Parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  parity:
    name: Edge Schema Parity
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Verifica baseline do schema (informativo)
        shell: bash
        run: |
          set -uo pipefail
          MIGRATIONS_DIR="supabase/migrations"
          if [ ! -d "$MIGRATIONS_DIR" ]; then echo "::warning::Diretorio migrations nao encontrado"; exit 0; fi
          TOTAL=$(find "$MIGRATIONS_DIR" -maxdepth 1 -name '*.sql' -type f | wc -l | tr -d ' ')
          echo "Arquivos .sql: $TOTAL"
          CREATE_TABLE=$(grep -rhoiE '^\s*create\s+table' "$MIGRATIONS_DIR" --include='*.sql' | wc -l | tr -d ' ')
          FUNCTIONS=$(grep -rhoiE 'create\s+(or\s+replace\s+)?function' "$MIGRATIONS_DIR" --include='*.sql' | wc -l | tr -d ' ')
          echo "CREATE TABLE: $CREATE_TABLE | FUNCTIONS: $FUNCTIONS"
          echo "Paridade de schema: verificacao concluida (informativa)"
