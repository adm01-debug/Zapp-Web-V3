name: Security & Compliance

# Secret scanning via gitleaks. Runs on schedule (weekly) AND on every PR.
# Advisory (continue-on-error: true) so it never gates merge,
# but results are surfaced as GitHub Check annotations.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: 🔍 Secret Scan (gitleaks)
    runs-on: [Linux, X64, vps-zapp]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🔒 Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        # SEM continue-on-error: secret scan deve BLOQUEAR merge se vazar credencial.
        # Resultados continuam como annotations no Check.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "false"
          # v3 tenta fazer upload de SARIF como artifact; em runner self-hosted o
          # rootDirectory aponta para /root (HOME) e não o workspace -> crash
          # "rootDirectory /root is not a parent of results.sarif". Desabilita o
          # upload (o scan ainda roda e bloqueia merge se achar leak).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
