name: Migration Uniqueness Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migration-uniqueness-check:
    name: Migration Uniqueness Gate
    runs-on: [Linux, X64, vps-zapp]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate migration name uniqueness
        run: |
          #!/bin/bash
          set -eo pipefail

          MIGRATIONS_DIR="supabase/migrations"
          ERRORS=0

          echo "=== Checking migration file name uniqueness ==="
          echo ""

          if [ ! -d "$MIGRATIONS_DIR" ]; then
            echo "No migrations directory found. Skipping."
            exit 0
          fi

          DUPLICATES=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | sed 's|.*/||' | sort | uniq -d)

          if [ -n "$DUPLICATES" ]; then
            echo "### ERROR: Duplicate migration filenames detected!"
            echo "$DUPLICATES"
            ERRORS=$((ERRORS+1))
          fi

          DUP_NAMES=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | sed 's|.*/||' | sed 's/\.sql$//' | sort | uniq -d)

          if [ -n "$DUP_NAMES" ]; then
            echo ""
            echo "### ERROR: Duplicate migration names detected!"
            echo "Collisions:"
            echo "$DUP_NAMES"
            echo ""
            echo "Fix: Rename one of the colliding files with a different suffix."
            ERRORS=$((ERRORS+1))
          fi

          # CRITICAL: check for duplicate timestamp prefixes (14 chars = YYYYMMDDHHmmss).
          # supabase_migrations.schema_migrations uses version (= timestamp prefix) as
          # PRIMARY KEY — two files sharing a timestamp cause silent migration skipping.
          # Only the first file alphabetically is tracked; subsequent files are never applied.
          DUP_PREFIXES=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f \
            | sed 's|.*/||' | cut -c1-14 | sort | uniq -d)

          if [ -n "$DUP_PREFIXES" ]; then
            echo ""
            echo "### ERROR: Duplicate timestamp prefixes detected!"
            echo "Affected prefixes (YYYYMMDDHHmmss):"
            echo "$DUP_PREFIXES"
            echo ""
            echo "Files with colliding timestamps:"
            while IFS= read -r PREFIX; do
              find "$MIGRATIONS_DIR" -name "${PREFIX}*.sql" -type f | sort | sed 's|^|  |'
            done <<< "$DUP_PREFIXES"
            echo ""
            echo "CRITICAL: supabase_migrations.schema_migrations uses 'version' (timestamp"
            echo "prefix) as PRIMARY KEY. Multiple files with the same timestamp cause silent"
            echo "skipping — only the first file alphabetically is tracked and applied."
            echo "Fix: assign a unique timestamp to each migration file."
            ERRORS=$((ERRORS+1))
          fi

          echo ""
          TOTAL_MIGRATIONS=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | wc -l | tr -d ' ')
          echo "Total migration files: $TOTAL_MIGRATIONS"
          echo "Uniqueness check complete."

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "### FAILED: $ERRORS uniqueness violation(s) detected."
            echo "Each migration file MUST have a unique name and timestamp."
            exit 1
          else
            echo "### PASS: All migration names and timestamps are unique."
          fi
