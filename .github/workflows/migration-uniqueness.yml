name: Migration Uniqueness Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migration-uniqueness-check:
    name: Migration Uniqueness Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate migration name uniqueness
        run: |
          set -eo pipefail
          MIGRATIONS_DIR="supabase/migrations"
          ERRORS=0
          if [ ! -d "$MIGRATIONS_DIR" ]; then echo "No migrations directory. Skipping."; exit 0; fi
          DUPLICATES=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | sed 's|.*/||' | sort | uniq -d)
          if [ -n "$DUPLICATES" ]; then echo "ERROR: Duplicate migration filenames!"; echo "$DUPLICATES"; ERRORS=$((ERRORS+1)); fi
          DUP_NAMES=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | sed 's|.*/||' | sed 's/\.sql$//' | sort | uniq -d)
          if [ -n "$DUP_NAMES" ]; then echo "ERROR: Duplicate migration names!"; echo "$DUP_NAMES"; ERRORS=$((ERRORS+1)); fi
          TOTAL=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | wc -l | tr -d ' ')
          echo "Total migration files: $TOTAL"
          if [ $ERRORS -gt 0 ]; then echo "FAILED: $ERRORS violation(s)."; exit 1; else echo "PASS: All migration names unique."; fi
