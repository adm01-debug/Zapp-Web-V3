name: Migration Uniqueness Gate

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migration-uniqueness-check:
    name: Check Migration Uniqueness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration name uniqueness
        run: |
          #!/bin/bash
          set -eo pipefail

          MIGRATIONS_DIR="supabase/migrations"
          ERRORS=0

          echo "=== Checking migration file name uniqueness ==="
          echo ""

          # Get all migration filenames
          if [ ! -d "$MIGRATIONS_DIR" ]; then
            echo "No migrations directory found. Skipping."
            exit 0
          fi

          # Check 1: Duplicate exact filenames (though OS should prevent this)
          DUPLICATES=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | sort | sed 's|.*/||' | sort | uniq -d)

          if [ -n "$DUPLICATES" ]; then
            echo "### ERROR: Duplicate migration filenames detected!"
            echo "$DUPLICATES"
            ERRORS=$((ERRORS+1))
          fi

          # Check 2: Duplicate names (full name without extension)
          DUP_NAMES=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | sed 's|.*/||' | sed 's/\.sql$//' | sort | uniq -d)

          if [ -n "$DUP_NAMES" ]; then
            echo ""
            echo "### ERROR: Duplicate migration names detected!"
            echo "Collisions:"
            echo "$DUP_NAMES"
            echo ""
            echo "Fix: Rename one of the colliding files with a different suffix."
            ERRORS=$((ERRORS+1))
          fi

          # Check 3: Duplicate 14-digit timestamp prefixes (same timestamp, different names)
          # Supabase CLI applies migrations alphabetically — two files with the same timestamp
          # prefix have undefined relative ordering, which is a semantic hazard.
          DUP_TIMESTAMPS=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | sed 's|.*/||' | \
            grep -oP '^\d{14}' | sort | uniq -d)

          if [ -n "$DUP_TIMESTAMPS" ]; then
            echo ""
            echo "### ERROR: Duplicate migration timestamp prefixes detected!"
            echo "Conflicting timestamps (Supabase ordering is undefined for same-prefix files):"
            for TS in $DUP_TIMESTAMPS; do
              echo "  Timestamp: $TS"
              find "$MIGRATIONS_DIR" -name "${TS}*.sql" -type f | sed 's|.*/||' | sed 's/^/    - /'
            done
            echo ""
            echo "Fix: Rename one of the colliding files to use a free adjacent timestamp."
            ERRORS=$((ERRORS+1))
          fi

          echo ""
          TOTAL_MIGRATIONS=$(find "$MIGRATIONS_DIR" -name "*.sql" -type f | wc -l | tr -d ' ')
          echo "Total migration files: $TOTAL_MIGRATIONS"
          echo "Uniqueness check complete."

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "### FAILED: $ERRORS uniqueness violation(s) detected."
            echo "Each migration file MUST have a unique timestamp prefix."
            exit 1
          else
            echo "### PASS: All migration names and timestamps are unique."
          fi
