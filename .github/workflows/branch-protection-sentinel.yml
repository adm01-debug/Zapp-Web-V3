name: Branch Protection Sentinel

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

# GITHUB_TOKEN does not have administration:read, so the branch protection
# API call below uses gh api (via GITHUB_TOKEN) and warns on 403/error.
# If you need authenticated read of branch protection rules, set up
# ACTIONS_PAT secret with repo/administration:read scope.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for console.log in new code
        run: |
          git diff --name-only origin/${{ github.base_ref }}..HEAD | grep -E '\.(ts|tsx)$' | while read f; do
            if git diff origin/${{ github.base_ref }}..HEAD -- "$f" | grep -E '^\+.*console\.log' | grep -v '//.*console\.log' | grep -v validationLogger; then
              echo "ERROR: console.log found in $f"
              exit 1
            fi
          done
      - name: Check for explicit any in new code
        run: |
          git diff --name-only origin/${{ github.base_ref }}..HEAD | grep -E '\.(ts|tsx)$' | while read f; do
            if git diff origin/${{ github.base_ref }}..HEAD -- "$f" | grep -E '^\+.*as any' | grep -v '/\*.*as any.*\*/' | grep -v '//.*as any'; then
              echo "ERROR: new 'as any' found in $f"
              exit 1
            fi
          done

  verify-branch-protection:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch protection rules
        run: |
          RESP=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/branches/main/protection")

          HTTP_CODE=$(echo "$RESP" | tail -1)
          PROT=$(echo "$RESP" | sed '$d')

          if [ "$HTTP_CODE" = "403" ]; then
            echo "::warning::GITHUB_TOKEN lacks administration:read — cannot verify branch protection rules"
            echo "::warning::To enable this check, create ACTIONS_PAT secret with repo/administration:read scope"
            echo "Branch protection check skipped (permission denied)."
            exit 0
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Branch protection API returned HTTP $HTTP_CODE — cannot verify rules"
            echo "Response: $PROT"
            exit 0
          fi

          echo "Branch protection response:"
          echo "$PROT" | jq .

          FORCE=$(echo "$PROT" | jq -r '.allow_force_pushes.enabled // false')
          DISMISS=$(echo "$PROT" | jq -r '.required_pull_request_reviews.dismiss_stale_reviews // false')
          ENFORCE=$(echo "$PROT" | jq -r '.enforce_admins.enabled // false')
          CHECKS=$(echo "$PROT" | jq -r '.required_status_checks.contexts // [] | length')

          if [ "$FORCE" = "true" ]; then
            echo "::warning::Force pushes are ALLOWED on main — should be disabled"
          fi
          if [ "$DISMISS" != "true" ]; then
            echo "::warning::Stale reviews are NOT auto-dismissed — should be enabled"
          fi
          if [ "$ENFORCE" != "true" ]; then
            echo "::warning::Admin enforcement is OFF — branch protection does not apply to admins"
          fi
          if [ "$CHECKS" -eq 0 ]; then
            echo "::warning::No required status checks configured on main"
          fi

          echo "---"
          echo "Protection rules checked."
          exit 0  # advisory — never fails, only warns
