name: Branch Protection Sentinel

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'supabase/functions/**'
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

# Verificação usa GITHUB_TOKEN (GET de branch protection é read-only — sem
# necessidade de PAT; o antigo secret ACTIONS_PAT nunca existiu no repo e
# derrubava o schedule diário — fix 2026-08-06).
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check for console.log in new code
        run: |
          git diff --name-only origin/${{ github.base_ref }}..HEAD | grep -E '\.(ts|tsx)$' | while read f; do
            if git diff origin/${{ github.base_ref }}..HEAD -- "$f" | grep -E '^\+.*console\.log' | grep -v '//.*console\.log' | grep -v validationLogger; then
              echo "ERROR: console.log found in $f"
              exit 1
            fi
          done
      - name: Check for explicit any in new code
        run: |
          git diff --name-only origin/${{ github.base_ref }}..HEAD | grep -E '\.(ts|tsx)$' | while read f; do
            if git diff origin/${{ github.base_ref }}..HEAD -- "$f" | grep -E '^\+.*as any' | grep -v '/\*.*as any.*\*/' | grep -v '//.*as any'; then
              echo "ERROR: new 'as any' found in $f"
              exit 1
            fi
          done

  verify-branch-protection:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch protection rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RESP=$(curl -sS --connect-timeout 10 --max-time 30 \
            -w "\n%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/branches/main/protection")

          HTTP_CODE=$(echo "$RESP" | tail -1)
          PROT=$(echo "$RESP" | sed '$d')

          if [ "$HTTP_CODE" = "403" ]; then
            echo "::error::Branch protection API denied (HTTP 403) — ACTIONS_PAT may lack administration:read scope"
            exit 1
          fi

          if [ "$HTTP_CODE" = "404" ]; then
            echo "::error::Branch protection NOT configured on main — this is a security gap"
            echo "::error::Configure branch protection in: Settings > Branches > Branch protection rules"
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Branch protection API returned HTTP $HTTP_CODE"
            echo "Response: $PROT"
            exit 1
          fi

          echo "Branch protection response:"
          echo "$PROT" | jq .

          FAILED=0

          FORCE=$(echo "$PROT" | jq -r '.allow_force_pushes.enabled // false')
          DISMISS=$(echo "$PROT" | jq -r '.required_pull_request_reviews.dismiss_stale_reviews // false')
          ENFORCE=$(echo "$PROT" | jq -r '.enforce_admins.enabled // false')
          REQUIRE_PR=$(echo "$PROT" | jq -r '.required_pull_request_reviews // null')
          CHECKS=$(echo "$PROT" | jq -r '.required_status_checks.contexts // [] | length')

          if [ "$FORCE" = "true" ]; then
            echo "::error::Force pushes are ALLOWED on main — must be disabled"
            FAILED=1
          else
            echo "OK: force pushes disabled"
          fi

          if [ "$REQUIRE_PR" = "null" ]; then
            echo "::error::Pull request reviews NOT required on main — PRs can be merged without review"
            FAILED=1
          else
            echo "OK: pull request reviews required"
            APPROVALS=$(echo "$PROT" | jq -r '.required_pull_request_reviews.required_approving_review_count // 0')
            if [ "${APPROVALS:-0}" -lt 1 ]; then
              echo "::error::required_approving_review_count is ${APPROVALS:-0} — minimum 1 approval required before merge"
              FAILED=1
            else
              echo "OK: $APPROVALS required approval(s) configured"
            fi
          fi

          if [ "$DISMISS" != "true" ]; then
            echo "::warning::Stale reviews are NOT auto-dismissed — recommend enabling"
          else
            echo "OK: stale reviews auto-dismissed"
          fi

          if [ "$ENFORCE" != "true" ]; then
            echo "::warning::Admin enforcement is OFF — branch protection does not apply to admins"
          else
            echo "OK: admin enforcement ON"
          fi

          if [ "$CHECKS" -eq 0 ]; then
            echo "::error::No required status checks configured on main — recommend adding ci/build"
            FAILED=1
          else
            echo "OK: $CHECKS required status check(s) configured"
          fi

          # Verificação exata dos contexts (fix 2026-08-06): a contagem sozinha
          # deixava passar remoção de check crítico (ex.: CodeQL) com 1 check
          # qualquer. Lista = gates de banco/edge/qualidade + segurança.
          EXPECTED_CONTEXTS="edge-auth-smoke edge-drift-check Edge guard checks DB Invariants Migration Uniqueness Gate schema-drift-guard PR Size Gate Analyze (javascript-typescript) 🔍 Secret Scan (gitleaks) Verify security_invoker on all views"
          ACTUAL_CONTEXTS=$(echo "$PROT" | jq -r '.required_status_checks.contexts[]')
          MISSING=""
          for ctx in $EXPECTED_CONTEXTS; do
            if ! echo "$ACTUAL_CONTEXTS" | grep -Fxq "$ctx"; then
              MISSING="$MISSING $ctx"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Required status checks ausentes na proteção de main:${MISSING}"
            FAILED=1
          else
            echo "OK: todos os ${CHECKS} required status checks esperados estão configurados"
          fi

          echo "---"
          if [ "$FAILED" = "1" ]; then
            echo "::error::Branch protection sentinel FAILED — critical rules missing on main"
            exit 1
          fi
          echo "Branch protection rules OK."
