name: Seed E2E contacts (VPS)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      VPS_SSH_HOST:    { required: true }
      VPS_SSH_USER:    { required: true }
      VPS_SSH_KEY:     { required: true }
      SUPABASE_DB_URL: { required: true }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed-contacts:
    name: Semear contatos E2E em zapp.contacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          set -euxo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_SSH_HOST" >> ~/.ssh/known_hosts 2>&1 || {
            echo "::error::ssh-keyscan falhou para $VPS_SSH_HOST — DNS/porta 22/firewall (E2E-05). Confira o secret VPS_SSH_HOST."
            exit 1
          }

      - name: Copiar seed para VPS
        run: |
          scp -i ~/.ssh/id_ed25519 \
            scripts/seed-e2e-contacts.sql scripts/seed-e2e-contacts.sh \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/tmp/"

      - name: Aplicar seed
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "chmod +x /tmp/seed-e2e-contacts.sh && \
             SEED_REPORT_JSON=/tmp/seed-e2e-contacts-summary.json \
             SEED_REPORT_LOG=/tmp/seed-e2e-contacts.log \
             SUPABASE_DB_URL='$SUPABASE_DB_URL' \
             /tmp/seed-e2e-contacts.sh"

      - name: Trazer log/summary da VPS
        if: always()
        run: |
          mkdir -p reports
          scp -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/tmp/seed-e2e-contacts-summary.json" \
            reports/seed-e2e-contacts-summary.json || echo "{}" > reports/seed-e2e-contacts-summary.json
          scp -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/tmp/seed-e2e-contacts.log" \
            reports/seed-e2e-contacts.log || true

      - name: Renderizar HTML + Step Summary
        if: always()
        run: |
          node scripts/render-seed-report.mjs \
            reports/seed-e2e-contacts-report.html \
            reports/seed-e2e-contacts-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefato (HTML + log + json)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seed-e2e-contacts-report
          path: reports/
          retention-days: 14

