name: Seed E2E contacts (REST)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: { required: true }

jobs:
  seed-contacts:
    name: Semear contatos E2E em zapp.contacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # E2E-05 (2026-08-07): porta 22 da VPS fechada p/ internet — SSH morto.
      # Seed via zapp.rpc_e2e_seed_contacts() (SECURITY DEFINER, idempotente,
      # mesma convenção do antigo scripts/seed-e2e-contacts.sql) + REST com
      # service_role — sem SSH, sem psql remoto.
      - name: Semear contatos via RPC
        env:
          # URL pública estável (mesmo padrão do edge-auth-smoke); evita secret extra no contrato
          SUPABASE_URL: https://supabase.atomicabr.com.br
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY não configurado nos secrets."
            exit 1
          fi
          HTTP=$(curl -s -o /tmp/seed.json -w "%{http_code}" --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/rpc_e2e_seed_contacts" \
            -H "apikey: $SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' || true)
          echo "HTTP: $HTTP"
          cat /tmp/seed.json
          if [ "$HTTP" != "200" ]; then
            echo "::error::E2E_SEED_FAIL — RPC retornou HTTP $HTTP ($(cat /tmp/seed.json))"
            exit 1
          fi
          TOTAL=$(jq -r '.total // 0' /tmp/seed.json 2>/dev/null || echo 0)
          if [ "$TOTAL" -lt 5 ]; then
            echo "::error::E2E_SEED_FAIL — esperado >=5 contatos, resposta: $(cat /tmp/seed.json)"
            exit 1
          fi
          echo "✅ Seed OK — $TOTAL contatos (inserted=$(jq -r .inserted /tmp/seed.json), updated=$(jq -r .updated /tmp/seed.json))"
