name: 📦 Publish evolution-rabbit-consumer (GHCR)

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/evolution-consumer/**'
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/evolution-rabbit-consumer

jobs:
  build-and-push:
    name: Build & push consumer image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4
        with:
          # 2026-08-06: pin do buildkit — tag movel buildx-stable-1 = v0.31.2 quebra
          # neste kernel (runc: can't mask dir /proc/acpi: invalid argument);
          # v0.20.2 validado OK em build minimo e no contexto real.
          driver-opts: image=moby/buildkit:v0.20.2

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          TAG="${GITHUB_SHA::12}"
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: infra/evolution-consumer
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v2
          cache-from: type=gha
          cache-to: type=gha,mode=max
