name: TypeScript @ts-nocheck Ratchet

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'

env:
  # Baseline documentado em 26/07/2026
  # Atualizar quando numero diminuir (celebrar!)
  TS_NOCHECK_BASELINE: 9

jobs:
  ts-nocheck-ratchet:
    name: Check @ts-nocheck Ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count @ts-nocheck usages
        id: count
        run: |
          COUNT=$(grep -r '@ts-nocheck' src/ --include='*.ts' --include='*.tsx' -l 2>/dev/null | wc -l)
          echo "current_count=$COUNT" >> $GITHUB_OUTPUT
          echo "@ts-nocheck count: $COUNT (baseline: ${{ env.TS_NOCHECK_BASELINE }})"

      - name: Enforce ratchet
        run: |
          COUNT=${{ steps.count.outputs.current_count }}
          BASELINE=${{ env.TS_NOCHECK_BASELINE }}

          echo "@ts-nocheck count: $COUNT"
          echo "Baseline: $BASELINE"
          echo ""

          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "### ERROR: @ts-nocheck increased from $BASELINE to $COUNT"
            echo "Affected files:"
            grep -r '@ts-nocheck' src/ --include='*.ts' --include='*.tsx' -l
            exit 1
          else
            echo "### PASS: @ts-nocheck count is $COUNT"
            if [ "$COUNT" -lt "$BASELINE" ]; then
              echo " Celebrar: Count diminuiu! Atualize TS_NOCHECK_BASELINE para $COUNT no workflow."
            fi
          fi
