name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: [Linux, X64, vps-zapp]
    timeout-minutes: 30
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # TRAP cache desabilitado: a chave inclui hash do source, que muda a
          # cada commit → o cache nunca acerta e cada run grava ~13MB de lixo
          # (203 caches / 2.7GB acumulados em 1 semana, 08/2026). O repo é
          # grande e mutável; o custo do upload supera o benefício do hit.
          trap-caching: false

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
