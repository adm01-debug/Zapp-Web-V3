name: 🗂️ Generate Supabase Types (zapp)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gen-types:
    name: Generate & PR types.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Generate types
        run: |
          supabase gen types typescript \
            --db-url "${{ secrets.SUPABASE_DB_URL }}" \
            --schema zapp,evo,public > src/integrations/supabase/types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(types): regenera types.ts via supabase gen'
          title: '🗂️ chore(types): regenera types.ts'
          branch: 'chore/regen-types'
          delete-branch: true
          labels: 'types,automated'
