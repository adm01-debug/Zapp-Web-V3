name: Regenerate Supabase types (zapp + evo)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch base (types são gerados do schema self-hosted)'
        required: false
        default: 'main'
      schemas:
        description: 'Schemas (default: public,zapp,evo)'
        required: false
        default: 'public,zapp,evo'

jobs:
  regen-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate types.ts
        env:
          META_URL: ${{ secrets.SUPABASE_META_URL }}
          META_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCHEMAS: ${{ github.event.inputs.schemas || 'public,zapp,evo' }}
        run: node scripts/gen-types-zapp.mjs

      - name: Check diff
        id: diff
        run: |
          if git diff --quiet src/integrations/supabase/types.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "types.ts sem mudancas — schema em sync"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat src/integrations/supabase/types.ts
          fi

      - name: Create branch and commit
        if: steps.diff.outputs.changed == 'true'
        id: commit
        run: |
          BRANCH="chore/regen-types-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/integrations/supabase/types.ts
          git commit -m "chore(types): regenerate zapp/evo types [gen-types-zapp workflow]

Schemas: ${{ github.event.inputs.schemas || 'public,zapp,evo' }}
Triggered by: ${{ github.actor }}
Workflow run: ${{ github.run_id }}"
          git push origin "$BRANCH"

      - name: Create PR and auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.commit.outputs.branch }}"
          PR_URL=$(gh pr create \
            --base "${{ github.event.inputs.branch || 'main' }}" \
            --head "$BRANCH" \
            --title "chore(types): regenerate zapp/evo types [$(date +%Y-%m-%d)]" \
            --body "Geração automática de \`types.ts\` via workflow \`gen-types-zapp\`.

**Schemas:** \`${{ github.event.inputs.schemas || 'public,zapp,evo' }}\`
**Triggered by:** \`${{ github.actor }}\`
**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

> Auto-merge via squash será executado imediatamente.")
          echo "PR created: $PR_URL"
          # Auto-merge squash (requer branch protection configurado para aceitar)
          gh pr merge "$BRANCH" --squash --auto --delete-branch
          echo "Auto-merge requested (squash)"

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "types.ts ja esta atualizado — nada a commitar"
