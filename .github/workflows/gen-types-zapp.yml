name: Regenerate Supabase types (zapp + evo)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch alvo'
        required: false
        default: 'main'
      schemas:
        description: 'Schemas (default: public,zapp,evo)'
        required: false
        default: 'public,zapp,evo'

jobs:
  regen-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate types.ts
        env:
          META_URL: ${{ secrets.SUPABASE_META_URL }}
          META_TOKEN: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCHEMAS: ${{ github.event.inputs.schemas || 'public,zapp,evo' }}
        run: node scripts/gen-types-zapp.mjs

      - name: Check diff
        id: diff
        run: |
          if git diff --quiet src/integrations/supabase/types.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "types.ts sem mudancas — schema em sync"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat src/integrations/supabase/types.ts
          fi

      - name: Commit types.ts
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git commit -m "chore(types): regenerate zapp/evo types [gen-types-zapp workflow]

          Schemas: ${{ github.event.inputs.schemas || 'public,zapp,evo' }}
          Triggered by: ${{ github.actor }}
          Workflow: ${{ github.run_id }}"
          git push origin ${{ github.event.inputs.branch || 'main' }}

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        run: echo "types.ts ja esta atualizado — nada a commitar"
