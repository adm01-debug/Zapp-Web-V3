# apply-types-patch.yml
# Workflow disparado manualmente para aplicar o patch de types.ts
# sem precisar de PAT local no VPS.
# Adiciona as 10 colunas ausentes de whatsapp_connections no types gerado.

name: Apply types.ts patch (whatsapp_connections columns)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm applying the patch'
        required: true
        default: 'NO'

jobs:
  apply-patch:
    name: Apply whatsapp_connections types patch
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'YES'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run patch script
        run: bash scripts/apply-types-patch.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/integrations/supabase/types.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/integrations/supabase/types.ts
          git commit -m 'fix(types): add 10 missing whatsapp_connections columns via apply-types-patch.sh'
          git push

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo '## ✅ types.ts patch applied successfully' >> $GITHUB_STEP_SUMMARY
          else
            echo '## ℹ️ types.ts already up to date — no changes needed' >> $GITHUB_STEP_SUMMARY
          fi
