# apply-types-patch.yml
# Disparo manual para aplicar o patch de types.ts (10 colunas whatsapp_connections).
# Não requer PAT local — o Actions usa GITHUB_TOKEN automaticamente.

name: Apply types.ts patch (whatsapp_connections)

on:
  workflow_dispatch:

jobs:
  apply-patch:
    name: Apply whatsapp_connections types patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run patch script
        run: bash scripts/apply-types-patch.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/integrations/supabase/types.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes needed"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git diff --stat src/integrations/supabase/types.ts
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/integrations/supabase/types.ts
          git commit -m 'fix(types): add missing whatsapp_connections columns via apply-types-patch.sh'
          git push

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo '## ✅ types.ts patch applied successfully' >> $GITHUB_STEP_SUMMARY
            echo 'Columns added: api_type, api_url, connected_at, disconnected_at, evo_instance_id,' >> $GITHUB_STEP_SUMMARY
            echo 'is_active, last_connected_at, routing_mode, settings, webhook_url' >> $GITHUB_STEP_SUMMARY
          else
            echo '## ℹ️ Already up to date — no changes needed' >> $GITHUB_STEP_SUMMARY
          fi
