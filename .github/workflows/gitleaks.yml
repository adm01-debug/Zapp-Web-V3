name: Secret Scan (gitleaks)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION="8.21.2"
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan pushed commits (push to main)
        # Escaneia apenas os commits novos empurrados, nao o historico completo.
        # Historico completo ja foi escaneado em commits anteriores.
        # Fallback para HEAD..HEAD (diff vazio) quando before=0000... (force push / primeiro push).
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          EMPTY="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$EMPTY" ]; then
            echo "First push or force push — scanning HEAD only"
            LOG_OPTS="HEAD^1..HEAD 2>/dev/null || HEAD"
            gitleaks detect \
              --config=.gitleaks.toml \
              --source=. \
              --log-opts="HEAD" \
              --redact \
              --exit-code=1 \
              --report-format=sarif \
              --report-path=gitleaks-report.sarif
          else
            echo "Scanning commits: $BEFORE..HEAD"
            gitleaks detect \
              --config=.gitleaks.toml \
              --source=. \
              --log-opts="$BEFORE..HEAD" \
              --redact \
              --exit-code=1 \
              --report-format=sarif \
              --report-path=gitleaks-report.sarif
          fi
        continue-on-error: false

      - name: Scan PR delta only
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --config=.gitleaks.toml \
            --source=. \
            --log-opts="origin/${{ github.base_ref }}...HEAD" \
            --redact \
            --exit-code=1 \
            --report-format=sarif \
            --report-path=gitleaks-report.sarif
        continue-on-error: false

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
        continue-on-error: true
