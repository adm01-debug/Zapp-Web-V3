name: 📦 Publish evolution-api-custom (GHCR)

on:
  workflow_dispatch:
  push:
    paths:
      - 'infra/evolution-api-custom/**'
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/evolution-api-custom
  BASE_IMAGE: evoapicloud/evolution-api@sha256:6b195676b09abbbd8ac9372cd961674dea2587f23dc9bc1d1e6a595372556fb1

jobs:
  build-and-push:
    name: Build & push Evolution custom image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract original main.js from base image
        run: |
          docker create --name evo-base ${{ env.BASE_IMAGE }} true
          docker cp evo-base:/evolution/dist/main.js infra/evolution-api-custom/main.js
          docker rm evo-base
          ls -la infra/evolution-api-custom/main.js

      - name: Apply T1-T6 patches (fail-closed)
        run: |
          cd infra/evolution-api-custom
          node build-patches.mjs main.js main.patched.js t4_prologue.cjs
          ls -la main.patched.js

      - name: Compute image tag
        id: meta
        run: |
          TAG="${GITHUB_SHA::12}"
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: infra/evolution-api-custom
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:2.3.7
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
