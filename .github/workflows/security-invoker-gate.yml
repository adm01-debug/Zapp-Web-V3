name: Guard — Security Invoker

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'src/integrations/supabase/**'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'  # Monday 8am UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-security-invoker:
    name: Verify security_invoker on all views
    runs-on: [Linux, X64, vps-zapp]
    env:
      META_URL: ${{ secrets.ZAPP_META_URL }}
      META_TOKEN: ${{ secrets.ZAPP_META_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: D-8 — Fail gate if v_security_audit has ⚠ rows (schema evo)
        run: |
          if [ -z "$META_URL" ] || [ -z "$META_TOKEN" ]; then
            echo "⚠ Secrets not configured — skipping security audit gate"
            exit 0
          fi
          echo "→ Querying evo.v_security_audit for ⚠ rows..."
          RESPONSE=$(curl -sS "$META_URL/query" \
            -H "apikey: $META_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT count(*) FROM evo.v_security_audit WHERE status LIKE $$%⚠%$$"}' \
            -w "\n%{http_code}" \
            --connect-timeout 10 --max-time 30 2>/dev/null || echo -e "\n000")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESULT=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "504" ]; then
            echo "::error::security audit gate unreachable (HTTP $HTTP_CODE) — FAIL-CLOSED (D-8)"
            exit 1
          fi
          # postgres-meta /query retorna JSON array — count pode vir como número ([{"count":0}])
          # ou string ([{"count":"0"}]) dependendo da versão; aceita ambos (fail-closed se nada casar)
          COUNT=$(echo "$RESULT" | grep -oE '"count": ?"?[0-9]+"?|"\?column\?": ?"?[0-9]+"?' | grep -oE '[0-9]+' | head -1)
          if [ -z "$COUNT" ]; then
            echo "::error::security audit gate: resposta inesperada do postgres-meta — FAIL-CLOSED (D-8): $RESULT"
            exit 1
          fi
          if [ "$COUNT" != "0" ]; then
            echo "::error::v_security_audit has $COUNT ⚠ rows — release gate BLOCKED (D-8). Fix before promoting evo changes."
            exit 1
          fi
          echo "✅ v_security_audit clean (0 ⚠ rows)"

      - name: Check security_invoker via postgres-meta
        run: |
          if [ -z "$META_URL" ] || [ -z "$META_TOKEN" ]; then
            echo "⚠ Secrets not configured — skipping live check"
            exit 0
          fi

          echo "→ Querying views without security_invoker..."
          RESPONSE=$(curl -sS "$META_URL/query" \
            -H "apikey: $META_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT n.nspname, c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname IN ($$public$$,$$zapp$$,$$evo$$) AND c.relkind=$$v$$ AND NOT COALESCE(array_to_string(c.reloptions,$$,$$),$$$$) ~ $$security_invoker=(true|on)$$"}' \
            -w "\n%{http_code}" \
            --connect-timeout 10 --max-time 30 2>/dev/null || echo -e "\n000")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESULT=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::postgres-meta unreachable (connection failed) — FAIL-CLOSED: security_invoker gate cannot be bypassed by infra outage"
            exit 1
          fi

          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::postgres-meta auth failed (HTTP $HTTP_CODE) — FAIL-CLOSED: ZAPP_META_TOKEN may be invalid or revoked; fix the secret before merging"
            exit 1
          fi

          if [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "504" ]; then
            echo "::error::postgres-meta returned HTTP $HTTP_CODE (infra error) — FAIL-CLOSED: security gates must not be bypassed by transient server errors"
            exit 1
          fi

          COUNT=$(echo "$RESULT" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const a=JSON.parse(d);
                if (!Array.isArray(a)) { console.log('api-error'); return; }
                console.log(a.length);
              } catch { console.log('api-error'); }
            })" 2>/dev/null || echo "api-error")

          if [ "$COUNT" = "api-error" ]; then
            echo "::error::postgres-meta returned unexpected format (HTTP $HTTP_CODE) — security_invoker gate cannot be verified; failing to prevent blind spot"
            echo "Response preview: $(echo "$RESULT" | head -c 200)"
            exit 1
          fi

          if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
            echo "✅ All views have security_invoker=true"
            exit 0
          fi

          echo "::error::$COUNT views without security_invoker found!"
          echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const a=JSON.parse(d);if(Array.isArray(a))a.forEach(r=>console.log(' -',r.nspname+'.'+r.relname));}catch{}})" 2>/dev/null
          exit 1

      - name: Check no anon-executable functions
        run: |
          if [ -z "$META_URL" ] || [ -z "$META_TOKEN" ]; then
            echo "⚠ Secrets not configured — skipping live check"
            exit 0
          fi

          RESPONSE=$(curl -sS "$META_URL/query" \
            -H "apikey: $META_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"SELECT count(*) AS c FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname IN ($$zapp$$,$$evo$$) AND has_function_privilege($$anon$$, p.oid, $$EXECUTE$$)"}' \
            -w "\n%{http_code}" \
            --connect-timeout 10 --max-time 30 2>/dev/null || echo -e "\n000")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESULT=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "000" ]; then
            echo "::error::postgres-meta unreachable (connection failed) — FAIL-CLOSED: anon-function gate cannot be bypassed by infra outage"
            exit 1
          fi

          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "::error::postgres-meta auth failed (HTTP $HTTP_CODE) — FAIL-CLOSED: ZAPP_META_TOKEN may be invalid or revoked; fix the secret before merging"
            exit 1
          fi

          if [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ] || [ "$HTTP_CODE" = "504" ]; then
            echo "::error::postgres-meta returned HTTP $HTTP_CODE (infra error) — FAIL-CLOSED: security gates must not be bypassed by transient server errors"
            exit 1
          fi

          COUNT=$(echo "$RESULT" | node -e "
            let d='';
            process.stdin.on('data',c=>d+=c);
            process.stdin.on('end',()=>{
              try {
                const a=JSON.parse(d);
                if (!Array.isArray(a)) { console.log('api-error'); return; }
                const row = a.length === 1 ? a[0] : null;
                const raw = (row && typeof row === 'object' && !Array.isArray(row) && Object.prototype.hasOwnProperty.call(row,'c')) ? String(row.c) : '';
                if (!/^\d+$/.test(raw)) { console.log('api-error'); return; }
                console.log(raw.replace(/^0+/,'') || '0');
              } catch { console.log('api-error'); }
            })" 2>/dev/null || echo "api-error")

          if [ "$COUNT" = "api-error" ]; then
            echo "::error::postgres-meta returned unexpected format (HTTP $HTTP_CODE) — anon-function gate cannot be verified; failing to prevent blind spot"
            echo "Response preview: $(echo "$RESULT" | head -c 200)"
            exit 1
          fi

          if [ "$COUNT" != "0" ]; then
            echo "::error::$COUNT functions executable by anon!"
            exit 1
          fi

          echo "✅ No functions executable by anon"
