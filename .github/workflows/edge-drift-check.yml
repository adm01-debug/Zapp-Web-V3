name: edge-drift-check

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  drift:
    name: edge-drift-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: PR mode — verificacao estatica apenas
        if: github.event_name == 'pull_request'
        run: |
          echo "PR mode: verificacao estatica (drift check de producao roda no schedule/dispatch)"
          if [ ! -d "supabase/functions" ]; then
            echo "::error::Diretorio supabase/functions nao encontrado"
            exit 1
          fi
          if [ -f "supabase/functions/.env.required" ]; then
            echo "OK: .env.required encontrado"
            wc -l < supabase/functions/.env.required || true
          else
            echo "::warning::.env.required nao encontrado"
          fi
          echo "edge-drift-check: static check OK"

      - name: E37 — Comparar hash das funcoes do repo vs producao
        if: github.event_name != 'pull_request'
        run: |
          set +e
          MISSING=0
          for fn_dir in supabase/functions/*/; do
            fn=$(basename "$fn_dir")
            [ "$fn" = "_shared" ] && continue
            [ "$fn" = "main" ] && continue
            [ ! -f "$fn_dir/index.ts" ] && continue
            code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 "https://supabase.atomicabr.com.br/functions/v1/$fn")
            if [ "$code" = "404" ] || [ "$code" = "000" ]; then
              echo "AVISO: $fn: resposta HTTP $code (possivel drift ou rota bloqueada)"
              MISSING=$((MISSING+1))
            fi
          done
          echo "Funcoes com resposta inesperada: $MISSING"
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::Drift detectado: $MISSING funcoes nao respondem como esperado"
            exit 1
          fi
          echo "Todas as funcoes respondem (baseline E37)"

      - name: E38 — Completude de ambiente
        if: github.event_name != 'pull_request'
        run: |
          set +e
          grep -rhoE "Deno\.env\.get\([\"'][A-Z0-9_]+[\"']\)" supabase/functions/ \
            | grep -oE "[A-Z0-9_]{3,}" | sort -u > /tmp/req-repo.txt
          sort -u supabase/functions/.env.required > /tmp/declared.txt 2>/dev/null || touch /tmp/declared.txt
          comm -23 /tmp/req-repo.txt /tmp/declared.txt > /tmp/missing.txt
          echo "Variaveis usadas mas NAO declaradas em .env.required:"
          cat /tmp/missing.txt
          if [ -s /tmp/missing.txt ]; then
            echo "::error::Completude de ambiente falhou"
            exit 1
          fi
          echo "Todas as variaveis usadas estao declaradas em .env.required"

  # ── E39 (endurecido 2026-08-05, reaplicado em AG-EX-13): drift de HASH repo ×
  # volume de produção. Antes, o drift era detectado só por HTTP (404/000 no E37)
  # — não pegava STALE (hash difere com função respondendo) nem MISSING de forma
  # confiável. Agora roda o pipeline real (infra/edge-deploy/deploy-edge.sh,
  # READ-ONLY) no runner self-hosted (que tem o socket docker da VPS) e FALHA o
  # workflow (exit 1) quando existir MISSING, STALE ou ORPHAN.
  hash-drift:
    name: E39 — hash drift (volume × repo)
    if: github.event_name != 'pull_request'
    runs-on: [Linux, X64, vps-zapp]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: E39 — deploy-edge.sh read-only (falha em MISSING/STALE/ORPHAN)
        env:
          EDGE_FUNCTIONS_DIR: supabase/functions
        run: |
          set -uo pipefail
          bash infra/edge-deploy/deploy-edge.sh 2>&1 | tee edge-drift-report.txt || {
            echo "::error::DRIFT de edge functions (MISSING/STALE/ORPHAN) — reconcilie via workflow edge-deploy.yml (--apply) ou backport de hotfix."
            exit 1
          }
