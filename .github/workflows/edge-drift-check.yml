name: edge-drift-check

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: edge-drift-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR mode - verificacao estatica
        if: github.event_name == 'pull_request'
        run: |
          echo "PR mode: static check only"
          [ -d "supabase/functions" ] && echo "OK: functions dir found" || exit 1
          [ -f "supabase/functions/.env.required" ] && echo "OK: .env.required found" || echo "::warning::.env.required nao encontrado"
          echo "edge-drift-check: static check OK"
      - name: Production drift check
        if: github.event_name != 'pull_request'
        run: |
          MISSING=0
          for fn_dir in supabase/functions/*/; do
            fn=$(basename "$fn_dir")
            [ "$fn" = "_shared" ] && continue; [ "$fn" = "main" ] && continue
            [ ! -f "$fn_dir/index.ts" ] && continue
            code=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 15 "https://supabase.atomicabr.com.br/functions/v1/$fn")
            [ "$code" = "404" ] || [ "$code" = "000" ] && MISSING=$((MISSING+1))
          done
          echo "Funcoes com resposta inesperada: $MISSING"
          [ "$MISSING" -gt 5 ] && exit 1
          echo "Baseline E37 OK"
