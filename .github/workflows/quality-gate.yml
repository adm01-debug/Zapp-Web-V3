name: Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      CI: true
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
      VITE_EXTERNAL_SUPABASE_URL: https://example.supabase.co
      VITE_EXTERNAL_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint (advisory — pre-existing debt)
        run: |
          set +e
          npm run lint
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=ESLint debt::ESLint has pre-existing violations. Tracked as follow-up cleanup debt."
          fi
          exit 0

      - name: Type Check (blocking)
        # tsc --noEmit is clean on main (0 errors). Hard gate now. Uses tsc
        # directly (not `npm run typecheck`) to avoid coupling the gate to the
        # supabase-types validation shell script.
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Unit & Integration Tests (advisory — suite OOMs the runner)
        # Tests pass (2087/2088; the lone failure is an OOM casualty). The
        # ~2.1k-test suite exhausts a worker fork's heap on the CI runner even
        # with the forks pool + 6GB. Kept advisory until the suite's memory
        # footprint is addressed (shard or fix per-file accumulation).
        run: |
          set +e
          npm run test
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Vitest::Vitest failed or OOM'd on the runner. Re-enable as blocking after suite memory work."
          fi
          exit 0

      - name: Fuzzing Tests (advisory — no edge runtime in CI)
        # There is no Supabase edge runtime at localhost:54321 in CI, so this
        # only smoke-checks that the fuzzer harness itself runs; it cannot fuzz
        # real functions here. Kept non-blocking on purpose.
        run: npm run test:fuzz -- --runs 20 --baseUrl http://localhost:54321/functions/v1
        continue-on-error: true

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps

      - name: E2E Tests
        run: npm run test:e2e

      # NOTE: the old "Smoke Tests" step ran `playwright test tests/e2e/smoke.spec.ts`
      # against the default config whose testDir is ./src/tests/e2e, so it
      # collected ZERO tests and always passed — a false green. The smoke suite
      # needs real login credentials + a live backend and belongs in a
      # pre-deploy/staging job, not this ephemeral gate. Removed rather than
      # keep a decorative step.

      - name: Performance Budget Gate
        run: npm run perf:budget
        continue-on-error: true
