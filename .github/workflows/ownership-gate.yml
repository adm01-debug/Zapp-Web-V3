name: ownership-gate

on:
  push:
    branches: [main, 'feat/decouple*']
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'supabase/functions/**/*.ts'
  pull_request:
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'supabase/functions/**/*.ts'

jobs:
  schema-ownership:
    name: "Schema ownership — Zapp não grava em evo Grupo A"
    # ubuntu-latest (auditoria 2026-08-21, PR #1368 piloto validado): análise estática local, sem DB/VPS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run ownership gate
        run: node --experimental-vm-modules scripts/decouple/ownership-gate.mjs --ci
