name: 🚀 Build & Deploy — ZAPP web v3

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag override (default: production-<sha>)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/zapp-web

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: 🛡️ Preflight Secrets Validation
        env:
          CI: "true"
          ENFORCE_DEPLOY_SECRETS: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/check-deploy-secrets.mjs
          echo "✅ Todos os secrets críticos (Auth, DB, Service Role) estão presentes."

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="production-${GITHUB_SHA::12}"; fi
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_GIT_SHA=${{ github.sha }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_APP_ENV=production

      # ============================================================
      # ETAPA 34 — Faxina Portainer (2026-08-05): retenção GHCR
      # Cada deploy cria ~3 versões (1 index tagado production-<sha> +
      # manifest amd64 + attestation-manifest, ambos untagged, pois o
      # buildx gera provenance por padrão). min-versions-to-keep=9
      # = 3 deploys ÍNTEGROS (múltiplo de 3: o corte por recência cai
      # ENTRE builds, nunca no meio — com 8, o 3º deploy ficava com
      # index mantido + amd64 deletado → pull com 'manifest unknown').
      # O rollback (penúltimo deploy) ocupa as posições 4–6 das 9.
      # ⚠️ NÃO usar delete-only-untagged-versions aqui: apagaria os
      # manifests-filho (imagem/attestation) e o pull da tag falharia
      # com 'manifest unknown' (P0 confirmado via OCI index).
      # package-name = caminho completo SEM o owner (zapp-web-v3/zapp-web).
      # continue-on-error: retenção nunca pode BLOQUEAR o deploy; falha
      # é sinalizada pelo step de alerta abaixo (sentinel greppável).
      # ============================================================
      - name: 🧹 GHCR retention (keep 9 versions — 3 deploys íntegros)
        id: retention
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: zapp-web-v3/zapp-web
          package-type: container
          # 3 versões/deploy (index + amd64 + attestation). 9 = 3 deploys completos:
          # o corte de recência cai ENTRE builds, nunca no meio (evita index
          # mantido com filho deletado → manifest unknown). 8 cortava o 3º deploy.
          min-versions-to-keep: 9
          # Proteger rollbacks históricos tagueados para evitar deleção prematura.
          # NÃO usar delete-only-untagged-versions (apagaria manifests-filho → pull falha).
          ignore-versions: "^production-(fbd04bec303d|988086a2bbbd)"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚨 Alerta se a retenção GHCR falhar (não bloqueia deploy)
        if: always() && steps.retention.outcome == 'failure'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          GH_TOKEN_ACTIONS: ${{ secrets.GH_TOKEN_ACTIONS }}
        run: |
          MSG="GHCR retention FALHOU em ${{ github.sha }} — run ${{ github.run_id }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -fsS -X POST "$ALERT_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"⚠️ ${MSG}\"}" || true
          elif [ -n "$GH_TOKEN_ACTIONS" ]; then
            curl -fsS -X POST "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -H "Authorization: Bearer $GH_TOKEN_ACTIONS" \
              -H 'Accept: application/vnd.github+json' \
              -d "{\"body\":\"⚠️ ${MSG}\"}" || true
          fi
          echo "::warning::GHCR_RETENTION_FAILED ${MSG}"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Verify required secrets
        run: |
          missing=""
          [ -z "${PORTAINER_API_TOKEN}" ] && missing="$missing PORTAINER_API_TOKEN"
          [ -z "${PORTAINER_URL}" ]        && missing="$missing PORTAINER_URL"
          if [ -n "$missing" ]; then
            echo "::error::Required secrets not configured:${missing}"
            exit 1
          fi
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}

      - name: Deploy via Portainer API
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          ZAPP_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          echo "Deploying: ${ZAPP_IMAGE}"

          # ============================================================
          # ETAPA 12 — VPS Disk Defense Plan
          # FIX: usa ZAPP_IMAGE (SHA-based, imutuavel) em vez de
          # production-latest (moving tag que gera dangling images).
          # production-latest ainda e pushado no build para referencia
          # externa, mas o STACK SWARM referencia a tag SHA imutavel.
          # Antes: cada deploy = 1 dangling x 51MB ~ 3.5GB/dia.
          # Depois: stack aponta para SHA imutavel, zero dangling.
          # ============================================================
          cat > /tmp/compose.yml << 'COMPOSEYML'
          version: "3.8"
          services:
            web:
              image: ZAPP_IMAGE_PLACEHOLDER
              networks:
                - AtomicaBRNet
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 30s
              deploy:
                mode: replicated
                replicas: 1
                placement:
                  constraints:
                    - node.role == manager
                labels:
                  - traefik.enable=true
                  - "traefik.http.routers.zapp-prod.rule=Host(`zapp.atomicabr.com.br`)"
                  - traefik.http.services.zapp-prod.loadbalancer.server.port=80
                  - traefik.http.routers.zapp-prod.service=zapp-prod
                  - traefik.http.routers.zapp-prod.entrypoints=websecure
                  - traefik.http.routers.zapp-prod.tls.certresolver=letsencryptresolver
                  - traefik.http.routers.zapp-prod.tls=true
                  - com.centurylinklabs.watchtower.enable=false
                  - com.atomicabr.tier=critical
                update_config:
                  failure_action: rollback
                  monitor: 60s
                  order: start-first
                rollback_config:
                  order: start-first
                  monitor: 60s
                  failure_action: continue
                resources:
                  limits:
                    memory: 256M
                    cpus: "0.5"
          networks:
            AtomicaBRNet:
              external: true
              name: AtomicaBRNet
          COMPOSEYML

          # Substitui o placeholder pelo SHA-based tag real
          sed -i "s|ZAPP_IMAGE_PLACEHOLDER|${ZAPP_IMAGE}|g" /tmp/compose.yml
          echo "Image no compose: $(grep 'image:' /tmp/compose.yml | head -1 | xargs)"

          STACK_CONTENT=$(cat /tmp/compose.yml | jq -Rs .)
          PAYLOAD="{\"pullImage\":true,\"prune\":false,\"stackFileContent\":${STACK_CONTENT}}"

          HTTP=$(curl -s -o /tmp/pr.json -w "%{http_code}" \
            -X PUT "${PORTAINER_URL}/api/stacks/157?endpointId=1" \
            -H "X-API-Key: ${PORTAINER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")

          echo "Portainer HTTP: ${HTTP}"
          cat /tmp/pr.json | head -c 400 || true
          [ "${HTTP}" = "200" ] || { echo "::error::Deploy failed HTTP ${HTTP}"; exit 1; }

          # Aguardar além do start_period (30s) para checar o container novo, não o antigo
          echo "Aguardando 45s rollout (start_period=30s + margem)..."
          sleep 45

          # HC best-effort: start-first pode ter container antigo ainda em trânsito.
          # Falha aqui é ::warning:: (não exit 1) — Docker Swarm monitora saúde internamente.
          HC=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://zapp.atomicabr.com.br/auth || echo 000)
          echo "Health /auth: ${HC}"
          case "${HC}" in 200|301|302) echo "App OK" ;; *) echo "::warning::POST_DEPLOY_HC=${HC} — verificar serviço manualmente"; esac
