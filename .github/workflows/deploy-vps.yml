name: 🚀 Build & Deploy — ZAPP web v3

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag override (default: production-<sha>)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/zapp-web

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="production-${GITHUB_SHA::12}"; fi
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_APP_ENV=production

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Verify required secrets
        run: |
          missing=""
          [ -z "${PORTAINER_API_TOKEN}" ] && missing="$missing PORTAINER_API_TOKEN"
          [ -z "${PORTAINER_URL}" ]        && missing="$missing PORTAINER_URL"
          if [ -n "$missing" ]; then
            echo "::error::Required secrets not configured:${missing}"
            echo "Add them at: Settings -> Environments -> production"
            exit 1
          fi
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}

      - name: Deploy via Portainer API
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          ZAPP_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          echo "Deploying: ${ZAPP_IMAGE}"

          # Compose completo com todos os labels Traefik (Host rule obrigatorio)
          cat > /tmp/compose.yml << 'COMPOSEYML'
          version: "3.8"
          services:
            web:
              image: ghcr.io/adm01-debug/zapp-web-v3/zapp-web:production-latest
              networks:
                - AtomicaBRNet
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
                interval: 30s
                timeout: 5s
                retries: 3
                start_period: 30s
              deploy:
                mode: replicated
                replicas: 1
                placement:
                  constraints:
                    - node.role == manager
                labels:
                  - traefik.enable=true
                  - "traefik.http.routers.zapp-prod.rule=Host(`zapp.atomicabr.com.br`)"
                  - traefik.http.services.zapp-prod.loadbalancer.server.port=80
                  - traefik.http.routers.zapp-prod.service=zapp-prod
                  - traefik.http.routers.zapp-prod.entrypoints=websecure
                  - traefik.http.routers.zapp-prod.tls.certresolver=letsencryptresolver
                  - traefik.http.routers.zapp-prod.tls=true
                  - com.centurylinklabs.watchtower.enable=false
                update_config:
                  failure_action: rollback
                  monitor: 60s
                  order: start-first
                resources:
                  limits:
                    memory: 256M
                    cpus: "0.5"
          networks:
            AtomicaBRNet:
              external: true
              name: AtomicaBRNet
          COMPOSEYML

          # Serializa o YAML como string JSON
          STACK_CONTENT=$(cat /tmp/compose.yml | jq -Rs .)
          PAYLOAD="{\"pullImage\":true,\"prune\":false,\"stackFileContent\":${STACK_CONTENT}}"

          HTTP=$(curl -s -o /tmp/pr.json -w "%{http_code}" \
            -X PUT "${PORTAINER_URL}/api/stacks/157?endpointId=1" \
            -H "X-API-Key: ${PORTAINER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}")

          echo "Portainer HTTP: ${HTTP}"
          cat /tmp/pr.json | head -c 400 || true
          [ "${HTTP}" = "200" ] || { echo "::error::Deploy failed HTTP ${HTTP}"; exit 1; }

          echo "Aguardando 20s rollout..."
          sleep 20

          HC=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://zapp.atomicabr.com.br/auth || echo 000)
          echo "Health /auth: ${HC}"
          case "${HC}" in 200|301|302) echo "App OK" ;; *) echo "::warning::HC=${HC}"; esac
