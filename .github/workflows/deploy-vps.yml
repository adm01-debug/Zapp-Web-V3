name: 🚀 Build & Deploy — ZAPP web v3

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag override (default: production-<sha>)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/zapp-web

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="production-${GITHUB_SHA::12}"; fi
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_EXTERNAL_SUPABASE_URL=${{ secrets.VITE_EXTERNAL_SUPABASE_URL }}
            VITE_EXTERNAL_SUPABASE_ANON_KEY=${{ secrets.VITE_EXTERNAL_SUPABASE_ANON_KEY }}
            VITE_ZAPPWEB_SUPABASE_URL=${{ secrets.VITE_ZAPPWEB_SUPABASE_URL }}
            VITE_ZAPPWEB_SUPABASE_ANON_KEY=${{ secrets.VITE_ZAPPWEB_SUPABASE_ANON_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Verify required secrets
        run: |
          missing=""
          [ -z "${VPS_HOST}" ]    && missing="$missing VPS_HOST"
          [ -z "${VPS_USER}" ]    && missing="$missing VPS_USER"
          [ -z "${VPS_SSH_KEY}" ] && missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Required secrets not configured:${missing}"
            echo "Add them at: Settings → Environments → production"
            exit 1
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          ZAPP_WEB_IMAGE: ${{ needs.build-and-push.outputs.image }}
          ZAPP_WEB_HOST: ${{ vars.ZAPP_WEB_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ZAPP_WEB_IMAGE,ZAPP_WEB_HOST
          script: |
            set -euo pipefail
            cd "/opt/zapp-web"
            export ZAPP_WEB_IMAGE="$ZAPP_WEB_IMAGE"
            export ZAPP_WEB_HOST="${ZAPP_WEB_HOST:-zapp.atomicabr.com.br}"
            echo "Deploying: $ZAPP_WEB_IMAGE"
            docker compose pull zapp-web
            docker compose up -d --no-deps zapp-web
            docker image prune -f
            echo "Verifying health..."
            sleep 10
            docker compose ps zapp-web
