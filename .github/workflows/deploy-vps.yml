name: 🚀 Build & Deploy — ZAPP web v3

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag override (default: production-<sha>)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/zapp-web

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="production-${GITHUB_SHA::12}"; fi
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_EXTERNAL_SUPABASE_URL=${{ secrets.VITE_EXTERNAL_SUPABASE_URL }}
            VITE_EXTERNAL_SUPABASE_ANON_KEY=${{ secrets.VITE_EXTERNAL_SUPABASE_ANON_KEY }}
            VITE_ZAPPWEB_SUPABASE_URL=${{ secrets.VITE_ZAPPWEB_SUPABASE_URL }}
            VITE_ZAPPWEB_SUPABASE_ANON_KEY=${{ secrets.VITE_ZAPPWEB_SUPABASE_ANON_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN || 'https://50b1ab55-2b7d-4773-be20-00cc47ab7f06@erros.atomicabr.com.br/3' }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Verify required secrets
        run: |
          missing=""
          [ -z "${PORTAINER_API_TOKEN}" ] && missing="$missing PORTAINER_API_TOKEN"
          [ -z "${PORTAINER_URL}" ]        && missing="$missing PORTAINER_URL"
          if [ -n "$missing" ]; then
            echo "::error::Required secrets not configured:${missing}"
            echo "Add them at: Settings -> Environments -> production"
            exit 1
          fi
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}

      - name: Deploy via Portainer API
        env:
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          ZAPP_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          echo "Deploying: ${ZAPP_IMAGE}"
          # Stack 157 = zapp-web-prod (Swarm endpoint 1) - sem SSH, sem firewall
          HTTP=$(curl -s -o /tmp/pr.json -w "%{http_code}" \
            -X POST "${PORTAINER_URL}/api/stacks/157/images?endpointId=1" \
            -H "X-API-Key: ${PORTAINER_API_TOKEN}")
          echo "Pull HTTP: ${HTTP}"; cat /tmp/pr.json | head -c 200 || true
          # Trigger service update (force redeploy)
          HTTP2=$(curl -s -o /tmp/pr2.json -w "%{http_code}" \
            -X POST "${PORTAINER_URL}/api/stacks/157/associate?endpointId=1&swarmId=ypqv6itnmp6vnxz4xdkk4dpod&orphanedRunning=false" \
            -H "X-API-Key: ${PORTAINER_API_TOKEN}" 2>/dev/null || echo 000)
          # Portainer stack update (pull + redeploy)
          HTTP3=$(curl -s -o /tmp/pr3.json -w "%{http_code}" \
            -X PUT "${PORTAINER_URL}/api/stacks/157?endpointId=1" \
            -H "X-API-Key: ${PORTAINER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"pullImage":true,"prune":false,"stackFileContent":"version: \"3.8\"\nservices:\n  web:\n    image: ghcr.io/adm01-debug/zapp-web-v3/zapp-web:production-latest\n    networks:\n      - AtomicaBRNet\n    healthcheck:\n      test: [\"CMD\",\"wget\",\"-qO-\",\"http://127.0.0.1/healthz\"]\n      interval: 30s\n      timeout: 5s\n      retries: 3\n      start_period: 30s\n    deploy:\n      mode: replicated\n      replicas: 1\n      labels:\n        - traefik.enable=true\n        - traefik.http.services.zapp-prod.loadbalancer.server.port=80\n        - traefik.http.routers.zapp-prod.entrypoints=websecure\n        - traefik.http.routers.zapp-prod.tls.certresolver=letsencryptresolver\n        - traefik.http.routers.zapp-prod.tls=true\n        - com.centurylinklabs.watchtower.enable=false\n      update_config:\n        failure_action: rollback\n        order: start-first\n      resources:\n        limits:\n          memory: 256M\n          cpus: \"0.5\"\nnetworks:\n  AtomicaBRNet:\n    external: true\n    name: AtomicaBRNet\n"}')
          echo "Update HTTP: ${HTTP3}"; cat /tmp/pr3.json | head -c 300 || true
          [ "${HTTP3}" = "200" ] || { echo "::error::Portainer deploy failed HTTP ${HTTP3}"; exit 1; }
          sleep 20
          HC=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            https://zapp.atomicabr.com.br/ || echo 000)
          echo "Health: ${HC}"
          case "${HC}" in 200|301|302) echo "App OK" ;; *) echo "::warning::HC=${HC}" ;; esac
