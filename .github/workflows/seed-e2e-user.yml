name: Seed E2E user (REST)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_SERVICE_ROLE_KEY: { required: true }
      E2E_USER_EMAIL:            { required: true }
      E2E_USER_PASSWORD:         { required: true }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    name: Criar/atualizar usuário E2E (auth + profile + role agent)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # E2E-05 (2026-08-07): porta 22 da VPS fechada p/ internet — SSH morto.
      # Seed via zapp.rpc_e2e_seed_user() (SECURITY DEFINER — auth.users upsert,
      # profiles ativo, user_roles agent no workspace do app) + REST com
      # service_role. A senha trafega no corpo do POST (HTTPS) e é mascarada
      # pelo GitHub Actions nos logs (vem do secret via env).
      - name: Semear usuário E2E via RPC
        env:
          SUPABASE_URL: https://supabase.atomicabr.com.br
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SERVICE_ROLE_KEY" ] || [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY / E2E_USER_EMAIL / E2E_USER_PASSWORD não configurados nos secrets."
            exit 1
          fi
          HTTP=$(curl -s -o /tmp/seed-user.json -w "%{http_code}" --max-time 30             -X POST "$SUPABASE_URL/rest/v1/rpc/rpc_e2e_seed_user"             -H "apikey: $SERVICE_ROLE_KEY"             -H "Authorization: Bearer $SERVICE_ROLE_KEY"             -H "Content-Type: application/json"             -d "{\"p_email\":\"$E2E_USER_EMAIL\",\"p_password\":\"$E2E_USER_PASSWORD\"}" || true)
          echo "HTTP: $HTTP"
          cat /tmp/seed-user.json
          if [ "$HTTP" != "200" ]; then
            echo "::error::E2E_SEED_USER_FAIL — RPC retornou HTTP $HTTP ($(cat /tmp/seed-user.json))"
            exit 1
          fi
          OK=$(jq -r '.ok // false' /tmp/seed-user.json 2>/dev/null || echo false)
          if [ "$OK" != "true" ]; then
            echo "::error::E2E_SEED_USER_FAIL — $(cat /tmp/seed-user.json)"
            exit 1
          fi
          echo "✅ Seed user OK — $(cat /tmp/seed-user.json)"
