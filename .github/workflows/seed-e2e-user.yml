name: Seed E2E user (VPS)

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      VPS_SSH_HOST:        { required: true }
      VPS_SSH_USER:        { required: true }
      VPS_SSH_KEY:         { required: true }
      SUPABASE_DB_URL:     { required: true }
      E2E_USER_EMAIL:      { required: true }
      E2E_USER_PASSWORD:   { required: true }

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — checar secrets obrigatórios
        env:
          SUPABASE_DB_URL:   ${{ secrets.SUPABASE_DB_URL }}
          E2E_USER_EMAIL:    ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          VPS_SSH_HOST:      ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_USER:      ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_KEY:       ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=()
          for v in SUPABASE_DB_URL E2E_USER_EMAIL E2E_USER_PASSWORD VPS_SSH_HOST VPS_SSH_USER VPS_SSH_KEY; do
            if [ -z "${!v:-}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Seed E2E: secrets faltantes::${missing[*]} não configurado(s) neste repo. Adicione em Settings → Secrets and variables → Actions."
            {
              echo "### ❌ Seed E2E abortado — secrets faltantes"
              echo ""
              echo "Configure em **Settings → Secrets and variables → Actions**:"
              for v in "${missing[@]}"; do echo "- \`$v\`"; done
              echo ""
              echo "Depois re-execute este workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 78
          fi
          echo "✓ Todos os secrets obrigatórios presentes."



      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Copiar seed para VPS
        run: |
          scp -i ~/.ssh/id_ed25519 \
            scripts/seed-e2e-user.sql scripts/seed-e2e-user.sh \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/tmp/"

      - name: Rodar seed na VPS
        env:
          SUPABASE_DB_URL:   ${{ secrets.SUPABASE_DB_URL }}
          E2E_USER_EMAIL:    ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "chmod +x /tmp/seed-e2e-user.sh && \
             SEED_REPORT_JSON=/tmp/seed-e2e-user-summary.json \
             SEED_REPORT_LOG=/tmp/seed-e2e-user.log \
             SUPABASE_DB_URL='$SUPABASE_DB_URL' \
             E2E_USER_EMAIL='$E2E_USER_EMAIL' \
             E2E_USER_PASSWORD='$E2E_USER_PASSWORD' \
             /tmp/seed-e2e-user.sh"

      - name: Trazer log/summary da VPS
        if: always()
        run: |
          mkdir -p reports
          scp -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/tmp/seed-e2e-user-summary.json" \
            reports/seed-e2e-user-summary.json || echo "{}" > reports/seed-e2e-user-summary.json
          scp -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:/tmp/seed-e2e-user.log" \
            reports/seed-e2e-user.log || true

      - name: Renderizar HTML + Step Summary
        if: always()
        run: |
          node scripts/render-seed-report.mjs \
            reports/seed-e2e-user-report.html \
            reports/seed-e2e-user-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefato (HTML + log + json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-e2e-user-report
          path: reports/
          retention-days: 14

