name: health-score-anti-drift

# R25 P2-8 — Anti-drift de fn_system_health_score (Regra F3).
# A função foi modificada silenciosamente por deploys no passado (incidente
# 8KB→19KB/48ms→1200ms). Este gate bloqueia PRs que alterem o corpo da função
# SEM uma migration versionada correspondente em supabase/migrations/.
#
# Lógica:
#   1. Extrai o corpo de fn_system_health_score (e fn_score_security_acl) do
#      diff do PR (linhas +/- que tocam essas definições).
#   2. Se houver alteração, exige que o PR também inclua migration versionada
#      nova em supabase/migrations/ (regex ^\d{14}_).
#   3. Se alterou sem migration → FAIL (bloqueia merge via branch protection).

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  anti-drift:
    name: Health score anti-drift (F3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect fn_system_health_score / fn_score_security_acl changes
        id: detect
        run: |
          set -euo pipefail
          base_ref="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" 2>/dev/null || true

          # Arquivos .sql tocados no PR (adicionados ou modificados)
          changed_sql=$(git diff --diff-filter=AM --name-only "$base_ref"...HEAD -- '*.sql' 2>/dev/null || true)

          # Falha apenas se um arquivo NÃO-migration redefine as funções
          # via CREATE OR REPLACE FUNCTION. Meras menções (doc, comentário,
          # GRANT, teste) em migrations versionadas são legítimas e não devem
          # disparar o gate.
          touched=""
          if [ -n "$changed_sql" ]; then
            for f in $changed_sql; do
              # Migrations versionadas (14 dígitos) = caminho legítimo → skip
              if echo "$f" | grep -qE 'supabase/migrations/[0-9]{14}_'; then
                continue
              fi
              # Snapshots gerados por dump (drift-check REGEN) = artefato, não edição → skip
              if echo "$f" | grep -qE 'scripts/decouple/snapshots/'; then
                continue
              fi
              # Fora do caminho legítimo: verifica redefinição real da função
              if grep -qPi 'CREATE\s+OR\s+REPLACE\s+FUNCTION\s+\w*\.(fn_system_health_score|fn_score_security_acl)' "$f" 2>/dev/null; then
                touched="$touched $f"
              fi
            done
          fi

          if [ -n "$touched" ]; then
            echo "::error::fn_system_health_score/fn_score_security_acl redefinidas fora de migration versionada (Regra F3):$touched"
            echo "drift=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "Sem redefinição de fn_system_health_score/fn_score_security_acl fora de migration. OK."
          echo "drift=false" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.detect.outputs.drift }}" = "true" ]; then
            echo "❌ Anti-drift F3: alteração de função canônica sem migration versionada."
          else
            echo "✅ Anti-drift F3: funções canônicas protegidas."
          fi
