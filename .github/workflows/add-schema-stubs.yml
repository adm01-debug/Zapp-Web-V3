name: Add zapp+evo schema stubs to types.ts

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  add-stubs:
    name: Patch types.ts with schema stubs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply stubs patch
        run: bash scripts/add-schema-stubs.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/integrations/supabase/types.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes needed — types.ts already has zapp and evo"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat src/integrations/supabase/types.ts
          fi

      - name: Create PR with schema stubs
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BRANCH_NAME="fix/add-schema-stubs-${TIMESTAMP}"

          git checkout -b "$BRANCH_NAME"
          git add src/integrations/supabase/types.ts
          git commit -m "chore(types): add zapp+evo schema stubs to unblock CI gate [schema gate fix]"
          git push -u origin "$BRANCH_NAME"

          gh pr create \
            --title "chore(types): add zapp+evo schema stubs" \
            --body "## Summary

Adds minimal zapp and evo schema stubs to types.ts to unblock the CI gate.

The schema gate (\`check-types-schemas.mjs\`) requires \`zapp\` and \`evo\` as top-level keys in the Database type.

These stubs are minimal placeholders. The full types will be generated by \`gen-types-zapp.yml\` once configured.

## Test plan
- CI gate should pass after this PR
- TypeScript ratchet should pass (no new errors)
" \
            --base main

      - name: Summary
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo '## Schema stubs PR created' >> $GITHUB_STEP_SUMMARY
            echo 'PR branch created with zapp+evo stubs in types.ts' >> $GITHUB_STEP_SUMMARY
          else
            echo '## Already up to date' >> $GITHUB_STEP_SUMMARY
            echo 'types.ts already has zapp and evo schemas' >> $GITHUB_STEP_SUMMARY
          fi
