name: 🕸️ Regenerate Knowledge Graph (Graphify)

on:
  schedule:
    - cron: '0 8 * * 1'  # toda segunda 8h UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/migrations/**'

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-graph:
    name: Build knowledge graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install graphifyy + SQL support
        run: pip install "graphifyy[sql]"

      - name: Generate knowledge graph
        run: |
          python -c "
          import json
          from graphify.detect import detect
          from graphify.extract import collect_files, extract
          from graphify.build import build_from_json
          from graphify.cluster import cluster, score_all
          from graphify.analyze import god_nodes, surprising_connections, suggest_questions
          from graphify.report import generate
          from graphify.export import to_json
          from pathlib import Path
          import os

          print('=== Detectando arquivos ===')
          result = detect(Path('.'))
          print(f'  {result[\"total_files\"]} arquivos, ~{result[\"total_words\"]} palavras')

          code_files = []
          for f in result['files']['code']:
              code_files.extend(collect_files(Path(f)) if Path(f).is_dir() else [Path(f)])
          print(f'  {len(code_files)} code files')

          print('=== Extraindo AST ===')
          extraction = extract(code_files, cache_root=Path('.'))
          print(f'  {len(extraction[\"nodes\"])} nodes, {len(extraction[\"edges\"])} edges')

          # Write empty semantic (code-only, no docs extraction)
          semantic = {'nodes':[],'edges':[],'hyperedges':[],'input_tokens':0,'output_tokens':0}

          # Merge
          seen = {n['id'] for n in extraction['nodes']}
          merged_nodes = list(extraction['nodes'])
          merged_edges = extraction['edges'] + semantic['edges']
          merged = {
              'nodes': merged_nodes,
              'edges': merged_edges,
              'hyperedges': [],
              'input_tokens': 0,
              'output_tokens': 0,
          }

          print('=== Build + Cluster ===')
          G = build_from_json(merged, root='.')
          communities = cluster(G)
          cohesion = score_all(G, communities)
          gods = god_nodes(G)
          labels = {cid: 'Community ' + str(cid) for cid in communities}
          print(f'  {len(communities)} communities, top god: {gods[0][\"label\"]} ({gods[0][\"degree\"]}°)')

          print('=== Export ===')
          os.makedirs('graphify-out', exist_ok=True)
          to_json(G, communities, 'graphify-out/graph.json')
          print(f'  graph.json written')

          # Generate report
          tokens = {'input': 0, 'output': 0}
          surprises = surprising_connections(G, communities)
          questions = suggest_questions(G, communities, labels)
          report = generate(G, communities, cohesion, labels, gods, surprises, result, tokens, '.', suggested_questions=questions)
          Path('graphify-out/GRAPH_REPORT.md').write_text(report, encoding='utf-8')
          print(f'  GRAPH_REPORT.md written ({len(report)} chars)')

          # Summary
          sizes = sorted([len(nodes) for nodes in communities.values()], reverse=True)
          print(f'=== DONE ===')
          print(f'  {G.number_of_nodes()} nodes, {G.number_of_edges()} edges, {len(communities)} communities')
          print(f'  Largest community: {sizes[0]} nodes')
          print(f'  God nodes: {gods[0][\"label\"]} ({gods[0][\"degree\"]}°), {gods[1][\"label\"]} ({gods[1][\"degree\"]}°), {gods[2][\"label\"]} ({gods[2][\"degree\"]}°)')
          "

      - name: Upload graph artifact
        uses: actions/upload-artifact@v7
        with:
          name: knowledge-graph
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
          retention-days: 30
          compression-level: 6

      - name: Summary
        run: |
          echo "## 🕸️ Knowledge Graph Regenerated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifact: \`knowledge-graph\` (download from this run's artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To use locally: download artifact → extract to \`graphify-out/\`" >> $GITHUB_STEP_SUMMARY
