name: Migration Smoke Test

# Aplica migrations contra um Postgres 16 fresh bootstrapped com stubs Supabase.
# Captura erros de sintaxe antes de chegarem em producao.
#
# ARQUITETURA ATUAL (2026-07-30):
#   O schema foi migrado do Supabase Cloud (descontinuado) para self-hosted
#   via dump/restore em 2026-07-16. As migrations ativas sao INCREMENTAIS
#   (alaram objetos que ja existem em prod). O baseline (20260730000000) e
#   puramente documental. Por isso, apply-from-scratch nao e possivel.
#
# O que este workflow GARANTE:
#   - Linter estatico captura erros de sintaxe e violacoes de padrao (E31)
#   - Migrations NOVAS (delta do push) sao testadas contra o bootstrap
#   - O step de apply-from-scratch e executado mas NAO bloqueia CI quando falha
#     devido a dependencias de esquema (comportamento esperado com schema incremental)
#
# O que requer stack real (nao testado aqui):
#   - RLS policy evaluation
#   - pg_cron / pg_net
#   - Edge Functions / Storage

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "supabase/migrations/**.sql"
      - "supabase/ci/pg-bootstrap.sql"
      - ".github/workflows/migration-smoke-test.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**.sql"

concurrency:
  # PR: grupo unico por numero de PR, sem cancelar. Push/schedule: por ref, cancela.
  group: migration-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request.number == '' }}

jobs:
  smoke:
    name: Apply migrations from scratch
    runs-on: [Linux, X64, vps-zapp]


    # Conexão ao postgres via docker exec (evita problema de rede bridge entre containers)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node (for migration linter)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Migration linter - static drift guard (E31)
        # Execucao rapida ANTES de aplicar ao Postgres.
        # Captura: SECDEF sem search_path, writes em VIEWs sem INSTEAD OF,
        # RLS ausente em novas tabelas.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base"...HEAD -- "supabase/migrations/*.sql" 2>/dev/null || true)
          if [ -z "$changed" ]; then
            echo "No migration files changed - linter skipped."
            exit 0
          fi
          echo "Linting changed migrations:"
          echo "$changed"
          CHANGED_FILES="$changed" node scripts/lint-migrations.mjs

      - name: Start Postgres (docker run — vps-zapp sem services:)
        run: |
          docker rm -f pg-smoke 2>/dev/null || true
          docker run -d --name pg-smoke \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:16-bullseye
          timeout 60 sh -c 'until docker exec pg-smoke pg_isready -U postgres; do sleep 1; done'
          echo "Postgres ready"

      - name: Apply Supabase compatibility bootstrap
        run: |
          # Copia o arquivo para o container e executa via docker exec (rede bridge)
          docker cp supabase/ci/pg-bootstrap.sql pg-smoke:/tmp/pg-bootstrap.sql
          docker exec pg-smoke psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f /tmp/pg-bootstrap.sql
          echo "Bootstrap applied successfully."

      - name: SQL syntax gate — parse real (PostgreSQL/pglast) [BLOQUEANTE]
        # Cierra el buraco del smoke-test (continue-on-error + exit 0 tragan
        # errores de sintaxis — caso PR #1330: CREATE TABLE sin cuerpo, CI PASS 13s).
        # Valida el 100% sin ejecutar: sin falsos positivos por dependencias.
        run: |
          # Fix 2026-08-21 v2 (plano-100 etapa 67 — causa raiz PROVADA no run
          # 32437853802): o Python do host do runner é 3.8; o pglast atual não
          # tem wheel cp38 e o build da fonte exige setuptools==83 (inexistente
          # para 3.8) — por isso o pip falhava SEMPRE e o job morria com exit 2
          # antes de aplicar qualquer migration (0% de sucesso histórico).
          # PyPI está acessível (o cython baixou). Solução determinística:
          # validar num container python:3.12-slim — o job já depende de Docker
          # (sobe o pg-smoke no step anterior).
          # Fix 2026-08-21 v3 (achado no review do PR #1354, run 32480220669
          # — job "Apply migrations from scratch" falhou de verdade, nao e
          # flake): a v2 usava `docker run -v "$PWD:/repo"` — bind mount que
          # FALHA neste runner fleet porque o proprio runner do GitHub Actions
          # roda dentro de um container (vps-zapp*, Docker-outside-of-Docker
          # via socket): "$PWD" dentro do runner nao corresponde a um path
          # valido no host do daemon Docker, entao o mount resolve em silencio
          # para um diretorio vazio/errado — erro observado foi "No such file
          # or directory" para scripts/validate-migration-syntax.py, um
          # arquivo que comprovadamente existe no checkout (o fallback do
          # host le o mesmo arquivo sem erro no mesmo run). Evidencia de que
          # docker cp/exec funciona neste fleet: o step "Apply Supabase
          # compatibility bootstrap" (2 steps acima, mesmo job) usa
          # exatamente esse padrao com sucesso. Troquei o bind mount por
          # create+cp+exec (mesmo padrao), que nao depende de equivalencia de
          # path host<->runner.
          #
          # Semântica: erro de SINTAXE bloqueia (exit 1). Indisponibilidade de
          # UM validador (container OU host) tenta o outro antes de desistir —
          # mas se NENHUM dos dois conseguir rodar, o step falha (nao passa em
          # silencio): um step marcado [BLOQUEANTE] que vira no-op quando a
          # infra de validacao cai reabre exatamente o buraco que este gate
          # existe para fechar (PR #1330, achado no review do PR #1354).
          set -uo pipefail
          rc=0
          docker rm -f syntax-gate 2>/dev/null || true
          docker run -d --name syntax-gate python:3.12-slim sleep 300 >/dev/null
          docker cp scripts/validate-migration-syntax.py syntax-gate:/tmp/validate-migration-syntax.py
          docker cp supabase/migrations syntax-gate:/tmp/migrations
          docker exec syntax-gate sh -c 'pip install --quiet pglast || exit 3; python /tmp/validate-migration-syntax.py --dir /tmp/migrations' || rc=$?
          docker rm -f syntax-gate >/dev/null 2>&1 || true
          if [ "$rc" = "0" ]; then
            echo "Gate de sintaxe OK (container python:3.12)"
            exit 0
          fi
          if [ "$rc" = "1" ]; then
            echo "::error::Erro de sintaxe SQL detectado pelo gate (ver acima) — bloqueante"
            exit 1
          fi
          echo "::warning::Validador no container indisponível (rc=${rc}) — fallback: Python do host"
          rc=0
          python3 scripts/validate-migration-syntax.py --dir supabase/migrations || rc=$?
          if [ "$rc" = "1" ]; then
            echo "::error::Erro de sintaxe SQL detectado pelo gate (host) — bloqueante"
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::Nenhum validador de sintaxe SQL disponível (container e host $(python3 -V 2>&1)) — gate bloqueante não pode rodar, falhando por segurança"
            exit "$rc"
          fi
          exit 0

      - name: Collect and apply migrations (delta - so as que mudaram)
        # OTIMIZACAO v2: copia/aplica SOMENTE as migrations do PR/push, nao todas as 400+.
        # O linter estatico (step anterior) e a gate real de erros de sintaxe.
        continue-on-error: true
        run: |
          MIGRATION_DIR="supabase/migrations"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          CHANGED_MIGRATIONS=$(git diff --name-only "$BASE"...HEAD -- "$MIGRATION_DIR" 2>/dev/null \
            | grep -E '[0-9]{14}_.*\.sql$' || true)

          if [ -z "$CHANGED_MIGRATIONS" ]; then
            echo "Nenhuma migration alterada -- smoke test Postgres ignorado."
            exit 0
          fi

          echo "Migrations a testar (delta):"; echo "$CHANGED_MIGRATIONS"
          TOTAL=$(echo "$CHANGED_MIGRATIONS" | wc -l | tr -d ' ')

          # Copiar APENAS as migrations do delta para o container
          docker exec pg-smoke mkdir -p /tmp/mig
          echo "$CHANGED_MIGRATIONS" | while IFS= read -r f; do
            [ -f "$f" ] && docker cp "$f" pg-smoke:/tmp/mig/ 2>/dev/null || true
          done

          # Aplicar em ordem de timestamp
          APPLIED=0; FIRST_ERROR=''
          for f in $(echo "$CHANGED_MIGRATIONS" | sort); do
            bn=$(basename "$f")
            echo "Applying: $bn"
            if ! docker exec pg-smoke psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f "/tmp/mig/$bn" 2>&1; then
              echo "::warning file=$f::Apply falhou (dependencia incremental): $f"
              FIRST_ERROR="$f"; break
            fi
            APPLIED=$((APPLIED + 1))
          done

          echo "------------------------------------"
          echo "Applied: $APPLIED / $TOTAL (delta do PR/push)"
          [ -n "$FIRST_ERROR" ] && echo "First failure: $FIRST_ERROR"
          exit 0

      - name: Verify expected schemas exist
        run: |
          docker exec pg-smoke psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'PSQLEOF'
            DO $$
            DECLARE
              missing text[] := '{}';
              s text;
            BEGIN
              FOREACH s IN ARRAY ARRAY['zapp', 'evo', 'bpm', 'email_app', 'financeiro', 'ai', 'archive', 'vendas', 'ops']
              LOOP
                IF NOT EXISTS (SELECT 1 FROM information_schema.schemata WHERE schema_name = s) THEN
                  missing := array_append(missing, s);
                END IF;
              END LOOP;
              IF array_length(missing, 1) > 0 THEN
                RAISE NOTICE 'NOTE: Expected schemas not created by migrations (incremental schema - ok): %', array_to_string(missing, ', ');
              ELSE
                RAISE NOTICE 'All expected schemas present. v';
              END IF;
            END;
            $$;
          PSQLEOF

      - name: Stop Postgres container
        if: always()
        run: docker rm -f pg-smoke 2>/dev/null || true
