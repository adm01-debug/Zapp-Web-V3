    <script>(function recoverPreview(){try{var FLAG='zapp_sw_purged_v2';if('serviceWorker' in navigator&&!sessionStorage.getItem(FLAG)){navigator.serviceWorker.getRegistrations().then(function(regs){var hadAny=regs.length>0;return Promise.all(regs.map(function(r){return r.unregister();})).then(function(){if(typeof caches!=='undefined'){return caches.keys().then(function(keys){var hadCaches=keys.length>0;return Promise.all(keys.map(function(k){return caches.delete(k);})).then(function(){return hadAny||hadCaches;});});}return hadAny;}).then(function(needsReload){if(needsReload){sessionStorage.setItem(FLAG,'1');window.location.reload();}});}).catch(function(){});}}catch(e){}})();</script>
    <script>(function(){var root=document.getElementById('root');var loader=document.getElementById('root-loading');var KEY='zapp_boot_reloads';var MAX_RELOADS=2;window.__zappHideRootLoader=function(){if(loader){loader.style.opacity='0';setTimeout(function(){if(loader.parentNode)loader.remove();},400);}};var i=setInterval(function(){if(root&&root.childElementCount>0){try{sessionStorage.removeItem(KEY);}catch(e){}window.__zappHideRootLoader();clearInterval(i);}},100);setTimeout(function(){if(root&&root.childElementCount===0){var sub=document.getElementById('root-loading-subtitle');var n=0;try{n=parseInt(sessionStorage.getItem(KEY)||'0',10)||0;}catch(e){}if(n<MAX_RELOADS){clearInterval(i);try{sessionStorage.setItem(KEY,String(n+1));}catch(e){}if(sub)sub.textContent='Recarregando…';setTimeout(function(){window.location.reload();},800);}else if(sub){sub.textContent='Isto está demorando mais que o esperado. Verifique sua conexão — o app continuará tentando carregar.';}}else{clearInterval(i);window.__zappHideRootLoader();}},6000);})();</script>
