server {
  listen 80;
  server_name zappweb.app.br www.zappweb.app.br;

  root /usr/share/nginx/html;
  index index.html;

  # Segurança básica
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
  # CSP v9 — 2026-08-03: unificado com vercel.json (todos os domínios de ambos)
  # NOTA DE SEGURANÇA: allrjhkpuscmgbsnmjlv.supabase.co é o projeto Supabase
  # Lovable antigo (pré-migração self-hosted). 1066 contatos ainda referenciam
  # avatares neste storage. O domínio é gerenciado pelo Supabase (confiável),
  # mas deve ser removido do CSP assim que os avatares forem migrados para
  # supabase.atomicabr.com.br (storage migration pendente).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://supabase.atomicabr.com.br https://allrjhkpuscmgbsnmjlv.supabase.co https://zapp-media-proxy.adm01.workers.dev https://*.whatsapp.net https://*.cdn.whatsapp.net https://pps.whatsapp.net https://imagedelivery.net https://*.googleusercontent.com https://lh3.googleusercontent.com https://*.fbcdn.net https://*.fbsbx.com https://img.youtube.com https://i.ytimg.com https://www.youtube.com; media-src 'self' data: blob: https://supabase.atomicabr.com.br https://zapp-media-proxy.adm01.workers.dev https://mmg.whatsapp.net https://*.whatsapp.net; connect-src 'self' https://supabase.atomicabr.com.br wss://supabase.atomicabr.com.br https://*.atomicabr.com.br wss://*.atomicabr.com.br https://evolution.atomicabr.com.br https://n8n.atomicabr.com.br https://api.openai.com https://generativelanguage.googleapis.com https://zapp-media-proxy.adm01.workers.dev https://*.ingest.sentry.io https://*.sentry.io https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; frame-src 'self' https://*.atomicabr.com.br; form-action 'self'; base-uri 'self'; frame-ancestors 'self';" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
