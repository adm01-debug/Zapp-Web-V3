server {
  listen 80;
  server_name zappweb.app.br www.zappweb.app.br;

  root /usr/share/nginx/html;
  index index.html;

  # Segurança básica
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
  # CSP v10 — 2026-08-04: CANÔNICA — fonte única de verdade em docs/csp.md (NÃO divergir)
  # NOTA DE SEGURANÇA (BAND-AID TEMPORÁRIO): allrjhkpuscmgbsnmjlv.supabase.co é o
  # projeto Supabase Lovable antigo (pré-migração self-hosted). 1066 contatos
  # ainda referenciam avatares neste storage (~1370 objetos no bucket avatars).
  # O domínio é gerenciado pelo Supabase (confiável), mas deve ser removido do
  # img-src assim que os avatares forem migrados para supabase.atomicabr.com.br
  # (storage migration pendente). NÃO remover antes da migração — avatares quebrariam.
  add_header Content-Security-Policy "default-src 'self'; manifest-src 'self' data: https://vercel.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://supabase.atomicabr.com.br https://allrjhkpuscmgbsnmjlv.supabase.co https://zapp-media-proxy.adm01.workers.dev https://*.googleusercontent.com https://lh3.googleusercontent.com https://*.whatsapp.net https://*.cdn.whatsapp.net https://pps.whatsapp.net https://imagedelivery.net https://*.fbcdn.net https://*.fbsbx.com https://img.youtube.com https://i.ytimg.com https://www.youtube.com; media-src 'self' data: blob: https://supabase.atomicabr.com.br https://zapp-media-proxy.adm01.workers.dev https://mmg.whatsapp.net https://*.whatsapp.net; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://supabase.atomicabr.com.br wss://supabase.atomicabr.com.br https://evolution.atomicabr.com.br https://n8n.atomicabr.com.br https://*.atomicabr.com.br wss://*.atomicabr.com.br https://api.openai.com https://generativelanguage.googleapis.com https://zapp-media-proxy.adm01.workers.dev https://*.ingest.sentry.io https://*.sentry.io https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; frame-src 'self' https://*.atomicabr.com.br; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
