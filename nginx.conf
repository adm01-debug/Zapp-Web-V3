server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;
  # CSP v7 — 2026-07-28: adicionado zapp-media-proxy.adm01.workers.dev para proxy de mídia WhatsApp (fix 403)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://supabase.atomicabr.com.br https://zapp-media-proxy.adm01.workers.dev https://*.whatsapp.net https://*.cdn.whatsapp.net https://pps.whatsapp.net https://imagedelivery.net; media-src 'self' data: blob: https://supabase.atomicabr.com.br https://zapp-media-proxy.adm01.workers.dev; connect-src 'self' https://supabase.atomicabr.com.br wss://supabase.atomicabr.com.br https://*.atomicabr.com.br wss://*.atomicabr.com.br https://api.openai.com https://generativelanguage.googleapis.com https://zapp-media-proxy.adm01.workers.dev; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; frame-src 'self' https://*.atomicabr.com.br; form-action 'self'; base-uri 'self'; frame-ancestors 'self';" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    add_header Cache-Control "no-store";
    return 200 "ok\n";
  }

  location = /version.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
